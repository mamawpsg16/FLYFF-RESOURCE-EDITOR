<style>
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --bg: #0f1218;
  --panel: #161b24;
  --panel-2: #1c2330;
  --line: #2a3342;
  --text: #dde3ee;
  --muted: #8a96aa;
  --accent: #4f8cff;
  --accent-2: #2f6be0;
  --ok: #3ccf8e;
  --warn: #f2b84b;
  --bad: #ff5d5d;
  --add: #16391f;
  --del: #43191b;
  --normal: #c9d1de;
  --unique: #f2b84b;
  --ultimate: #c77dff;
  --baruna: #4fd1e8;
  --radius: 6px;
  font-size: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; overflow: clip; }   /* clip: focus/scrollIntoView can't shift the page either */
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent-2); border-color: var(--accent); }
button.danger { background: #5a1d22; border-color: var(--bad); }
button.icon { padding: 2px 8px; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 8px; min-width: 0; }
input:focus, select:focus { outline: 1px solid var(--accent); }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 6px 10px; }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { flex: 1; }
.check { display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--muted); font-size: 12px; }

#toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.version { margin-left: auto; font-size: 12px; white-space: nowrap; }
.tb-group { display: flex; gap: 6px; }
.tb-files { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.file-chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.file-chip.ok::before { content: "✓ "; color: var(--ok); }
.file-chip.missing::before { content: "✗ "; color: var(--bad); }
.file-chip.ro::before { content: "🔒 "; }
.file-chip.dirty { border-color: var(--warn); }
.diag-badge { border-radius: 12px; min-width: 40px; }
.diag-badge.has-warn { border-color: var(--warn); color: var(--warn); }
.diag-badge.has-block { border-color: var(--bad); color: var(--bad); background: #3a1518; }

#banners .banner { padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.banner.info { background: #14243f; }
.banner.warn { background: #3a2e12; }
.banner.bad { background: #3a1518; }

#layout { flex: 1; display: grid; grid-template-columns: 270px 1fr 430px; grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; overflow: clip; }   /* the row must not grow past the window */
aside, section { min-height: 0; display: flex; flex-direction: column; }
#left { border-right: 1px solid var(--line); background: var(--panel); }
#right { border-left: 1px solid var(--line); background: var(--panel); }
#center { overflow: hidden; overflow: clip; }
.panel-head { padding: 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.panel-head.col { flex-direction: column; align-items: stretch; }
.panel-head input[type=search] { flex: 1; }
.list { overflow-y: auto; flex: 1; min-height: 0; }

.npc { padding: 7px 12px; border-bottom: 1px solid #1f2633; cursor: pointer; }
.npc:hover { background: var(--panel-2); }
.npc.sel { background: #1d2c47; border-left: 3px solid var(--accent); padding-left: 9px; }
.npc .n { display: flex; justify-content: space-between; gap: 6px; }
.npc .k { font-size: 11px; color: var(--muted); }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.chip { color: var(--bad); border-color: #6b2b2b; }
.tag.edit { color: var(--warn); border-color: #6b5520; }
.tag.warn { color: var(--warn); }
.tag.bad { color: var(--bad); }

#editor { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 64px; }   /* min-height 0: scroll instead of growing past the window */
.empty-state { text-align: center; padding-top: 12vh !important; color: var(--text); }
.npc-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.npc-title h2 { margin: 0; font-size: 20px; }
.tabs { display: flex; gap: 4px; margin: 14px 0 10px; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; background: transparent; }
.tabs button.sel { background: var(--panel-2); border-color: var(--accent); }
.tabs .count { color: var(--muted); font-size: 11px; margin-left: 4px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 6px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 5px 8px; border-bottom: 1px solid #1f2633; text-align: left; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input[type=number], td input.num-input { width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
td select { width: 70px; }
tr.changed td:first-child { box-shadow: inset 3px 0 var(--warn); }
.def { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
.line { font-size: 11px; color: var(--muted); }
.r-normal { color: var(--normal); } .r-unique { color: var(--unique); } .r-ultimate { color: var(--ultimate); } .r-baruna { color: var(--baruna); }

#diag-panel { max-height: 38%; overflow-y: auto; border-top: 1px solid var(--line); background: var(--panel); }
.diag { padding: 6px 14px; border-bottom: 1px solid #1f2633; font-size: 13px; cursor: pointer; display: flex; gap: 8px; }
.diag:hover { background: var(--panel-2); }
.diag .sev { font-weight: 600; min-width: 46px; }
.diag .sev.BLOCK { color: var(--bad); } .diag .sev.WARN { color: var(--warn); } .diag .sev.INFO { color: var(--muted); }
.diag .new { color: var(--bad); font-size: 11px; }

.chips { flex-wrap: wrap; }
.chip { flex: 0 0 auto !important; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
.chip[data-r=normal].on { border-color: var(--normal); color: var(--normal); }
.chip[data-r=unique].on { border-color: var(--unique); color: var(--unique); }
.chip[data-r=ultimate].on { border-color: var(--ultimate); color: var(--ultimate); }
.chip[data-r=baruna].on { border-color: var(--baruna); color: var(--baruna); }
.chip.on { background: #222b3a; }
.item-head, .item { display: grid; grid-template-columns: 1fr 92px 34px 74px 34px; gap: 6px; align-items: center; padding: 0 10px; }
.item-head { font-size: 11px; color: var(--muted); padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.virtual { position: relative; }
.item { position: absolute; left: 0; right: 0; height: 40px; border-bottom: 1px solid #1f2633; font-size: 13px; }
.item:hover { background: var(--panel-2); }
.item .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.15; }
.item .nm .def { display: block; overflow: hidden; text-overflow: ellipsis; }
.item .ty { font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item .num { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.item button { padding: 0 8px; font-weight: 700; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(980px, 92vw); max-height: 88vh; display: flex; flex-direction: column; }
.modal header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal .body { padding: 12px 16px; overflow-y: auto; flex: 1; }
.modal footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

<body class="start">
<header id="toolbar">
  <div id="mode-tabs" class="tb-group task-bar"></div>
  <div class="tb-group task-only">
    <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
    <button id="btn-save" class="primary" title="Save (Ctrl+S): backs up the current files first, then writes" disabled>Save</button>
  </div>
  <div id="file-status" class="tb-files task-only"></div>
  <button id="btn-diag" class="diag-badge task-only" title="Problems in this task's files: click to list them">0</button>
  <span id="version" class="version muted"></span>
</header>
<div id="banners"></div>
<main id="layout">
  <aside id="left">
    <div class="panel-head">
      <input id="list-search" type="search" placeholder="Search" autocomplete="off">
      <span id="list-action"></span>
      <span id="list-extra"></span>
    </div>
    <div id="list" class="list"></div>
  </aside>
  <section id="center">
    <div id="editor"></div>
    <div id="diag-panel" hidden></div>
  </section>
  <aside id="right">
    <div class="panel-head col">
      <input id="item-search" type="search" placeholder="Search items (name or II_)" autocomplete="off">
      <div class="row">
        <div id="item-cat" class="item-cat" title="The editor's item categories (type to search)"></div>
        <select id="item-ik3" title="The game's raw item type (dwItemKind3)"><option value="">All game types</option></select>
      </div>
      <div class="row chips" id="rarity-chips">
        <button class="chip" data-r="normal">Normal</button>
        <button class="chip" data-r="unique">Unique</button>
        <button class="chip" data-r="ultimate">Ultimate</button>
        <button class="chip" data-r="baruna">Baruna</button>
      </div>
      <label class="row small" id="new-price-row" title="Empty = the item's own price (dwCost in Spec_Item.txt). A price is written as AddShopItem( tab, item, price ) and becomes the item's price on the whole server, in every shop.">Price for items added with +
        <input id="new-price" type="text" inputmode="numeric" placeholder="item's own price">
      </label>
      <div class="muted small" id="new-price-hint">Empty = the item's own price (dwCost). A price here applies server-wide.</div>
    </div>

// ---- loaders/item-category.js ----
// The editor's own item categories for the item lists (asked 2026-10-07: "why is the category so not
// specific, e.g. buff pets, raised pets"). The game has three kind numbers per item (Spec_Item.txt
// dwItemKind1/2/3, defineItemkind.h): IK1 is very broad (pets are GENERAL), IK3 has 206 raw names.
// Each item gets one { group, sub } here, decided from those kinds, in this order; the first rule that
// matches wins. Only boxes and sets need the name: the game files them under the same kind as scrolls.
// Pets follow the game's own tests:
//   raised pet  IK3_EGG                                   (CItemElem::IsPet / the pet system)
//   buff pet    IK3_PET and dwReferStat1 == PET_VIS        (ItemProp::IsVisPet, ProjectCmn.h:593)
//   pickup pet  any other IK3_PET                          (CItemElem::IsEatPet, Item.h:236)
// Not game behaviour: only a way to find items. Everything not matched lands in "Other".
(function (FRE) {
  'use strict';
  const W = { SWD: 'Swords', AXE: 'Axes', BOW: 'Bows', CROSSBOW: 'Crossbows', CHEERSTICK: 'Sticks', KNUCKLEHAMMER: 'Knuckles',
    YOYO: 'Yo-yos', STAFF: 'Staffs', WAND: 'Wands', HAND: 'Bare hand' };
  const A = { SUIT: 'Suits', HELMET: 'Helmets', GAUNTLET: 'Gauntlets', BOOTS: 'Boots', SHIELD: 'Shields', MAGICBARUNA: 'Baruna off-hand', ZEMBARUNA: 'Baruna off-hand' };
  const F = { CLOTH: 'Suits', HAT: 'Hats', GLOVE: 'Gloves', SHOES: 'Shoes', MASK: 'Masks', CLOAK: 'Cloaks' };
  const J = { RING: 'Rings', EARRING: 'Earrings', NECKLACE: 'Necklaces' };
  const R = { BOARD: 'Boards', STICK: 'Brooms', MOUNT: 'Mounts', WING: 'Wings', CAR: 'Cars', ACCEL: 'Fuel' };
  const GROUPS = ['Weapons', 'Armor', 'Fashion', 'Jewelry', 'Pets', 'Rides', 'Food & potions', 'Buffs', 'Scrolls', 'Upgrade materials',
    'Boxes & tickets', 'Teleport', 'Housing', 'Quest & event', 'System', 'Other'];
  const RARITY_GROUPS = new Set(['Weapons', 'Armor']);     // dwItemGrade is Normal for every other item

  const strip = (n, p) => (n || '').replace(p, '');
  const pretty = s => s.toLowerCase().replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());

  // info: Workspace.itemInfo (ik1, ik2, ik3, referStat1, name); D: the defines
  function of(info, D) {
    const k1 = strip(D.byValue('IK1_', info.ik1), /^IK1_/), k2 = strip(D.byValue('IK2_', info.ik2), /^IK2_/), k3 = strip(D.byValue('IK3_', info.ik3), /^IK3_/);
    const vis = D.defines.has('PET_VIS') ? D.defines.get('PET_VIS') : 1;
    const name = info.name || '';
    const c = (group, sub) => ({ group, sub });
    if (k2 === 'MOB') return c('System', 'Monster weapons (not items)');
    if (k1 === 'WEAPON' || k2.startsWith('WEAPON_')) return c('Weapons', W[k3] || pretty(k3));
    if (k2 === 'ARMOR' || k2 === 'ARMORETC') return c('Armor', A[k3] || pretty(k3));
    if (k2 === 'CLOTH' || k2 === 'CLOTHETC') return c('Fashion', F[k3] || pretty(k3));
    if (k2 === 'JEWELRY') return c('Jewelry', J[k3] || pretty(k3));
    if (k3 === 'EGG') return c('Pets', 'Raised pets');
    if (k3 === 'PET') return c('Pets', info.referStat1 === vis ? 'Buff pets' : 'Pickup pets');
    if (k3 === 'VIS') return c('Pets', 'Buff pet beads (Vis)');
    if (k3 === 'FEED') return c('Pets', 'Pet food');
    if (/PET_RANDOMOPTION|^SYSTEMPET_|^EATPET_/.test(k3)) return c('Pets', 'Pet scrolls');
    if (k3 === 'SUMMON_NPC') return c('Pets', 'Upgrade spirits');
    if (k1 === 'RIDE') return c('Rides', R[k3] || pretty(k3));
    if (k1 === 'HOUSING') return c('Housing', /^GUILDHOU/.test(k2) ? 'Guild house' : k2 === 'PAPERING' ? 'Walls & floors' : 'Furniture');
    if (k1 === 'GOLD') return c('System', 'Penya');
    if (k2 === 'GMTEXT' || k2 === 'TEXT') return c('System', k2 === 'GMTEXT' ? 'GM items' : 'Letters');
    if (k3 === 'QUEST') return c('Quest & event', 'Quest items');
    if (k3 === 'EVENTMAIN' || k3 === 'DELETE') return c('Quest & event', 'Event items');
    if (k3 === 'BOX' || k3 === 'BOXOPEN') return c('Boxes & tickets', 'Treasure boxes & keys');
    if (k3 === 'TICKET') return c('Boxes & tickets', 'Tickets');
    if (k3 === 'KEY') return c('Boxes & tickets', 'Keys');
    if ((k3 === 'SCROLL' || k3 === 'EVENTSUB' || k3 === 'GEM') && /\b(box|package|set|chest|pouch|bundle|giftbox)\b/i.test(name)) return c('Boxes & tickets', 'Boxes & sets');
    if (k3 === 'EVENTSUB') return c('Quest & event', 'Event items');
    if (k2 === 'BLINKWING' || k2 === 'WARP' || k2 === 'TELEPORTMAP' || k3 === 'MAP') return c('Teleport', k2 === 'WARP' ? 'Couple rings' : k2 === 'TELEPORTMAP' ? 'Teleport maps' : k3 === 'MAP' ? 'Maps' : 'Blinkwings');
    if (k3.startsWith('POTION_BUFF') || (k2 === 'BUFF' && k3 === 'POTION')) return c('Food & potions', 'Buff potions');
    if (k2 === 'FOOD' || k3 === 'FOODELLDIN') return c('Food & potions', 'Food');
    if (k2 === 'POTION' || k2 === 'REFRESHER' || k2 === 'ELLDINPOTION') return c('Food & potions', 'Potions & refreshers');
    if (k3 === 'EXP_RATE') return c('Buffs', 'EXP scrolls');
    if (k3 === 'ARMOREFFECTCHANGE') return c('Buffs', 'Auras');
    if (k2 === 'BUFF' || k2 === 'BUFF2' || k2 === 'BUFF_TOGIFT' || (k1 === 'EFFECT' && k2 === 'KEEP')) return c('Buffs', 'Buff items');
    if (/RANDOMOPTION|LOOKRESTORE/.test(k3)) return c('Scrolls', 'Awakening & blessing');
    if (/PROTECTION|_SAFE$|DEFENDER|_KEEP$/.test(k3)) return c('Scrolls', 'Protection');
    if (/ENCHANT_RATE|UPGRADE_RATE|PIERCE_RATE|ELE_PROP/.test(k3)) return c('Scrolls', 'Upgrade chance');
    if (/LEVELDOWN|DECREASE_EQUIP/.test(k3)) return c('Scrolls', 'Level');
    if (/PKPENALTY/.test(k3)) return c('Scrolls', 'PK');
    if (k2 === 'MATERIAL' || k2 === 'BARUNA' || k3 === 'GEM' || /PIERCE_RUNE/.test(k3)) {
      if (/CARD/.test(k3)) return c('Upgrade materials', 'Cards');
      if (/DICE/.test(k3)) return c('Upgrade materials', 'Dice');
      if (k3 === 'ULTIMATE') return c('Upgrade materials', 'Ultimate jewels');
      if (/^(CID|OPER)/.test(k3)) return c('Upgrade materials', 'Cid & Oper');
      if (k3 === 'GEM') return c('Upgrade materials', 'Gems');
      if (k2 === 'BARUNA' || /RUNE/.test(k3)) return c('Upgrade materials', 'Baruna');

  function tree(items) {
    const m = new Map();
    for (const it of items) {
      const g = m.get(it.cat.group) || { group: it.cat.group, n: 0, subs: new Map() };
      g.n++; g.subs.set(it.cat.sub, (g.subs.get(it.cat.sub) || 0) + 1);
      m.set(it.cat.group, g);
    }
    return GROUPS.filter(g => m.has(g)).map(g => {
      const x = m.get(g);
      return { group: g, n: x.n, subs: [...x.subs].map(([sub, n]) => ({ sub, n })).sort((a, b) => a.sub.localeCompare(b.sub)) };
    });
  }

            shape: open.text === '(' && close.text === ')', gen: genAt(t.start) };
          block.entries.push(e); mon.kinds.push(e);
        } else if (w === 'DropGold') {
          const open = s.getToken();
          const min = s.getNumber();
          const comma = s.getToken();
          const max = s.getNumber();
          const close = s.getToken();
          const e = { kind: 'gold', block, start: t.start, end: close.end, min, max, minValue: u32(min.value), maxValue: u32(max.value),
            shape: open.text === '(' && comma.text === ',' && close.text === ')', gen: genAt(t.start) };
          block.entries.push(e); mon.list.push(e);
        } else if (w === 'Transform') {
          s.getToken(); s.getFloat(); s.getToken(); s.getNumber(); s.getToken();
        }
        t = s.getToken();
      }
      if (stopped) break;
      if (hung) {
        stopped = { start: block.start, end: text.length, reason: 'braces' };
        add({ code: 'M_BRACES', severity: 'BLOCK', start: block.start, end: block.defEnd, key: `M_BRACES|${define}`,
          message: `${define}: its { } block is never closed. The server loops forever at startup` });
        break;
      }
      block.close = { start: t.start, end: t.end };
      nVal = s.getNumber();
    } while (!s.eof);

    // monster-level facts the checks and the UI need
    for (const mon of monsters.values()) mon.maxValue = mon.maxitem ? u32(mon.maxitem.value.value) : 0;
    return { file: file.name, monsters, blocks, stopped, diags: s.diags.map(d => Object.assign({ module: 'drops' }, d)).concat(diags), size, gens };
  }

  // ---- except.txt (Project.cpp:5059): ids with "worldDrop = 0" for the server's language are not event drops ----
  function loadExcept(file, ctx) {
    const set = new Set();
    if (!file) return set;
    const s = new Script(file.text, { file: file.name, defines: ctx.defines, strings: ctx.strings, diags: [] });
    const lang = ctx.lang != null ? ctx.lang : LANG_USA, sub = ctx.subLang != null ? ctx.subLang : SUBLANG;
    let t = s.getToken();
    while (!s.eof) {
      const nLang = FRE.lexer.atoi(t.text).value;
      const nSub = s.getNumber().value;
      s.getToken();
      t = s.getToken();
      while (t.text[0] !== '}' && t.type !== 'eof') {
        if (t.text === 'ItemProp') {
          s.getToken();
          t = s.getToken();                                  // dwID
          while (t.text[0] !== '}' && t.type !== 'eof') {
            const id = u32(FRE.lexer.atoi(t.text).value);
            s.getToken();                                     // {
            t = s.getToken();
            while (t.text[0] !== '}' && t.type !== 'eof') {
              if (nLang !== lang || nSub !== sub) { t = s.getToken(); continue; }
              const w = t.text;
              if (w === 'fFlightSpeed') { s.getToken(); s.getFloat(); s.getToken(); }
              else if (w === 'dwShopAble' || w === 'dwCircleTime' || w === 'dwFlag' || w === 'dwLimitLevel1' || w === 'dwSkillReadyType') { s.getToken(); s.getNumber(); s.getToken(); }
              else if (w === 'worldDrop') { s.getToken(); if (!s.getNumber().value) set.add(id); s.getToken(); }
              t = s.getToken();
            }
            t = s.getToken();
          }
        }
        t = s.getToken();
      }
      t = s.getToken();
    }
    return set;
  }

  // ---- propDropEvent.inc (Project.cpp:4013): DropItem( id, prob, level, number, minLv, maxLv ) for every monster in the level range ----
  // II_GEN_SKILL_BUFFBREAKER: half chance when the language is not Korean (Project.cpp:4044).
  function loadDropEvent(file, ctx) {
    const out = [];
    if (!file) return out;
    const s = new Script(file.text, { file: file.name, defines: ctx.defines, strings: ctx.strings, diags: [] });
    const except = ctx.except || new Set();
    const buff = ctx.defines.get('II_GEN_SKILL_BUFFBREAKER');
    do {
      const t = s.getToken();
      if (t.text !== 'DropItem') continue;
      s.getToken(); const id = s.getNumber();
      s.getToken(); const prob = s.getNumber();
      s.getToken(); const level = s.getNumber();
      s.getToken(); const num = s.getNumber();
      s.getToken(); const minLv = s.getNumber();
      s.getToken(); const maxLv = s.getNumber();
      s.getToken();
      const itemId = u32(id.value);
      if (except.has(itemId)) continue;
      let p = u32(prob.value);
      if (buff != null && itemId === u32(buff)) p = u32(Math.trunc(p * 0.5));
      out.push({ kind: 'item', event: true, start: t.start, end: maxLv.end, itemId, define: id.define || file.text.slice(id.start, id.end),
        probability: p, levelValue: u32(level.value), number: u32(num.value), minLv: u32(minLv.value), maxLv: u32(maxLv.value) });
    } while (!s.eof);
    return out;
  }

  // The event lines a monster gets: pProp->dwID && minLv <= dwLevel <= maxLv (Project.cpp:4048-4052)
  const eventLinesFor = (events, mover) => mover && mover.id ? events.filter(e => u32(mover.level) >= e.minLv && u32(mover.level) <= e.maxLv) : [];

  // ---- PenyaTable.txt (PenyaTable.cpp:9): a bare CScanner (no #define lookup) ----
  function loadPenyaTable(file) {
    const tbl = { rows: [], rankPct: new Array(16).fill(0), rankAtLeast: new Array(16).fill(false), worlds: [] };
    if (!file) return tbl;
    const s = new Script(file.text, { file: file.name, defines: new Map(), diags: [] });
    let t = s.getToken();
    while (!s.eof) {
      if (t.text === 'LEVELS') {
        s.getToken();
        let lv = s.getNumber().value;
        while (s.token.text[0] !== '}' && !s.eof) {
          const row = { level: lv, min: s.getNumber().value, max: s.getNumber().value };
          if (row.min >= 0 && row.max >= row.min) {
            let i = 0;
            while (i < tbl.rows.length && tbl.rows[i].level < row.level) i++;
            tbl.rows.splice(i, 0, row);
          }
          lv = s.getNumber().value;
        }
      } else if (t.text === 'RANKS') {
        s.getToken();
        let rank = s.getNumber().value;
        while (s.token.text[0] !== '}' && !s.eof) {
          const pct = s.getNumber().value, mode = s.getNumber().value;
          if (rank > 0 && rank < 16 && pct > 0) { tbl.rankPct[rank] = pct; tbl.rankAtLeast[rank] = mode === 1; }
          rank = s.getNumber().value;
        }
      } else if (t.text === 'WORLDS') {
        s.getToken();
        let w = s.getNumber().value;
        while (s.token.text[0] !== '}' && !s.eof) {
          const pct = s.getNumber().value;
          if (w > 0 && pct > 0) tbl.worlds.push([u32(w), pct]);
          w = s.getNumber().value;
        }
      } else break;
      t = s.getToken();
    }
    return tbl;
  }

  // ---- expTable.inc expDropLuck { 122 x 11 values } (Project.cpp:3815) ----
  function loadDropLuck(file) {
    const luck = Array.from({ length: 122 }, () => new Array(11).fill(0));
    if (!file) return null;
    const s = new Script(file.text, { file: file.name, defines: new Map(), diags: [] });
    let t;
    do { t = s.getToken(); } while (!s.eof && t.text !== 'expDropLuck');
    if (s.eof) return null;
    s.getToken();
    let i = 0, v = s.getNumber();
    while (s.token.text[0] !== '}' && !s.eof) {
      if (i < 122 * 11) luck[Math.floor(i / 11)][i % 11] = u32(v.value);
      i++;
      v = s.getNumber();
    }
    return luck;
  }

  // ---- Event.lua: the events on now, and their item / piece / gold rates (EventFunc.lua GetEventState, Get*Rate) ----
  function loadEventRates(file, now) {
    const res = { events: [], item: 1, piece: 1, gold: 1 };
    if (!file) return res;
    let text = file.text.replace(/--\[\[[\s\S]*?\]\]/g, m => m.replace(/[^\n]/g, ' '));
    text = text.replace(/--[^\n]*/g, '');
    const stamp = d => Number(`${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`);
    const nowN = stamp(now || new Date());
    let ev = null;
    const re = /\b(AddEvent|SetTime|SetItemDropRate|SetPieceItemDropRate|SetGoldDropFactor)\s*\(([^)]*)\)/g;
    let m;
    while ((m = re.exec(text))) {
      const args = m[2].split(',').map(a => a.trim().replace(/^"|"$/g, ''));
      if (m[1] === 'AddEvent') { ev = { name: args[0], times: [], item: null, piece: null, gold: null }; res.events.push(ev); continue; }
      if (!ev) continue;
      if (m[1] === 'SetTime') ev.times.push(args.map(a => Number(a.replace(/\D/g, ''))));
      else if (m[1] === 'SetItemDropRate') ev.item = Number(args[0]);
      else if (m[1] === 'SetPieceItemDropRate') ev.piece = Number(args[0]);
      else ev.gold = Number(args[0]);
    }
    for (const e of res.events) {
      let on = false;
      for (const [a, b] of e.times) if (a <= nowN) on = b > nowN;
      e.on = on;
      if (!on) continue;
      if (e.item != null) res.item *= e.item;
      if (e.piece != null) res.piece *= e.piece;
      if (e.gold != null) res.gold *= e.gold;
    }
    return res;
  }

  // ---- m_itemKindAry / m_minMaxIdxAry (Project.cpp:4983-5040) ----
  // Items by id ascending (m_aPropItem is indexed by dwID), per dwItemKind3; then an exchange sort by dwItemRare
  // (not stable: copied exactly); then the first / last index of each rarity below MAX_UNIQUE_SIZE (400).
  // Not modelled: __NEW_STACKABLE_AMPS copies of experience scrolls (ProjectCmn.cpp:891) get extra ids.
  function kindArrays(items) {
    const get = (it, f) => FRE.specItem.get(it, f);
    const byIk3 = new Map();
    const ids = [...items.keys()].sort((a, b) => a - b);
    for (const id of ids) {
      const it = items.get(id);
      const ik3 = u32(get(it, 'dwItemKind3'));
      if (ik3 === 0xFFFFFFFF) continue;
      if (!byIk3.has(ik3)) byIk3.set(ik3, []);
      byIk3.get(ik3).push({ id, rare: u32(get(it, 'dwItemRare')), lv: u32(get(it, 'dwItemLV')), ik1: get(it, 'dwItemKind1'), item: it });
    }
    const out = new Map();
    for (const [ik3, a] of byIk3) {
      for (let j = 0; j < a.length - 1; j++) for (let k = j + 1; k < a.length; k++) {
        if (a[k].rare < a[j].rare) { const t = a[j]; a[j] = a[k]; a[k] = t; }
      }
      const minMax = new Map();
      let rare = 0xFFFFFFFF;
      for (let j = 0; j < a.length; j++) {
        if (rare !== a[j].rare) {
          rare = a[j].rare;
          if (rare !== 0xFFFFFFFF) minMax.set(rare, [j, j]);
        } else if (rare !== 0xFFFFFFFF) minMax.get(rare)[1] = j;
      }
      out.set(ik3, { list: a, minMax });
    }
    return out;
  }
  const minIdx = (ka, ik3, rare) => { if (rare >= 400) return -1; const k = ka.get(ik3); const v = k && k.minMax.get(rare); return v ? v[0] : -1; };
  const maxIdx = (ka, ik3, rare) => { if (rare >= 400) return -1; const k = ka.get(ik3); const v = k && k.minMax.get(rare); return v ? v[1] : -1; };
  // DropKind's rarity window: monster level -5 .. -2, at least 1 (Project.cpp:3211-3216)
  function kindWindow(level) {
    const s16 = v => ((v & 0xffff) << 16) >> 16;
    let lo = s16(u32(level) - 5), hi = s16(u32(level) - 2);
    if (lo < 1) lo = 1;
    if (hi < 1) hi = 1;
    return [lo, hi];
  }

  // ---- checks ----
  // ctx: { items (Map id -> item), movers (Map id -> mover) }
  function validateDrops(model, ctx) {
    const out = [];
    const text = ctx.text || '';
    const add = d => out.push(Object.assign({ file: model.file, module: 'drops' }, d));
    for (const d of model.diags) {
      if (d.code === 'E_UNDEF') continue;               // reported below per entry, in plain words
      add(Object.assign({}, d, { key: d.key || `${d.code}|${d.name || d.message}` }));
    }
    const items = ctx.items || new Map(), movers = ctx.movers || new Map();
    const nameOf = mon => { const mv = movers.get(mon.id); return mv && mv.name ? `${mv.name} (${mon.define})` : mon.define; };
    const itemName = e => { const it = items.get(e.itemId); return it && it.name ? it.name : e.define; };
    const seen = new Map();
    for (const b of model.blocks) {
      const mon = model.monsters.get(b.id);
      const who = nameOf(mon);
      if (b.unresolved || b.id === 0) add({ code: 'M_UNDEF', severity: 'BLOCK', start: b.start, end: b.defEnd, key: `M_UNDEF|${b.define}`,
        message: `${b.define} is not defined: the server reads it as 0, so these drops belong to no monster` });
      else if (!movers.has(b.id)) add({ code: 'M_NO_MOVER', severity: 'WARN', start: b.start, end: b.defEnd, key: `M_NO_MOVER|${b.define}`,
        message: `${b.define} (id ${b.id}) has no row in propMover.txt: no such monster exists, so nothing drops these items` });
      if (seen.has(b.id)) add({ code: 'M_DUP', severity: 'WARN', start: b.start, end: b.defEnd, key: `M_DUP|${b.define}`,
        message: `${who} has two blocks: the server adds the drops of both (and the second "Maxitem" wins)` });
      seen.set(b.id, b);
      if (!b.open.ok) add({ code: 'M_BRACES', severity: 'BLOCK', start: b.start, end: b.defEnd, key: `M_BRACES|${b.define}|open`,
        message: `${who}: "${text.slice(b.open.start, b.open.end)}" stands where { should be. The server skips it and reads on` });
      for (const e of b.entries) {
        const at = { start: e.start, end: e.end };
        if (e.kind === 'item') {
          const key = `${b.define}|${e.define}|${e.probability}|${e.number}`;
          if (!e.shape) add(Object.assign(at, { code: 'M_COMMA', severity: 'BLOCK', key: `M_COMMA|${key}`,
            message: `${who}: this DropItem line is not "DropItem(item, chance, upgrade, amount);". The server reads its values shifted by one: chance ${pct(effChance(e.probability))}` }));
          if (e.itemId === 0) add(Object.assign(at, { code: 'M_DROP_UNDEF', severity: 'BLOCK', key: `M_DROP_UNDEF|${key}`,
            message: `${who}: "${e.define}" is not an item (it reads as 0). The server logs an error at startup and crashes when it drops` }));
          else if (!items.has(e.itemId)) add(Object.assign(at, { code: 'M_DROP_UNDEF', severity: 'BLOCK', key: `M_DROP_UNDEF|${key}|spec`,
            message: `${who}: ${e.define} (id ${e.itemId}) is not in Spec_Item.txt. The server crashes when it drops on the ground` }));
          if (e.number === 0) add(Object.assign(at, { code: 'M_COUNT_ZERO', severity: 'BLOCK', key: `M_COUNT_ZERO|${key}`,
            message: `${who}: ${itemName(e)} has amount 0. When it drops the server divides by zero (xRandom(0)) and crashes` }));
          if (e.prob.overflow) add(Object.assign(at, { code: 'M_PROB_OVERFLOW', severity: 'WARN', key: `M_PROB_OVERFLOW|${key}`,
            message: `${who}: ${itemName(e)}'s chance ${text.slice(e.prob.start, e.prob.end)} is above 2,147,483,647. atoi stops there, so it drops ${pct(effChance(e.probability))} of the time, not ${pct(Number(text.slice(e.prob.start, e.prob.end)) / DROP_ONE)}` }));
          else if (e.probability === 0 && e.shape) add(Object.assign(at, { code: 'M_PROB_ZERO', severity: 'WARN', key: `M_PROB_ZERO|${key}`,
            message: `${who}: ${itemName(e)} has chance 0: it never drops` }));
          if (e.toks[4] && e.toks[4].text === ',') add(Object.assign(at, { code: 'M_EXTRA_ARGS', severity: 'INFO', key: `M_EXTRA_ARGS|${key}`,
            message: `${who}: this DropItem line has more than 4 values. The server reads the first 4 and skips the rest` }));
        } else if (e.kind === 'gold') {
          const key = `${b.define}|gold`;
          if (!e.shape) add(Object.assign(at, { code: 'M_COMMA', severity: 'BLOCK', key: `M_COMMA|${key}`, message: `${who}: this DropGold line is not "DropGold(min, max);"` }));
          if (e.maxValue <= e.minValue) add(Object.assign(at, { code: 'M_GOLD_RANGE', severity: 'BLOCK', key: `M_GOLD_RANGE|${key}`,
            message: e.maxValue === e.minValue
              ? `${who}: DropGold(${e.minValue}, ${e.maxValue}): min and max are equal. The server rolls xRandom(max - min) = xRandom(0), divides by zero and crashes at the first kill`
              : `${who}: DropGold(${e.minValue}, ${e.maxValue}): min is above max. The server's roll wraps around and pays a random, wrong amount` }));
        }
      }
    }
    if (ctx.original != null && ctx.original !== text) {
      for (const g of genEdits(ctx.original, text)) {
        const [define, name] = g.key.split('|');
        const mon = [...model.monsters.values()].find(x => x.define === define);
        const b = mon ? mon.blocks[mon.blocks.length - 1] : null;
        const what = [g.changed && `${g.changed} line${g.changed > 1 ? 's' : ''} changed`, g.removed && `${g.removed} removed`].filter(Boolean).join(', ');
        add({ code: 'M_GEN_EDITED', severity: 'WARN', start: b ? b.start : 0, end: b ? b.defEnd : 0, key: `M_GEN_EDITED|${g.key}`,
          message: `${mon ? nameOf(mon) : define}: ${what} in the [${name}] block. ${GEN_SCRIPT[name] || 'Its gen_*.ps1 script'} rewrites that block when it runs again, which undoes this edit` });
      }
    }
    for (const mon of model.monsters.values()) {
      const who = nameOf(mon);
      if (mon.kinds.length > MAX_DROPKIND) add({ code: 'M_KIND_MAX', severity: 'BLOCK', start: mon.kinds[MAX_DROPKIND].start, end: mon.kinds[MAX_DROPKIND].end, key: `M_KIND_MAX|${mon.define}`,
        message: `${who} has ${mon.kinds.length} DropKind lines; the server has room for ${MAX_DROPKIND}. Line ${MAX_DROPKIND + 1} onward overwrites server memory` });
      const golds = mon.list.filter(e => e.kind === 'gold');
      if (!golds.length && movers.has(mon.id) && FRE.battlePass.isMonster(movers.get(mon.id))) add({ code: 'M_NO_GOLD', severity: 'INFO', start: mon.blocks[0].start, end: mon.blocks[0].defEnd,
        key: `M_NO_GOLD|${mon.define}`, message: `${who} has no DropGold line: it gives no Penya (PenyaTable.txt only changes a DropGold roll)` });
      // DropGold below lines that count toward Maxitem: the stop can skip the Penya (Mover.cpp:8714)
      if (mon.maxValue > 0) for (const g of golds) {
        const before = mon.list.slice(0, mon.list.indexOf(g)).filter(e => e.kind === 'item' && e.number !== 0xFFFFFFFF).length;
        if (before >= mon.maxValue) add({ code: 'M_GOLD_LATE', severity: 'WARN', start: g.start, end: g.end, key: `M_GOLD_LATE|${mon.define}`,
          message: `${who}: DropGold comes after ${before} drop lines that count toward its ${mon.maxValue}-item limit. When ${mon.maxValue} of them drop, the server stops and pays no Penya` });
      }
    }
    return out;
  }

  // Script-made lines per monster: Map("MI_X|Name" -> [trimmed lines]) for a text (genRanges + the MI_ line above each range)
  function genLines(text) {
    const out = new Map();
    const heads = [];
    const re = /^(MI_\w+)[ \t]*\r?$/gm;
    let h;
    while ((h = re.exec(text))) heads.push([h.index, h[1]]);
    let k = 0;
    for (const g of genRanges(text).sort((x, y) => x.start - y.start)) {
      while (k + 1 < heads.length && heads[k + 1][0] < g.start) k++;
      const key = `${heads.length && heads[k][0] < g.start ? heads[k][1] : '?'}|${g.name}`;
      const body = text.slice(text.indexOf('\n', g.start) + 1, g.end).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      out.set(key, (out.get(key) || []).concat(body));
    }
    return out;
  }
  // M_GEN_EDITED: script-made lines changed or removed since the file was loaded
  function genEdits(original, current) {
    const a = genLines(original), b = genLines(current), out = [];
    for (const key of new Set([...a.keys(), ...b.keys()])) {
      const left = (a.get(key) || []).slice();
      let changed = 0;
      for (const l of b.get(key) || []) { const i = left.indexOf(l); if (i >= 0) left.splice(i, 1); else changed++; }
      if (changed || left.length) out.push({ key, changed, removed: Math.max(0, left.length - changed) });
    }
    return out;
  }

  // ---- chances ----
  // xRand() is a full-period 32-bit LCG (core/xrandom.js), so over its cycle every value 0 .. 2^32-1 comes once.
  // xRandom(n) = xRand() % n: when 2^32 is not a multiple of n the low values come once more.
  // For n = 3e9 the values 0 .. 1,294,967,295 come twice: a 10% line drops 13.97% of the time.
  const TWO32 = 4294967296;
  // P( xRandom(n) < t ) for a whole t (0..n)
  function belowP(n, t) {
    t = Math.max(0, Math.min(t, n));
    return (Math.floor(TWO32 / n) * t + Math.min(t, TWO32 % n)) / TWO32;
  }
  // The first roll GetAt refuses (Project.cpp:184-208): dwRand = xRandom(3e9); dwRand = (DWORD)(dwRand / f), float32; pass while dwRand < prob.
  function getAtLimit(prob, factor) {
    const f = Math.fround(factor == null ? 1 : factor);
    const pass = x => Math.trunc(Math.fround(Math.fround(x) / f)) < prob;
    if (!pass(0)) return 0;
    if (pass(DROP_ONE - 1)) return DROP_ONE;
    let lo = 0, hi = DROP_ONE - 1;                // pass(lo), !pass(hi); pass is monotone in x
    while (hi - lo > 1) { const mid = Math.floor((lo + hi) / 2); if (pass(mid)) lo = mid; else hi = mid; }
    return hi;
  }
  // The real chance one DropItem line passes (what players get per roll that reaches it)
  const effChance = (prob, factor) => belowP(DROP_ONE, getAtLimit(prob >>> 0, factor));
  // The file value that gives (at least) a real chance p, piece factor 1: the inverse of effChance, at most INT_MAX
  function probForChance(p) {
    if (!(p > 0)) return 0;
    let lo = 0, hi = INT_MAX;                     // smallest prob with effChance(prob) >= p
    if (effChance(hi) < p) return hi;
    while (hi - lo > 1) { const mid = Math.floor((lo + hi) / 2); if (effChance(mid) >= p) hi = mid; else lo = mid; }
    return hi;
  }
  const MAX_CHANCE = () => effChance(INT_MAX);
  const pct = p => {
    const v = p * 100;

      maps: true,            // where MaFl_DONATION stands (the client opens the shop for that key, WndWorld.cpp:5835)
      parse(ws) {
        const tf = ws.files.get(FRE.donationTree.KEY);
        ws.donationTree = tf ? FRE.donationTree.loadTree(tf) : null;
        return FRE.donation.loadDonation(ws.files.get('donationshop.inc'), { defines: ws.defines.defines, strings: ws.strings.map });
      },
      validate(ws, model) {
        const out = FRE.donation.validateDonation(model, { items: ws.items.items, textOf: n => ws.textOf(n), defines: ws.defines.defines, tree: ws.donationTree });
        return ws.donationTree ? out.concat(FRE.donationTree.validateTree(ws.donationTree)) : out;
      },
    },
    {
      // BattlePass.inc (commit cc73ccdd). propMover.txt gives each monster's name, level and rank.
      id: 'battlepass', label: 'Battle Pass',
      required: ['BattlePass.inc', 'propMover.txt', 'propMover.txt.txt'], editable: ['BattlePass.inc'], client: ['BattlePass.inc'],
      parse(ws) {
        if (!ws.movers) ws.movers = FRE.propMover.loadPropMover(ws.files.get('propmover.txt'), { defines: ws.defines.defines, strings: ws.strings.map });
        return FRE.battlePass.loadBattlePass(ws.files.get('battlepass.inc'), { defines: ws.defines.defines, strings: ws.strings.map });
      },
      validate(ws, model) {
        return FRE.battlePass.validateBattlePass(model, { items: ws.items.items, movers: ws.movers.movers, defines: ws.defines.defines, now: ws.now ? ws.now() : new Date(), theme: ws.clientTheme });
      },
    },
    {
      // Exchange_Script.txt (CExchange::Load_Script). The NPC files tell which NPCs open each menu.
      // Not a start-screen task since 2026-10-07 (the user: exchanges belong to their NPC): edited in NPC Shops' ⇄ tabs.
      id: 'exchange', label: 'Exchanges', hidden: true,
      required: ['Exchange_Script.txt'], editable: ['Exchange_Script.txt'], client: ['Exchange_Script.txt'],
      deps: ['character.inc', 'character-etc.inc', 'character-school.inc'],
      uses: ['npc'],         // the NPC files are read (not edited) to name the NPCs that open each menu
      maps: true,            // reads World/*/ to tell which of those NPCs stand in the game, and where
      parse(ws) {
        return FRE.exchange.loadExchange(ws.files.get('exchange_script.txt'), { defines: ws.defines.defines });
      },
      validate(ws, model) {
        return FRE.exchange.validateExchange(model, { items: ws.items.items, npcsByMenu: ws.npcsByMenu(), packMax: it => FRE.specItem.get(it, 'dwPackMax'),
          live: ws.placed ? m => ws.isLiveMenu(m) : null });
      },
    },
    {
      // propMoverEx.inc (CProject::LoadPropMoverEx, Project.cpp:2978): each monster's drops, Penya and max items per kill.
      // Server only: the drop lines are kept #ifdef __WORLDSERVER and there is no loose Client copy.
      // optional: what the kill path also reads (loaders/drops.js), read-only here.
      id: 'drops', label: 'Monster Drops',
      required: ['propMoverEx.inc', 'propMover.txt', 'propMover.txt.txt'], editable: ['propMoverEx.inc'], client: [],
      optional: ['propDropEvent.inc', 'except.txt', 'PenyaTable.txt', 'expTable.inc', 'Event.lua', 'propItemEtc.inc'],
      parse(ws) {
        if (!ws.movers) ws.movers = FRE.propMover.loadPropMover(ws.files.get('propmover.txt'), { defines: ws.defines.defines, strings: ws.strings.map });
        if (!ws.dropContext) ws.dropContext = FRE.drops.contextFromFiles(ws);
        return FRE.drops.loadDrops(ws.files.get('propmoverex.inc'), { defines: ws.defines.defines, strings: ws.strings.map, movers: ws.movers.movers });
      },
      validate(ws, model) {
        const f = ws.files.get('propmoverex.inc');
        return FRE.drops.validateDrops(model, { items: ws.items.items, movers: ws.movers.movers, text: f.text, original: f.originalText });
      },
    },
    {
      // propGiftbox.inc (CProject::LoadGiftbox, Project.cpp:4261) = random boxes, server only (UTF-16);
      // propPackItem.inc (CProject::LoadPackItem, Project.cpp:4492) = sets; the game reads its own LF copy (Item Wiki, e08528a5).
      id: 'boxes', label: 'Boxes',
      required: ['propGiftbox.inc', 'propPackItem.inc'], editable: ['propGiftbox.inc', 'propPackItem.inc'], client: ['propPackItem.inc'],
      parse(ws) {
        const m = FRE.boxes.loadBoxes(ws.files, { defines: ws.defines.defines, strings: ws.strings.map });
        // the boxes when the task opened: a box whose contents are removed later gets BX_EMPTIED
        if (!ws._boxIds) ws._boxIds = { gift: new Set(m.gift.boxes.keys()), pack: new Set(m.pack.boxes.keys()), stack: FRE.boxes.stackKeys(m, ws.items.items) };
        return m;
      },
      validate(ws, model) {
        return FRE.boxes.validateBoxes(model, { items: ws.items.items, original: ws._boxIds });
      },
    },
  ];
  const ALL_FILES = [...new Set([...CORE, ...MODULES.flatMap(m => [...m.required, ...(m.optional || [])]), ...OPTIONAL])];

  class Workspace {
    // files: Map lowercase name -> SourceFile
    // opts.only: one task (module id). Only that module is shown, validated and editable;
    // the modules it `uses` are parsed as read-only context. Without it: every module.
    constructor(files, opts = {}) {
      this.files = files;
      this.only = opts.only || null;
      this.history = [];      // lowercase file names, in edit order (for global undo)
      this.redoStack = [];
      this.missing = CORE.filter(n => !files.has(n.toLowerCase()));
      this.models = {};
      this.moduleDiags = {};
      this.available = {};
      this.editable = new Set();
      this.donationTree = null;
      this.clientModels = null;     // lowercase file names in Client/Model (setClientModels), when the Client folder is chosen
      this.clientTextures = null;   // lowercase file names in Client/Model/Texture (setClientTextures)
      this.modelTextures = new Map(); // lowercase Mvr_X.o3d -> [texture names it uses] (addModelTextures; newNpcSim.o3dTextures)
      this.clientTheme = null;      // lowercase file names in Client/Theme (Battle Pass textures), when the Client folder is chosen
      this.placed = null;           // lowercase NPC key -> [map names] from World/*/*.dyo (null: not read)
      this.mapFiles = new Map();    // map name -> lowercase key in this.files of its .dyo (setMapFiles)
      this.worldFiles = new Map();
      this.area = null;             // FRE.area.build: where each NPC stands, named as the client names it (null: not read)
      const task = this.only ? MODULES.find(m => m.id === this.only) : null;
      if (this.only && !task) throw new Error(`unknown task ${this.only}`);
      this.active = new Set(task ? [task.id, ...(task.uses || [])] : MODULES.map(m => m.id));
      this.shown = new Set(task ? [task.id] : MODULES.map(m => m.id));
      this.validated = new Set([...this.shown, ...(task && task.alsoValidates || [])]);
      for (const m of MODULES) {
        const miss = m.required.filter(n => !files.has(n.toLowerCase()));
        this.available[m.id] = !this.active.has(m.id) ? { ok: false, missing: [], off: true } : miss.length ? { ok: false, missing: miss } : { ok: true };
        if (!miss.length && this.shown.has(m.id)) m.editable.forEach(n => this.editable.add(n.toLowerCase()));
      }
      if (!task || task.editsSpec) CORE_EDITABLE.forEach(n => { if (files.has(n.toLowerCase())) this.editable.add(n.toLowerCase()); });
    }

    load() {
      this.defines = FRE.loadDefines(this.files);
      this.strings = FRE.loadStrings(this.files);
      this.texts = FRE.textClient.load(this.files, this.strings.map, this.defines.defines);
      this.loadItems();
      // exchange menus (MMI_ names at the start of a line in Exchange_Script.txt), for display only
      const ex = this.files.get('exchange_script.txt');
      this.exchangeMenus = new Set(ex ? (ex.text.match(/^MMI_\w+/gm) || []) : []);
      this.reparse();
      this.baseline = this.keyCounts(this.diags);
      return this;
    }

    // Spec_Item.txt and everything derived from it (also after a price edit).
    loadItems() {
      const spec = this.files.get('spec_item.txt');
      this.items = spec ? FRE.specItem.loadSpecItem(spec, { defines: this.defines.defines, strings: this.strings.map })
        : { items: new Map(), rows: [], diags: [], stopped: null };
      this.itemDiags = this.items.diags.map(d => Object.assign({}, d, { key: `${d.code}|${d.file}|${d.name || d.message}` }));
      this.vendorIndex = FRE.vendorSim.buildIndex(this.items, this.defines.defines);
    }

    // Re-parse the modules that own `lowerName` (all modules when omitted).
    reparse(lowerName) {
      if (lowerName === 'spec_item.txt') { this.loadItems(); lowerName = undefined; }   // every module reads items
      // a string table (character.txt.txt: a new NPC's name): every module reads names through it
      if (lowerName && /\.txt\.txt$/.test(lowerName)) { this.strings = FRE.loadStrings(this.files); lowerName = undefined; }
      for (const m of MODULES) {
        if (!this.available[m.id].ok) continue;
        if (lowerName && ![...m.required, ...(m.deps || [])].some(n => n.toLowerCase() === lowerName)) continue;
        this.models[m.id] = m.parse(this);
        if (this.validated.has(m.id)) this.moduleDiags[m.id] = m.validate(this, this.models[m.id]);
      }
      // Spec_Item problems matter only to tasks that can change Spec_Item.txt
      const specDiags = [...this.shown].some(id => MODULES.find(m => m.id === id).editsSpec) ? this.itemDiags : [];
      this.diags = [...Object.values(this.moduleDiags).flat(), ...specDiags];
    }

    // Client/Client/DonationShopTree.inc (client-only; read from the Client folder when chosen): a SourceFile,
    // kept in this.files as 'client/donationshoptree.inc' (written into the Client folder by io/save.js),
    // editable in the Donation Shop task. The donation module parses it (this.donationTree).
    setDonationTree(file) {
      const key = FRE.donationTree.KEY;
      if (this.files.has(key)) { this.files.delete(key); this.editable.delete(key); }
      if (file) {
        file.clientOnly = true;
        file.dir = 'Client';
        this.files.set(key, file);
        if (this.shown.has('donation') && !file.readOnly) this.editable.add(key);
      }
      this.donationTree = null;
      if (this.available.donation && this.available.donation.ok) this.reparse('donationshop.inc');
    }

    // lowercase file names in Client/Model (Add New NPC: does a model have all its files?)
    setClientModels(names) {
      this.clientModels = names ? new Set([...names].map(n => n.toLowerCase())) : null;
      if (this.available.npc && this.available.npc.ok) this.reparse('character.inc');
    }

    // Client/Model/Texture file names, and the textures of .o3d files already read (Map lowercase o3d -> [names])
    setClientTextures(names, index) {
      this.clientTextures = names ? new Set([...names].map(n => n.toLowerCase())) : null;
      if (index) for (const [k, v] of index) this.modelTextures.set(k.toLowerCase(), v);
      if (this.available.npc && this.available.npc.ok) this.reparse('character.inc');
    }
    addModelTextures(o3d, names) {
      this.modelTextures.set(o3d.toLowerCase(), names);
    }

    // file names in the client's Theme folder (BattlePass.inc rarity / icon textures)
    // Rules windows (docs/patches/npc-board.diff): Client/Client/NpcBoard_<menu id>.inc, client-only files.
    // They sit in this.files as 'client/npcboard_<id>.inc' with clientOnly set; io/save.js writes them into
    // the Client folder. setBoardFiles: the ones already there (SourceFiles read from Client/Client).
    setBoardFiles(list) {
      for (const f of list || []) this._addBoard(f);
    }
    _addBoard(f) {
      f.clientOnly = true;
      f.dir = 'Client';
      const lower = 'client/' + f.name.toLowerCase();
      this.files.set(lower, f);
      if (!f.readOnly) this.editable.add(lower);
      return { lower, file: f };
    }
    // -> { lower, file } of NpcBoard_<id>.inc; create: an empty one (no bytes yet) when there is none
    boardFile(id, create = false) {
      const lower = `client/npcboard_${id}.inc`;
      if (this.files.has(lower)) return { lower, file: this.files.get(lower) };
      if (!create) return null;
      return this._addBoard(new FRE.SourceFile(`NpcBoard_${id}.inc`, new Uint8Array(0)));
    }
    // the rules text players see for menu id (null: no board file, or an empty one)
    boardTextOf(id) {
      const b = this.boardFile(id);
      return b && b.file.text.length ? b.file.text : null;
    }

    setClientTheme(names) {
      this.clientTheme = names ? new Set([...names].map(n => n.toLowerCase())) : null;
      if (this.available.battlepass && this.available.battlepass.ok) this.reparse('battlepass.inc');
    }

    // exchange menu id -> names of the NPCs with AddMenu(id) (null without the NPC files)
    npcsByMenu() {
      const by = this.npcInfoByMenu();
      return by && new Map([...by].map(([id, list]) => [id, list.map(x => x.name)]));
    }
    // exchange menu id -> [{ npc, name, key, inGame, maps, why }] (FRE.world.npcStatus)
    npcInfoByMenu() {
      if (!this.available.npc || !this.available.npc.ok || !this.chars) return null;
      const m = new Map();
      for (const npc of this.chars.npcs) for (const id of npc.menus) {
        if (!m.has(id)) m.set(id, []);
        m.get(id).push(Object.assign({ npc, name: npc.name || npc.key, key: npc.key, where: this.whereOf(npc.key) }, FRE.world.npcStatus(npc, this.placed)));
      }
      return m;
    }
    // An exchange menu players can use: it has recipes, and an NPC with it stands in the game.
    isLiveMenu(m) {
      if (!m.sets.length) return false;
      const by = this.npcInfoByMenu();
      return !!by && (by.get(m.mmi.value) || []).some(x => x.inGame);
    }
    // The maps the server loads (World.inc), for the app to read their .dyo files
    worldList() { return FRE.world.readWorldList(this.files.get('world.inc'), this.defines.defines); }
    // dyo: Map map name -> bytes of World/<name>/<name>.dyo
    // worldFiles: Map lowercase path ('world/wdmadrigal/wdmadrigal.rgn') -> SourceFile: each map's .rgn and
    // .txt.txt, and WdMadrigal.wld.cnt (read-only; loaders/area.js names the spots)
    setMapObjects(dyo, worldFiles = new Map()) {
      const placed = new Map();
      for (const [name, bytes] of dyo) for (const key of FRE.world.readDyo(bytes).movers) {
        const k = key.toLowerCase();
        if (!placed.has(k)) placed.set(k, []);
        if (!placed.get(k).includes(name)) placed.get(k).push(name);
      }
      this.placed = placed;
      const get = rel => worldFiles.get(rel.toLowerCase()) || this.files.get(rel.toLowerCase()) || null;
      this.area = FRE.area.build({ defines: this.defines.defines, get, dyo });
      for (const m of MODULES) if (m.maps && this.available[m.id].ok) this.reparse(m.required[0].toLowerCase());
    }
    // The .dyo files as SourceFiles (binary, with handles), so a task may edit them. They are kept
    // in this.files under 'world/<map>/<file>.dyo'; the NPC task may write them.
    setMapFiles(dyoFiles, worldFiles = new Map()) {
      this.worldFiles = worldFiles;
      const maps = MODULES.some(m => m.editsMaps && this.shown.has(m.id) && this.available[m.id].ok);
      for (const [name, f] of dyoFiles) {
        const lower = `${f.dir}/${f.name}`.toLowerCase();
        this.files.set(lower, f);
        this.mapFiles.set(name, lower);
        if (maps) this.editable.add(lower);
      }
      this.refreshMaps();
    }
    refreshMaps() {
      const dyo = new Map([...this.mapFiles].map(([name, lower]) => [name, this.files.get(lower).serialize()]));
      this.setMapObjects(dyo, this.worldFiles);
    }
    mapFile(name) { const l = this.mapFiles.get(name); return l ? this.files.get(l) : null; }
    // [{ place, caption, te, world, x, z, … }] where the NPC with this key stands (FRE.area.whereIs); null: maps not read
    whereOf(key) { return this.area ? FRE.area.whereIs(this.area, key) : null; }
    needsMaps() { return MODULES.some(m => m.maps && this.shown.has(m.id) && this.available[m.id].ok); }

    textOf(name) { return (this.files.get(String(name).toLowerCase()) || { text: '' }).text; }
    moduleOfFile(name) {
      const l = String(name).toLowerCase(), has = list => (list || []).some(n => n.toLowerCase() === l);
      return MODULES.find(m => has(m.required)) || MODULES.find(m => m.id === 'donation' && has(m.deps)) || null;   // + the client-only tree
    }

    isEditable(lowerName) {
      const f = this.files.get(lowerName);
      return !!f && this.editable.has(lowerName) && !f.readOnly;
    }

    fileOfNpc(npc) { return this.files.get(npc.file.toLowerCase()); }

    // Apply splices from an edit op to one file, then re-derive what depends on it.
    apply(lowerName, splices, label) {
      this.applyGroup([{ file: lowerName, splices }], label);
    }

    // Several files changed as ONE undo step. All splices are checked before any file changes.
    applyGroup(parts, label) {
      parts = parts.filter(p => p.splices.length);
      if (!parts.length) return;
      for (const p of parts) {
        if (!this.isEditable(p.file)) throw new Error(`${p.file} is not editable`);
        const f = this.files.get(p.file);
        FRE.SourceFile.spliceText(f.text, p.splices, f.kind, f.name);       // throws before anything changes
      }
      for (const p of parts) this.files.get(p.file).applySplices(p.splices, label);
      this.history.push(parts.map(p => p.file));
      this.redoStack = [];
      this._reparseAll(parts.map(p => p.file));
    }

    _reparseAll(names) {
      // a #define file (defineNeuz.h: a new SRT_ tag): everything that reads names is loaded again
      if (names.some(n => FRE.DEFINE_FILES.some(d => d.toLowerCase() === n))) {
        this.defines = FRE.loadDefines(this.files);
        this.strings = FRE.loadStrings(this.files);
        this.texts = FRE.textClient.load(this.files, this.strings.map, this.defines.defines);
        names = ['spec_item.txt', ...names];
      }
      // textClient.inc / textClient.txt.txt (a new menu's label): the TID texts are read again
      if (names.some(n => n === 'textclient.inc' || n === 'textclient.txt.txt')) {
        if (names.includes('textclient.txt.txt')) this.strings = FRE.loadStrings(this.files);
        this.texts = FRE.textClient.load(this.files, this.strings.map, this.defines.defines);
      }
      if (names.includes('exchange_script.txt')) {       // the "exchange" tags in NPC Shops (MMI_ names at a line start)
        const ex = this.files.get('exchange_script.txt');
        this.exchangeMenus = new Set(ex ? (ex.text.match(/^MMI_\w+/gm) || []) : []);
      }
      if (names.some(n => /\.dyo$/.test(n))) this.refreshMaps();
      if (names.includes('spec_item.txt')) this.reparse('spec_item.txt');   // reparses every module
      else names.forEach(n => this.reparse(n));
    }

    // Fold the last step into the one before it (typing in one field = one undo step): only when both changed
    // the same files and nothing was undone in between. Undo then goes straight back to before both.
    mergeLast() {
      const h = this.history;
      if (h.length < 2 || this.redoStack.length) return false;
      const a = h[h.length - 2], b = h[h.length - 1];
      if (a.length !== b.length || a.some((n, i) => n !== b[i])) return false;
      for (const n of b) this.files.get(n)._undo.pop();
      h.pop();
      return true;
    }

    // Fold the last n steps into ONE undo step (a new NPC + its new menus, each planned after the one before).
    // Each file keeps only its oldest snapshot of those steps, so Undo goes back to before all of them.
    foldLast(n, label) {
      const h = this.history;
      if (n < 2 || h.length < n || this.redoStack.length) return false;
      const steps = h.splice(h.length - n, n);
      const names = [...new Set(steps.flat())];
      for (const name of names) {
        const u = this.files.get(name)._undo;
        const k = steps.filter(s => s.includes(name)).length;
        u.splice(u.length - k + 1, k - 1);
        if (label) u[u.length - 1].label = label;
      }
      h.push(names);
      return true;
    }

    undo() {
      const names = this.history.pop(); if (!names) return null;
      let label = null;
      for (const n of names) label = this.files.get(n).undo();
      this.redoStack.push(names); this._reparseAll(names); return label;
    }
    redo() {
      const names = this.redoStack.pop(); if (!names) return null;
      let label = null;
      for (const n of names) label = this.files.get(n).redo();
      this.history.push(names); this._reparseAll(names); return label;
    }

    // What players see in this NPC's shop (cached until the next edit).
    simulate(npc) {
      if (!this._sim.has(npc)) this._sim.set(npc, FRE.vendorSim.simulateNpc(this.vendorIndex, npc));
      return this._sim.get(npc);
    }

    // Each item's dwCost after every AddShopItem price (vendorSim.effectiveCosts; cached until the next edit).
    costs() {
      if (!this._costs) this._costs = FRE.vendorSim.effectiveCosts(this.items, this.chars);
      return this._costs;
    }
    // What players pay / get back for every item of one tab (vendorSim.pricedTab)
    pricedTab(npc, slot, rates) {
      return FRE.vendorSim.pricedTab(this.costs(), this.defines.defines, this.simulate(npc).tabs[slot], rates);
    }

    dirtyFiles() { return [...this.files.values()].filter(f => f.dirty); }

    // Files the game client also reads (it has its own copies in Client/).
    clientFileNames() {
      const own = MODULES.filter(m => this.available[m.id].ok && this.shown.has(m.id));
      const spec = !this.only || own.some(m => m.editsSpec) ? CORE_CLIENT : [];
      const maps = own.some(m => m.editsMaps) ? [...this.mapFiles.values()].map(l => this.files.get(l).name) : [];
      return [...new Set([...spec, ...own.flatMap(m => m.client), ...maps])];
    }

    // Changed files that the game client also reads (must be copied to Client/).
    clientCopiesNeeded() {
      const names = new Set(this.clientFileNames().map(n => n.toLowerCase()));
      return this.dirtyFiles().filter(f => names.has(f.name.toLowerCase())).map(f => f.name);
    }

    keyCounts(diags) {
      const m = new Map();
      for (const d of diags) if (d.severity === 'BLOCK') m.set(d.key, (m.get(d.key) || 0) + 1);
      return m;
    }

    // BLOCK diagnostics that did not exist when the folder was loaded / last saved.
    newBlocking() {
      const left = new Map(this.baseline);
      const out = [];
      for (const d of this.diags) {
        if (d.severity !== 'BLOCK') continue;
        const n = left.get(d.key) || 0;
        if (n > 0) left.set(d.key, n - 1); else out.push(d);
      }
      return out;
    }

    // After a verified save.
    markSaved() {
      this.history = []; this.redoStack = [];
      this.baseline = this.keyCounts(this.diags);
    }

    // --- read helpers for the UI ---------------------------------------
    itemById(id) { return this.items.items.get(id >>> 0) || null; }
    itemInfo(item) {
      const g = (f) => FRE.specItem.get(item, f);
      const D = this.defines;

    el.appendChild(h('div.row.ex-tools', { style: 'margin:8px 0' },
      h('span', h('b', label), h('span.def', ' ' + menu.name), h('span.muted', ` · ${Math.min(menu.sets.length, 30)} exchange${menu.sets.length === 1 ? '' : 's'} in the window`)),
      editable && menu.closed && FRE.ui.menuForm ? h('button.small', { title: 'Add exchanges to this menu', on: { click: () => FRE.ui.menuForm.openNewExchanges(ctx, menu) } }, '+ New exchange') : null,
      editable ? null : h('span.tag.bad', 'read-only')));
    // the same menu id on other NPCs: they open the same window, so an edit here changes theirs too
    const others = ((ws.npcInfoByMenu() || new Map()).get(menu.mmi.value) || []).filter(x => x.npc !== npc && x.inGame !== false);
    const otherNames = [...new Set(others.map(x => x.name))];
    if (otherNames.length) el.appendChild(h('p.small.warn.ex-shared', `Also opened by ${otherNames.join(', ')}: they show the same window, so a change here changes theirs too.`));
    el.appendChild(h('p.muted.small', `What players see after right-click ${npc.name || npc.key} → ${label}. Chances are in percent; changing one moves the others so they always add up to 100%. Try it presses OK in the game's exchange window.`));
    if (!menu.sets.length) el.appendChild(h('p.muted', 'No exchange yet: the window opens empty. Press + New exchange.'));
    xv.cards(ctx, menu).forEach(c => el.appendChild(c));
  }

  // "Change position / model" (map-pin icon) next to the name: where it stands and its body (task S part 3)
  const PIN = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#ea4335" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>';
  function placeButton(ctx, npc) {
    const ws = ctx.ws;
    if (!ws.placed) return null;
    const spots = FRE.npcEditOps.placementsOf(ws, npc);
    if (!spots.length || !spots.every(p => ws.isEditable(p.file))) return null;
    const b = h('button.place-edit', { title: `Move ${npc.name || npc.key} or change its model (its map record, Server + Client)${spots.length > 1 ? `; it stands in ${spots.length} places` : ''}`,
      on: { click: () => FRE.ui.npcEdit.editPlace(ctx, npc) } });
    b.innerHTML = PIN;
    b.appendChild(h('span', 'Change position / model'));
