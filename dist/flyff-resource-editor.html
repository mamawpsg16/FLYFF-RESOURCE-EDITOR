      if (r !== last) total += Math.min(Math.max(r.points.value, 1), BP().MAX_BPOINTS);
      const pick = h('button', { disabled: !edit_, title: 'Change this reward: click, then + on an item in the list on the right',
        on: { click: () => { st.pick = st.pick === lv ? null : lv; ctx.renderAll(true); } } }, st.pick === lv ? 'Pick an item →' : 'Change');
      // ↑ / ↓: swap rewards (item, quantity) with the next level; each level keeps its cost
      const i = rows.indexOf(r);
      const mv = (o, sym, title) => h('button.icon', { disabled: !edit_ || !o, title,
        on: { click: () => edit(ctx, text => O().swapRewards(text, r, o), `swap rewards of levels ${lv} and ${o.level.value}`) } }, sym);
      const up = mv(rows[i - 1], '↑', `Swap this reward with level ${lv - 1}'s (the costs stay)`);
      const down = mv(rows[i + 1], '↓', `Swap this reward with level ${lv + 1}'s (the costs stay)`);
      const rm = h('button.icon.danger', { disabled: !edit_, title: r === last ? `Remove level ${lv}` : `Remove level ${lv}: levels ${lv + 1}-${last.level.value} move down one (with their rewards and costs)`,
        on: { click: () => removeLevel(ctx, r, last) } }, '✕');
      tb.appendChild(h('tr' + (st.pick === lv ? '.changed' : ''), h('td.num', String(lv)), itemCell(info, r.define),
        h('td.num', numInput({ value: r.qty.value, min: 1, disabled: !edit_, key: `bp|lv|${lv}|qty`, onCommit: v => v && edit(ctx, () => O().setRewardValue(r, 'qty', v), `level ${lv} quantity`) })),
        h('td.num', r === last ? h('span.muted', { title: 'There is no next level: this cost is never used' }, `(${fmt(r.points.value)} unused)`)
          : numInput({ value: r.points.value, min: 1, max: BP().MAX_BPOINTS, disabled: !edit_, key: `bp|lv|${lv}|points`, onCommit: v => v && edit(ctx, () => O().setRewardValue(r, 'points', v), `level ${lv} cost`) })),
        h('td.num', fmt(reach)),
        h('td.nowrap', up, down, ' ', pick, ' ', rm, ' ', diagTags(rowDiags(ctx, r))), lineCell(ctx, r)));
    });
    // the total on top: what reaching the top level costs (every level's cost but the top one's)
    if (last) el.appendChild(h('div.bp-total', h('span.bp-total-n', fmt(total)), ` points to reach level ${last.level.value}`,
      h('span.muted', ` · ${rows.length} levels · the top level's cost is never used`)));
    el.appendChild(h('h3', `Levels (${rows.length})`));
    el.appendChild(tb);
    problems(el, ctx, d => m.rows.BP4.some(r => r.start === d.start) || d.code === 'BP_LEVEL_GAP' || d.code === 'BP_TYPE');
  }

  // a ladder edit made from another view; true when it went into the undo history
  function editAndTell(ctx, make, label) {
    const n = ctx.ws.history.length;
    ctx.edit(FILE, make, label, 'bp|ladder');
    return ctx.ws.history.length > n;
  }

  function removeLevel(ctx, r, last) {
    const lv = r.level.value, f = ctx.ws.files.get(FILE);
    if (r === last) { edit(ctx, text => O().removeReward(text, model(ctx), r), `remove level ${lv}`); return; }
    let splices;
    try { splices = O().removeLevel(f.text, model(ctx), r); } catch (e) { FRE.dom.toast(e.message, 'bad'); return; }
    modal({ title: `Remove level ${lv}`, wide: true, body: h('div',
      h('p', `Level ${lv}'s reward goes. Levels ${lv + 1}-${last.level.value} move down one, each with its reward and its cost, so the ladder ends at level ${last.level.value - 1}.`),
      h('h3', 'Lines that change'), FRE.ui.renderDiff(f, f.text, f.preview(splices))),
      buttons: [{ label: 'Cancel' }, { label: `Remove level ${lv}`, cls: 'primary danger', onClick: () => edit(ctx, () => splices, `remove level ${lv}`) }] });
  }

  // + on a past reward: where it goes (a new top level, or instead of an existing level), with
  // its quantity and cost editable before it is written
  function placeDialog(ctx, s, p) {
    const ws = ctx.ws, rows = ladderRows(model(ctx)), last = rows[rows.length - 1];
    const cur = model(ctx).pass.type.value, top = last ? last.level.value : 0, next = top + 1;
    const nameOf = (id, define) => { const it = ws.itemById(id); return it ? ws.itemInfo(it).name : define; };
    const name = nameOf(p.id, p.define);
    const pts = n => `${fmt(n)} points to the next level`;
    const v = { level: null, qty: p.qty, points: p.points };
    const now = h('div.bp-place-now');
    const okText = () => (v.level === null ? `Add as level ${next}` : `Replace level ${v.level}`);
    const showNow = () => {
      now.textContent = '';
      const r = v.level === null ? null : rows.find(x => x.level.value === v.level);
      const lv = v.level === null ? next : v.level;
      const isTop = v.level === null || v.level === top;
      now.appendChild(h('table.items.bp-place-diff',
        h('tr', h('th', `Season ${cur}, level ${lv}`), h('th', 'Reward'), h('th.num', 'Points to the next level')),
        h('tr', h('td.muted', 'Before'), r ? h('td', `${fmt(r.qty.value)}x ${nameOf(r.id, r.define)}`) : h('td.muted', '(no level yet)'), h('td.num', r ? fmt(r.points.value) : '')),
        h('tr', h('td', h('b', 'After')), h('td', h('b', `${fmt(v.qty)}x ${name}`)), h('td.num', h('b', fmt(v.points))))));
      if (v.level === null && last) now.appendChild(h('p.muted.small', `Level ${top} stops being the top level, so its ${pts(last.points.value)} start to count.`));
      else if (isTop) now.appendChild(h('p.muted.small', `Level ${lv} is the top level: its points to the next level are never used.`));
      const ok = document.getElementById('bp-place-ok');
      if (ok) ok.textContent = okText();
    };
    const where = h('select', { on: { change: e => { v.level = e.target.value === 'new' ? null : +e.target.value; showNow(); } } },
      h('option', { value: 'new' }, `As a new level ${next} (after level ${top})`),
      rows.map(r => h('option', { value: r.level.value }, `Replace level ${r.level.value} (has ${fmt(r.qty.value)}x ${nameOf(r.id, r.define)} now)`)));
    showNow();
    modal({ title: `Copy a reward from season ${s.type} into season ${cur}`, wide: true, body: h('div.bp-place',
      h('p', `From season ${s.type}, level ${p.level}: `, h('b', `${fmt(p.qty)}x ${name}`), `, ${pts(p.points)}.`),
      h('div.row.ex-tools', h('label', `Where in season ${cur}: `, where)),
      h('div.row.ex-tools',
        h('label', 'Quantity ', numInput({ value: v.qty, min: 1, onCommit: x => { if (x) { v.qty = x; showNow(); } } })),
        h('label', 'Points to the next level ', numInput({ value: v.points, min: 1, max: BP().MAX_BPOINTS, onCommit: x => { if (x) { v.points = x; showNow(); } } }))),
      now),
      buttons: [{ label: 'Cancel' }, { label: okText(), id: 'bp-place-ok', cls: 'primary', onClick: () => {
        const lv = v.level === null ? next : v.level;
        const done = editAndTell(ctx, text => O().placeReward(text, model(ctx), { define: p.define, qty: v.qty, points: v.points, level: v.level }),
          `${name} from season ${s.type}${v.level === null ? ` as new level ${lv}` : ` on level ${lv}`}`);
        if (done) FRE.dom.toast(`Season ${cur}, level ${lv}${v.level === null ? ' (new)' : ''}: ${fmt(v.qty)}x ${name}, ${pts(v.points)}. See "Reward ladder"; nothing is written until Save.`, 'ok');
      } }] });
  }

  // ---------------------------------------------------------------- Past seasons
  // "2026-10-06_08-40-20_battlepass" -> "Tue 06 Oct 2026 08:40"
  function stampText(stamp) {
    if (stamp === NOW) return 'the editor now';
    const m = /^(\d{4})-(\d\d)-(\d\d)_(\d\d)-(\d\d)/.exec(stamp);
    return m ? `${BP().dayText(new Date(+m[1], m[2] - 1, +m[3]))} ${m[4]}:${m[5]}` : stamp;
  }
  const NOW = '~now';               // sorts after every backup folder name
  function loadHistory(ctx) {
    if (hist.loading) return;
    hist.loading = true; hist.error = null;
    ctx.backupsOf(FRE.battlePass.FILE).then(copies => {
      const entries = (copies || []).map(c => ({ stamp: c.stamp, file: new FRE.SourceFile(`${c.stamp}/${FRE.battlePass.FILE}`, c.bytes) }));
      entries.push({ stamp: NOW, file: ctx.ws.files.get(FILE) });       // the file as it is in the editor (edits included)
      hist.list = BP().seasonHistory(entries, { defines: ctx.ws.defines.defines, strings: ctx.ws.strings.map }, model(ctx));
      hist.key = ctx.backupKey; hist.copies = copies ? copies.length : 0;
    }).catch(e => { hist.error = String(e && e.message || e); hist.list = []; })
      .finally(() => { hist.loading = false; ctx.renderAll(false); });
  }

  function history(el, ctx) {
    const ws = ctx.ws, edit_ = canEdit(ctx), m = model(ctx), defines = ws.defines.defines;
    el.appendChild(h('p.muted.small', 'Every save through this editor first copies BattlePass.inc into the backups folder, so an old season shows up here after the save that replaces it. ',
      'One card per season found in the copies, newest first; seasons from before the first save are in no copy. The current season is edited in "Reward ladder". ',
      '+ puts a past reward on the current season (pick the level, quantity and cost); "Use this whole ladder" copies them all. Nothing is written to disk until you press Save.'));
    if (!ctx.backupKey) { el.appendChild(h('p', 'No backups folder yet: it is asked at the first save, and the history starts there.')); return; }
    if (!hist.list) { el.appendChild(h('p.muted', 'Reading the backups…')); loadHistory(ctx); return; }
    if (hist.error) el.appendChild(h('p.warn-text', 'Could not read the backups: ' + hist.error));
    el.appendChild(h('div.row', { style: 'justify-content:flex-start' },
      h('span.muted.small', { style: 'flex:0 0 auto' }, `${hist.copies} backup cop${hist.copies === 1 ? 'y' : 'ies'} of BattlePass.inc in ${ctx.backupKey}/`),
      h('button', { style: 'flex:0 0 auto', on: { click: () => { hist.list = null; ctx.renderAll(false); } } }, 'Read again')));
    const now = new Map(ladderRows(m).map(r => [r.level.value, r]));
    const curType = m.pass ? m.pass.type.value : null;
    const past = hist.list.filter(x => !x.current);
    if (!past.length) el.appendChild(h('p', 'No past season in the backups yet. When a save replaces a season (for example after "Start new season"), the old one shows up here.'));
    past.forEach((s, k) => {
      const ended = !s.end || s.end <= new Date();
      const where = s.first === NOW ? 'the current file (each backup holds the file from before a save)'
        : `in ${s.copies - (s.last === NOW ? 1 : 0)} backup cop${s.copies - (s.last === NOW ? 1 : 0) === 1 ? 'y' : 'ies'} from ${stampText(s.first)}${s.last === NOW ? ' and the current file' : ''}`;
      const tb = h('table.items.bp', h('tr', h('th.num', 'Level'), h('th', 'Reward'), h('th.num', 'Qty'), h('th.num', 'Cost to next level'), h('th', 'Now'), h('th', '')));
      for (const p of s.ladder) {
        const it = ws.itemById(p.id), info = it ? ws.itemInfo(it) : null, r = now.get(p.level);
        const same = r && r.define === p.define && r.qty.value === p.qty && r.points.value === p.points;
        const cmp = s.current ? '' : !r ? h('span.tag.info', 'not in the current ladder')
          : same ? h('span.muted', 'same') : h('span.warn-text', `now ${r.qty.value}x ${r.define}, cost ${fmt(r.points.value)}`);
        const known = defines.has(p.define);
        const add = s.current ? null : h('button.icon', { disabled: !edit_ || !known || !m.pass,
          title: known ? `Add to the current season: pick the level, quantity and cost` : `${p.define} is not #defined any more`,
          on: { click: () => placeDialog(ctx, s, p) } }, '+');
        tb.appendChild(h('tr', h('td.num', String(p.level)), itemCell(info, p.define), h('td.num', fmt(p.qty)), h('td.num', fmt(p.points)), h('td', cmp), h('td', add)));
      }
      const useAll = s.current ? null : h('button', { disabled: !edit_ || !m.pass, title: 'Make the current ladder equal to this one (costs, rewards, quantities); one undo step',
        on: { click: () => useLadder(ctx, s) } }, 'Use this whole ladder…');
      const reach = s.ladder.slice(0, -1).reduce((a, p) => a + Math.min(Math.max(p.points, 1), BP().MAX_BPOINTS), 0);
      el.appendChild(h('details.bp-season', {},
        h('summary', h('b', `Season ${s.type}`), ' ',
          h('span.tag.' + (s.current ? 'ok' : ended ? 'warn' : 'info'), s.current ? 'current' : ended ? 'ended' : 'not current'),
          h('span.muted', ` · last day ${s.end ? BP().dayText(addDays(s.end, -1)) : '(no valid date)'} · ${s.ladder.length} levels, ${fmt(reach)} points to the top · ${s.monsters} monsters · ${where}`),
          s.type === curType && !s.current ? h('span.muted', ' (same season number, other end date)') : null),
        h('div.row', { style: 'justify-content:flex-start;margin:6px 0' }, useAll),
        tb));
    });
  }

  function useLadder(ctx, s) {
    const f = ctx.ws.files.get(FILE);
    let plan;
    try { plan = O().restoreLadder(f.text, model(ctx), s.ladder, ctx.ws.defines.defines); } catch (e) { FRE.dom.toast(e.message, 'bad'); return; }
    if (!plan.changes.length) { FRE.dom.toast(`The current ladder is already the same as season ${s.type}'s.`, 'ok'); return; }
    modal({ title: `Use season ${s.type}'s ladder`, wide: true, body: h('div',
      h('p', `The current season (${model(ctx).pass.type.value}) gets season ${s.type}'s costs, rewards and quantities. Its season number, end date and monsters stay.`),
      h('ul.small', plan.changes.map(c => h('li', c))),
      h('h3', 'Lines that change'), FRE.ui.renderDiff(f, f.text, f.preview(plan.splices))),
      buttons: [{ label: 'Cancel' }, { label: 'Use this ladder', cls: 'primary', onClick: () => {
        if (editAndTell(ctx, () => plan.splices, `use season ${s.type}'s ladder`))
          FRE.dom.toast(`Season ${model(ctx).pass.type.value} now has season ${s.type}'s ladder (${plan.changes.length} change${plan.changes.length === 1 ? '' : 's'}). Nothing is written until Save.`, 'ok');
      } }] });
  }

  // ---------------------------------------------------------------- Monster points
  function monsters(el, ctx) {
    const m = model(ctx), edit_ = canEdit(ctx), mv = movers(ctx);
    const all = shownRows(ctx);
    const off = all.filter(offBand);
    const missing = unlisted(ctx);
    const junk = junkRows(ctx);
    const filt = h('select', { on: { change: ev => { st.mfilter = ev.target.value; ctx.renderAll(false); } } },
      [['listed', `Listed (${all.length})`], ['off', `Off their level band (${off.length})`], ['unlisted', `Not listed (${missing.length})`]].map(([v, l]) => h('option', { value: v, selected: st.mfilter === v }, l)));
    el.appendChild(h('div.row', { style: 'justify-content:flex-start;flex-wrap:wrap' }, h('span', { style: 'flex:0 0 auto' }, filt),
      h('button', { style: 'flex:0 0 auto', disabled: !edit_ || !off.length, on: { click: () => reprice(ctx, off) } }, `Re-price off-band rows (${off.length})…`),
      h('button', { style: 'flex:0 0 auto', disabled: !edit_ || !missing.length, title: 'Every real monster not in the list (no town NPCs or pets), at its band price',
        on: { click: () => addAll(ctx, missing) } }, `Add all unlisted monsters (${missing.length})…`)));
    if (junk.length) el.appendChild(h('p.muted.small', `${junk.length} pets and town NPCs in the file are hidden here: players never kill them, so they never pay points. `,
      h('button', { disabled: !edit_, on: { click: () => removeJunk(ctx, junk) } }, 'Delete them from the file…')));
    el.appendChild(h('p.muted.small', 'Only monsters in this list pay points; the player who lands the killing blow gets a random number between min and max (1-10,000). ',
      'The file prices by monster level - lv1-20: 4-6, 21-40: 8-12, 41-60: 14-20, 61-80: 22-32, 81-100: 32-44, 101-120: 44-60, 121-140: 60-80, 141+: 80-110 - ',
      'times 1.25 for a midboss, 1.5 for a boss and 2 for a super (commits c0a828d7, 3b8e8410). Search with the box on the left.'));
    const rows = monsterRows(ctx);
    const shown = rows.slice(0, 400);
    const tb = h('table.items.bp', h('tr', h('th', 'Monster'), h('th.num', 'Level'), h('th', 'Rank'), h('th.num', 'Min'), h('th.num', 'Max'),
      h('th', 'Band'), h('th', ''), h('th', 'Line')));
    for (const x of shown) {
      const mo = x.mover, b = mo ? BP().band(mo.level, mo.rankId) : null;
      const name = h('td', mo ? h('span', mo.name || '') : h('span.muted', '(not in propMover.txt)'), h('span.def.block', mo ? mo.define : x.row.define));
      if (!x.row) {
        tb.appendChild(h('tr', name, h('td.num', String(mo.level)), h('td', mo.rank), h('td.num', ''), h('td.num', ''), h('td', `${b.min}-${b.max}`),
          h('td', h('button', { disabled: !edit_, title: `Add with the band price ${b.min}-${b.max}`,
            on: { click: () => edit(ctx, text => O().addMonster(text, model(ctx), mo, b.min, b.max, movers(ctx)), `add ${mo.define}`) } }, '+ Add')), h('td', '')));
        continue;
      }
      const r = x.row;
      const set = (which, v) => {
        if (!v) return;
        const min = which === 'min' ? v : r.min.value, max = which === 'max' ? v : r.max.value;
        edit(ctx, () => O().setMonsterPoints(r, min, max), `${r.define} points`);
      };
      const rm = h('button.icon.danger', { disabled: !edit_, title: 'Remove: this monster pays no points',
        on: { click: () => edit(ctx, text => O().removeMonster(text, r), `remove ${r.define}`) } }, '✕');
      tb.appendChild(h('tr' + (offBand(x) ? '.changed' : ''), name, h('td.num', mo ? String(mo.level) : ''), h('td', mo ? mo.rank : ''),
        h('td.num', numInput({ value: r.min.value, min: 1, max: BP().MAX_BPOINTS, disabled: !edit_, key: `bp|mon|${r.define}|min`, onCommit: v => set('min', v) })),
        h('td.num', numInput({ value: r.max.value, min: 1, max: BP().MAX_BPOINTS, disabled: !edit_, key: `bp|mon|${r.define}|max`, onCommit: v => set('max', v) })),
        h('td', b ? `${b.min}-${b.max}` : ''), h('td', rm, ' ', diagTags(rowDiags(ctx, r))), lineCell(ctx, r)));
    }
    el.appendChild(h('h3', `Monsters (${rows.length})`));
    if (!rows.length) el.appendChild(h('p.muted', st.mfilter === 'off' ? 'Every listed monster pays its band price.' : 'Nothing matches.'));
    else el.appendChild(tb);
    if (rows.length > shown.length) el.appendChild(h('p.muted.small', `Showing the first ${shown.length} of ${rows.length}: search on the left to narrow the list.`));
    problems(el, ctx, d => all.some(x => x.row.start === d.start) && (d.code !== 'BP_BAND' || st.mfilter === 'off'));
  }

  function addAll(ctx, list) {
    const f = ctx.ws.files.get(FILE), m = model(ctx);
    const splices = O().addMonstersAtBand(f.text, m, list, movers(ctx));
    const tb = h('table.items', h('tr', h('th', 'Monster'), h('th.num', 'Level'), h('th', 'Rank'), h('th.num', 'Points')),
      [...list].sort((a, b) => a.level - b.level).map(x => { const b = BP().band(x.level, x.rankId);
        return h('tr', h('td', x.name, h('span.def.block', x.define)), h('td.num', String(x.level)), h('td', x.rank), h('td.num', `${b.min}-${b.max}`)); }));
    modal({ title: `Add ${list.length} monster${list.length > 1 ? 's' : ''} at their band price`, wide: true, body: h('div',
      h('p', 'Each row goes next to the listed monsters of the same level. Town NPCs (citizens, guards), pets and movers without a name or level are left out. One undo step.'),
      tb, h('h3', 'Lines that change'), FRE.ui.renderDiff(f, f.text, f.preview(splices))),
      buttons: [{ label: 'Cancel' }, { label: `Add ${list.length}`, cls: 'primary', onClick: () => ctx.edit(FILE, () => splices, `add ${list.length} monsters`, 'bp|monsters') }] });
  }

  function removeJunk(ctx, list) {
    const f = ctx.ws.files.get(FILE);
    const splices = O().removeMonsters(f.text, list.map(x => x.row));
    const pets = list.filter(x => /^MI_PET_/.test(x.mover.define)).length;
    modal({ title: `Remove ${list.length} rows that are not monsters`, wide: true, body: h('div',
      h('p', `${pets} pets (buff pets from items, raised pets from pet.inc) and ${list.length - pets} town NPCs. None of them spawns as a monster in the world, so these rows never pay points. One undo step.`),
      h('h3', 'Lines that change'), FRE.ui.renderDiff(f, f.text, f.preview(splices))),
      buttons: [{ label: 'Cancel' }, { label: `Remove ${list.length}`, cls: 'primary danger', onClick: () => ctx.edit(FILE, () => splices, `remove ${list.length} non-monsters`, 'bp|monsters') }] });
  }

  function reprice(ctx, list) {
    const f = ctx.ws.files.get(FILE);
    const splices = list.flatMap(x => O().repriceMonster(x.row, x.mover));
    const tb = h('table.items', h('tr', h('th', 'Monster'), h('th.num', 'Level'), h('th', 'Rank'), h('th.num', 'Now'), h('th.num', 'New')),
      list.map(x => { const b = BP().band(x.mover.level, x.mover.rankId);
        return h('tr', h('td', x.mover.name, h('span.def.block', x.mover.define)), h('td.num', String(x.mover.level)), h('td', x.mover.rank),
          h('td.num', `${x.row.min.value}-${x.row.max.value}`), h('td.num', `${b.min}-${b.max}`)); }));
    modal({ title: `Re-price ${list.length} monster${list.length > 1 ? 's' : ''} to their level band`, wide: true, body: h('div',
      h('p', 'Sets min and max to the band of each monster\'s level and rank in propMover.txt, and updates the "// lvN rank - Name" comment. One undo step.'),
      tb, h('h3', 'Lines that change'), FRE.ui.renderDiff(f, f.text, f.preview(splices))),
      buttons: [{ label: 'Cancel' }, { label: 'Re-price', cls: 'primary', onClick: () => ctx.edit(FILE, () => splices, `re-price ${list.length} monsters`, 'bp|monsters') }] });
  }

  function problems(el, ctx, pred) {
    const nd = bpDiags(ctx).filter(pred);
    if (!nd.length) return;
    el.appendChild(h('h3', 'Problems'));
    nd.slice(0, 200).forEach(d => el.appendChild(diagRow(d)));
  }

  FRE.ui.modules.push(mod);
})(globalThis.FRE = globalThis.FRE || {});

// ---- ui/exchange.js ----
// Exchanges module (Exchange_Script.txt, CExchange::Load_Script). Left: the exchange menus,
// named by the NPCs that open them. Centre: one card per recipe (SET): ingredients ->
// rewards, with the chances the server really uses and the row as the game window draws it.
(function (FRE) {
  'use strict';
  const { h, fmt, modal, numInput } = FRE.dom;
  const { diagTags, diagRow } = FRE.ui;
  const FILE = 'exchange_script.txt';
  const BINDS = 2;                  // CItemElem::binds (Item.h:132): the file header's "2 = bound"
  const st = { menu: null, show: 'game', pick: null };   // pick: { set, kind: 'cond' | 'pay', line: index | null }

  const X = () => FRE.exchange;
  const O = () => FRE.exchangeOps;
  const model = ctx => ctx.ws.models.exchange;
  const canEdit = ctx => ctx.ws.isEditable(FILE);
  // With the map files read, only the menus players can really use (NPC on a map, not hidden, has
  // recipes). Without them (no World folder), every menu an NPC has.
  const menus = ctx => model(ctx).menus.filter(m => !m.isJunk && (ctx.ws.placed ? ctx.ws.isLiveMenu(m) : true));
  const npcs = (ctx, m) => { const by = ctx.ws.npcsByMenu(); return by ? by.get(m.mmi.value) || [] : []; };
  // [{ name, key, inGame, maps, why }] of the NPCs that have this menu (FRE.world.npcStatus)
  const npcInfo = (ctx, m) => { const by = ctx.ws.npcInfoByMenu(); return by ? by.get(m.mmi.value) || [] : []; };
  const mapsKnown = ctx => !!ctx.ws.placed;
  // players can use it: an NPC with the menu stands in the game, and the server loads recipes for it
  const inGame = (ctx, m) => m.sets.length > 0 && npcInfo(ctx, m).some(x => x.inGame);
  const current = ctx => menus(ctx).find(m => m.name === st.menu) || null;
  const exDiags = ctx => ctx.ws.diags.filter(d => d.module === 'exchange');
  const inSpan = (ctx, a, b) => exDiags(ctx).filter(d => d.start !== undefined && d.start >= a && d.start < Math.max(b, a + 1));
  const pct = p => `${(p / 10000).toLocaleString('en-US', { maximumFractionDigits: 4 })}%`;
  // "[Collecting Manager]Collins" -> "Collins"; a name that is only a title, "[Pet Tamer]", keeps the title
  const plainName = s => { const t = String(s || '').trim(), rest = t.replace(/^\[[^\]]*\]\s*/, '').replace(/^[\s,]+/, ''); return rest || t.replace(/^\[|\]$/g, ''); };
  function edit(ctx, make, label) { ctx.edit(FILE, make, label, 'ex|' + st.menu); }

  function itemOf(ctx, l) {
    if (l.item.penya) return { name: 'Penya', define: 'PENYA', rarity: 'normal', id: null };
    const it = l.item.undef ? null : ctx.ws.itemById(l.item.value);
    return it ? ctx.ws.itemInfo(it) : null;
  }
  const itemSpan = (info, define) => info
    ? h('span', { 'data-item-id': info.id === null ? null : info.id }, h('span.r-' + info.rarity, info.name), h('span.def.block', info.define))
    : h('span', h('span.muted', define === 'PENYA' ? 'Penya' : '(not an item)'), h('span.def.block', define));

  // only without the map files: a choice between the menus NPCs have and all menus
  const SHOW = [
    { v: 'npc', label: 'On an NPC', test: (ctx, m) => npcs(ctx, m).length > 0 },
    { v: 'all', label: 'All menus', test: () => true },
  ];
  const shows = ctx => mapsKnown(ctx) ? [] : SHOW;

  const mod = {
    id: 'exchange', label: 'Exchanges', searchPlaceholder: 'Search menus, NPCs or items',
    help: 'Exchanges: NPC exchanges that turn items into other items (Exchange_Script.txt)',
    st,

    onLoad(ctx) {
      st.pick = null; st.show = 'npc';
      const first = menus(ctx).find(m => (mapsKnown(ctx) || npcs(ctx, m).length) && m.sets.length);
      st.menu = first ? first.name : (menus(ctx)[0] || {}).name || null;
    },

    listExtra(ctx) {
      if (!ctx.ws || !model(ctx)) return null;
      if (mapsKnown(ctx)) return h('div.muted.small', { style: 'padding:4px 2px' }, `${menus(ctx).length} exchange menus in the game`);
      return h('select.npc-filter', { title: 'Which menus to list', on: { change: e => { st.show = e.target.value; ctx.renderList(); } } },
        shows(ctx).map(o => h('option', { value: o.v, selected: o.v === st.show }, `${o.label} (${menus(ctx).filter(m => o.test(ctx, m)).length})`)));
    },

    renderList(el, ctx) {
      const q = ctx.query.toLowerCase();
      const test = mapsKnown(ctx) ? () => true : (SHOW.find(o => o.v === st.show) || SHOW[0]).test;
      const hit = m => !q || m.name.toLowerCase().includes(q) || npcs(ctx, m).some(n => n.toLowerCase().includes(q))
        || m.sets.some(s => [...s.condition, ...s.pay].some(l => {
          const info = itemOf(ctx, l);
          return l.item.name.toLowerCase().includes(q) || (info && info.name.toLowerCase().includes(q));
        }));
      const list = menus(ctx).filter(m => test(ctx, m) && hit(m));
      for (const m of list) {
        // in the "In game" list, name only the NPCs players can actually click
        const who = npcInfo(ctx, m).filter(x => !mapsKnown(ctx) || x.inGame).map(x => plainName(x.name)).filter(Boolean);
        const bad = inSpan(ctx, m.start, m.end).filter(d => d.severity !== 'INFO').length;
        el.appendChild(h('div.npc' + (st.menu === m.name ? '.sel' : ''), { on: { click: () => { st.menu = m.name; st.pick = null; ctx.renderAll(false); } } },
          h('div.n', h('span', who.length ? who.join(', ') : h('span.muted', 'no NPC')),
            h('span', ctx.edited.has('ex|' + m.name) ? h('span.tag.edit', 'edited') : null, bad ? h('span.tag.warn', '⚠' + bad) : null,
              h('span.count', String(m.sets.length)))),
          h('div.k', m.name)));
      }
      if (!list.length) el.appendChild(h('p.muted', { style: 'padding:8px 12px' }, 'No menu matches.'));
    },

    renderEditor(el, ctx) {
      const f = ctx.ws.files.get(FILE), m = current(ctx);
      if (!m) { el.appendChild(h('p.empty-state', 'Pick an exchange menu on the left.')); return; }
      const info = npcInfo(ctx, m).filter(x => !mapsKnown(ctx) || x.inGame);     // hidden / unplaced NPCs are not shown
      const shown = info.filter(x => x.inGame !== false), title = (shown.length ? shown : info).map(x => plainName(x.name)).filter(Boolean).join(', ');
      el.appendChild(h('div.npc-title', h('h2', title || m.name), h('span.def', m.name),
        h('span.line', `${f.name} L${f.lineOf(m.start) + 1}`), canEdit(ctx) ? null : h('span.tag.bad', 'read-only'),
        canEdit(ctx) && m.closed && FRE.ui.menuForm ? h('button.small', { title: 'Add exchanges: the same ingredients, one exchange per reward', on: { click: () => FRE.ui.menuForm.openNewExchanges(ctx, m) } }, '+ New exchange') : null));
      // who opens it, and whether the WorldServer shows that NPC (map files + SetOutput / SetLang)
      // where each NPC stands (loaders/area.js), with the GM teleport command
      if (info.length) el.appendChild(h('div.ex-npcs', info.map(x => x.inGame && x.where && x.where.length
        ? h('div.ex-npc', h('b', plainName(x.name) || x.key), FRE.ui.whereLine(x.where))
        : h('span.tag.' + (x.inGame ? 'ok' : x.inGame === false ? 'warn' : 'info'),
          { title: `${x.key}: ${x.why}` }, `${plainName(x.name) || x.key} · ${x.inGame ? x.why : x.inGame === false ? x.why : 'map files not read'}`))));
      el.appendChild(h('p.muted.small', info.length ? '' : 'No NPC has AddMenu with this menu, so players cannot open it. ',
        'This server takes the ingredients (CONDITION) when the exchange succeeds; the REMOVE list is ignored, and edits here keep it equal to CONDITION. ',
        'The client reads its own copy and sends only the exchange\'s position, so save with the Client folder chosen: otherwise players get the exchange that sits at that position in the old copy.'));
      const head = inSpan(ctx, m.start, m.sets.length ? m.sets[0].start : m.end);
      if (head.length) el.appendChild(h('div', head.map(d => diagRow(d))));

      if (m.description.length) {
        el.appendChild(h('details.bp-how', h('summary', `Window text (${m.description.length} page${m.description.length > 1 ? 's' : ''})`),
          m.description.map(d => h('div.ex-desc', h('span.def', d.name), h('div', ctx.ws.texts.get(d.name) || h('span.muted', '(no text)'))))));
      }
      if (!m.sets.length) { el.appendChild(h('p.muted', 'This menu has no exchanges the server loads, so its window opens empty and closes.')); return; }
      el.appendChild(h('p.muted.small', 'Chances are typed in percent (the file keeps them out of 1,000,000: 50% = 500,000). "Spread evenly" splits 100% over the rewards. "Gives" is how many different rewards one exchange hands out, picked by chance. ',
        'Pick items with "+ Ingredient", "+ Reward" or "Change", then + on an item in the list on the right.'));
      m.sets.forEach((s, i) => el.appendChild(card(ctx, m, s, i)));
      const rest = exDiags(ctx).filter(d => d.start >= m.start && d.start < m.end && d.severity !== 'INFO' && !m.sets.some(s => d.start >= s.start && d.start < s.end) && !head.includes(d));
      if (rest.length) { el.appendChild(h('h3', 'Problems')); rest.forEach(d => el.appendChild(diagRow(d))); }
    },

    addTarget(ctx) {
      if (!canEdit(ctx)) return { ok: false, title: 'Exchange_Script.txt is read-only' };
      const m = model(ctx).menus.find(x => x.name === st.menu && !x.isJunk) || null, p = st.pick;
      const s = m && p ? m.sets[p.set] : null;
      const edit = (c, make, label) => c.edit(FILE, make, label, 'ex|' + (m ? m.name : st.menu));
      if (!s) return { ok: false, title: 'Click "+ Ingredient", "+ Reward" or "Change" on an exchange first' };
      const n = p.set + 1;
      const done = () => { st.pick = null; };
      if (p.kind === 'cond') {
        if (p.line === null) return { ok: true, usesPrice: false, title: `Add as an ingredient of exchange ${n} (quantity 1)`,
          add(info) { done(); edit(ctx, text => O().addIngredient(text, s, info.define, 1), `exchange ${n} add ${info.define}`); } };
        const l = s.condition[p.line];
        return { ok: true, usesPrice: false, title: `Use as exchange ${n}'s ingredient instead of ${l.item.name}`,
          add(info) { done(); edit(ctx, () => O().setIngredientItem(s, l, info.define), `exchange ${n} ingredient ${info.define}`); } };
      }
      if (p.line === null) {
        return { ok: true, usesPrice: false, title: `Add as a reward of exchange ${n} (quantity 1, an equal share: 100% / ${s.pay.length + 1}; the others shrink to make room)`,
          add(info) { done(); edit(ctx, text => O().addRewardKeepTotal(text, s, info.define, 1), `exchange ${n} add reward ${info.define}`); } };
      }
      const l = s.pay[p.line];
      return { ok: true, usesPrice: false, title: `Give instead of ${l.item.name} in exchange ${n}`,
        add(info) { done(); edit(ctx, () => O().setRewardItem(l, info.define), `exchange ${n} reward ${info.define}`); } };
    },

    locate(d, ctx) {
      if (d.module !== 'exchange') return false;
      const m = menus(ctx).find(x => d.start >= x.start && d.start < Math.max(x.end, x.start + 1));
      if (!m) return false;
      st.menu = m.name; st.pick = null;
      if (st.show === 'npc' && !npcs(ctx, m).length) st.show = 'all';
      return true;
    },
  };

  // An exchange is named by what it gives ("Name Color Scroll (3 Days)", or "A / B" when it
  // gives one of several): the reward is the point, the costs are only what it takes.
  function rewardNames(ctx, s) {
    const lines = s.paid && s.paid.lines.length ? s.paid.lines.map(x => x.line) : s.pay;
    const names = [...new Set(lines.map(l => { const i = itemOf(ctx, l); return i ? i.name : l.item.name; }))];
    return names.length ? names.join(' / ') : `exchange ${s.index + 1}`;
  }
  const whoOpens = (ctx, m) => npcInfo(ctx, m).filter(x => !mapsKnown(ctx) || x.inGame).map(x => plainName(x.name)).filter(Boolean).join(', ') || m.name;

  // ---------------------------------------------------------------- one recipe
  function card(ctx, m, s, i) {
    const edit_ = canEdit(ctx), n = i + 1, f = ctx.ws.files.get(FILE);
    const edit = (c, make, label) => c.edit(FILE, make, label, 'ex|' + m.name);     // tags this card's menu (also when shown in NPC Shops)
    const picking = (kind, line) => st.pick && st.menu === m.name && st.pick.set === i && st.pick.kind === kind && st.pick.line === line;
    const pickBtn = (kind, line, label) => h('button', { disabled: !edit_, title: 'Then press + on an item in the list on the right',
      on: { click: () => { const on = picking(kind, line); st.menu = m.name; st.pick = on ? null : { set: i, kind, line }; ctx.renderAll(true); } } }, picking(kind, line) ? 'Pick an item →' : label);
    const lineDiags = l => inSpan(ctx, l.start, l.end);

    // ingredients
    const ing = h('table.items.ex', h('tr', h('th', 'Ingredient'), h('th.num', 'Qty'), h('th', '')));
    s.condition.forEach((l, j) => {
      const info = itemOf(ctx, l);
      ing.appendChild(h('tr' + (picking('cond', j) ? '.changed' : ''), h('td', itemSpan(info, l.item.name)),
        h('td.num', numInput({ value: l.num.value, min: 1, disabled: !edit_, key: `ex|${m.name}|${i}|cond|${j}|qty`, onCommit: v => v && edit(ctx, () => O().setIngredientQty(s, l, v), `exchange ${n} ${l.item.name} qty`) })),
        h('td.nowrap', pickBtn('cond', j, 'Change'), ' ', h('button.icon.danger', { disabled: !edit_ || s.condition.length < 2, title: s.condition.length < 2 ? 'An exchange needs at least one cost' : 'Remove this cost',
          on: { click: () => edit(ctx, text => O().removeIngredient(text, s, l), `exchange ${n} remove ${l.item.name}`) } }, '✕'), ' ', diagTags(lineDiags(l)))));
    });

    // rewards, with the chance the server really uses
    const paid = new Map((s.paid ? s.paid.lines : []).map(x => [x.line, x.prob]));
    const rew = h('table.items.ex', h('tr', h('th', 'Reward'), h('th.num', 'Qty'), h('th.num', { title: 'Type the percent; the other rewards move so the total stays 100%' }, 'Chance'), h('th.num', { title: 'What the file holds: out of 1,000,000 (1% = 10,000)' }, 'of 1,000,000'), h('th.num', 'Server uses'), h('th', 'Bound'), h('th', '')));
    s.pay.forEach((l, j) => {
      const info = itemOf(ctx, l), eff = paid.get(l);
      const flag = l.flag ? l.flag.value : 0;
      const bound = flag === 0 || flag === BINDS
        ? h('input', { type: 'checkbox', checked: flag === BINDS, disabled: !edit_, title: 'Bound to the character (flag 2)',
          on: { change: e => edit(ctx, text => O().setRewardFlag(text, l, e.target.checked ? BINDS : 0), `exchange ${n} ${l.item.name} bound`) } })
        : h('span', { title: 'item flag value' }, String(flag));
      rew.appendChild(h('tr' + (picking('pay', j) ? '.changed' : eff === undefined ? '.dropped' : ''), h('td', itemSpan(info, l.item.name)),
        h('td.num', numInput({ value: l.num.value, min: 1, disabled: !edit_, key: `ex|${m.name}|${i}|pay|${j}|qty`, onCommit: v => v && edit(ctx, () => O().setRewardQty(l, v), `exchange ${n} ${l.item.name} qty`) })),
        h('td.num', FRE.dom.pctInput({ value: l.prob.value, key: `ex|${m.name}|${i}|pay|${j}|pct`, disabled: !edit_ || s.pay.length < 2, title: s.pay.length < 2 ? 'The only reward: always 100%' : 'The other rewards move so the total stays 100%',
          onCommit: v => edit(ctx, () => O().setChanceKeepTotal(s, l, v), `exchange ${n} ${l.item.name} chance`) })),
        h('td.num.muted', fmt(l.prob.value)),
        h('td.num', eff === undefined ? h('span.tag.bad', { title: 'The chances before this line already reach 100%' }, 'dropped') : h('span' + (eff !== l.prob.value ? '.warn-text' : ''), pct(eff))),
        h('td', bound),
        h('td.nowrap', pickBtn('pay', j, 'Change'), ' ', h('button.icon.danger', { disabled: !edit_ || s.pay.length < 2, title: s.pay.length < 2 ? 'An exchange needs at least one reward (to remove the whole exchange, use the Remove button at the top of the card)' : 'Remove this reward (the exchange stays)',
          on: { click: () => edit(ctx, text => O().removeRewardKeepTotal(text, s, l), `exchange ${n} remove ${l.item.name}`) } }, '✕'), ' ', diagTags(lineDiags(l)))));
    });
    const given = X().rewardsGiven(s);
    const sum = s.pay.reduce((a, l) => a + l.prob.value, 0);
    const payRow = h('div.row.ex-tools',
      pickBtn('pay', null, '+ Reward'),
      s.pay.length > 1 ? h('button', { disabled: !edit_, title: 'Give every reward the same chance, adding up to exactly 1,000,000',
        on: { click: () => edit(ctx, () => O().evenChances(s), `exchange ${n} spread chances`) } }, 'Spread evenly') : null,
      s.pay.length > 1 && s.payNum ? h('label', 'Gives ', numInput({ value: s.payNum.value, min: 1, max: s.pay.length, disabled: !edit_, key: `ex|${m.name}|${i}|gives`,
        onCommit: v => v && edit(ctx, () => O().setPayNum(s, v), `exchange ${n} gives ${v}`) }), ` of ${s.pay.length}`) : null,
      h('span' + (sum === X().PROB_TOTAL ? '.muted' : '.warn-text'), `chances add up to ${pct(sum)}${sum === X().PROB_TOTAL ? '' : ' (should be 100%)'}`),
      h('span.muted', `· one exchange gives ${given} reward${given === 1 ? '' : 's'}`));

    // the row as the client draws it (WndControl.cpp:1980): ingredients, arrow, rewards; ~9 icons fit
    const slots = [...s.condition.map(l => ({ l, kind: 'cond' })), { arrow: true }, ...s.pay.map(l => ({ l, kind: 'pay' }))];
    let k = 0;
    const game = h('div.ex-game', h('span.muted', 'In game: '), slots.map(x => {
      if (x.arrow) return h('span.ex-arrow', '→');
      k++;
      const info = itemOf(ctx, x.l);
      return h('span.ex-slot' + (k > X().ROW_SLOTS ? '.over' : ''), { 'data-item-id': info && info.id !== null ? info.id : null,
        title: k > X().ROW_SLOTS ? 'drawn past the window edge' : '' }, `${info ? info.name : x.l.item.name} ×${fmt(x.l.num.value)}`);
    }));

    const tools = h('span.ex-head-tools',
      h('button', { disabled: s.dropped, title: s.dropped ? 'The server does not load this exchange' : 'Press OK in the exchange window many times, the way the server does it',
        on: { click: () => tryIt(ctx, m, s, i) } }, 'Try it'),
      h('button.icon', { disabled: !edit_ || i === 0, title: 'Move up', on: { click: () => move(ctx, m, s, -1) } }, '↑'),
      h('button.icon', { disabled: !edit_ || i === m.sets.length - 1, title: 'Move down', on: { click: () => move(ctx, m, s, 1) } }, '↓'),
      h('button', { disabled: !edit_ || m.sets.length >= X().MAX_SETS, title: m.sets.length >= X().MAX_SETS ? 'A menu keeps at most 30 exchanges' : 'Add a copy right below, then edit it',
        on: { click: () => copy(ctx, m, s) } }, 'Copy'),
      h('button.danger', { disabled: !edit_, title: `Remove this whole exchange: what it gives (${rewardNames(ctx, s)}) and what it costs`,
        on: { click: () => remove(ctx, m, s) } }, `Remove ${rewardNames(ctx, s)}`));
    const ownDiags = inSpan(ctx, s.start, s.end).filter(d => !s.condition.concat(s.pay).some(l => d.start >= l.start && d.start < l.end));
    // headline: what the player gets (the chance the server really uses when there is a choice)
    const got = (s.paid ? s.paid.lines : []).filter(x => x.prob > 0);
    const gets = got.map((x, k) => {
      const info = itemOf(ctx, x.line);
      return [k ? h('span.ex-or', given > 1 ? ' + ' : ' or ') : null,
        h('span.ex-get-item', { 'data-item-id': info && info.id !== null ? info.id : null, class: info ? 'r-' + info.rarity : '' },
          `${info ? info.name : x.line.item.name} ×${fmt(x.line.num.value)}`),
        got.length > 1 ? h('span.ex-get-pct', ` ${pct(x.prob)}`) : null];
    });
    return h('div.ex-card' + (s.dropped ? '.dropped' : ''),
      h('div.ex-head', h('span.ex-label', `Exchange ${n}`), s.dropped ? h('span.tag.bad', 'not loaded (over 30)') : null,
        h('span.line', { title: s.text.name }, `L${f.lineOf(s.start) + 1}`), diagTags(ownDiags), tools),
      h('div.ex-get', h('span.ex-get-label', got.length > 1 && given === 1 ? 'You get one of' : 'You get'), gets.length ? gets : h('span.muted', 'nothing')),
      h('div.ex-body',
        h('div.ex-section', h('div.ex-section-title', 'Rewards'), rew, payRow),
        h('div.ex-section', h('div.ex-section-title', 'Costs (taken from the player)'), ing, h('div.row.ex-tools', pickBtn('cond', null, '+ Ingredient')))),
      game);
  }

  // ---------------------------------------------------------------- Try it (FRE.exchangeSim)
  // Presses OK in the exchange window N times on the recipes as they are now (unsaved edits
  // included), with the server code ported in loaders/exchange-sim.js.
  const trial = { tries: 1000, mode: 'same', free: 10, stock: 10, seed: 1 };
  function tryIt(ctx, m, s, i) {
    const S = FRE.exchangeSim, env = S.envFromWorkspace(ctx.ws), table = S.serverTable(model(ctx));
    const pos = table.find(m.mmi.value) ? table.find(m.mmi.value).sets.findIndex(x => x.source === s) : -1;
    const out = h('div.ex-try-out');
    const set = (k, v) => { if (v !== null) { trial[k] = v; go(); } };      // every change runs again
    const stockRow = h('label', 'Ingredients for ', numInput({ key: `try|stock`, value: trial.stock, min: 1, max: 100000, onCommit: v => set('stock', v) }), ' exchanges');
    const showStock = () => { stockRow.style.display = trial.mode === 'keep' ? '' : 'none'; };
    const seedIn = numInput({ key: `try|seed`, value: trial.seed, min: 0, max: 4294967295, onCommit: v => set('seed', v) });
    let runs = 0;
    function go() {
      out.textContent = '';
      runs++;
      out.appendChild(h('div.muted.small', `Run ${runs} · seed ${FRE.dom.fmt(trial.seed)}`));
      if (pos < 0) { out.appendChild(h('p.warn-text', 'The server does not load this exchange (a duplicate menu or over 30 exchanges).')); return; }
      let r;
      try { r = S.run(env, table, m.mmi.value, pos, trial); } catch (e) { out.appendChild(h('p.warn-text', 'Cannot run: ' + e.message)); return; }
      out.appendChild(trialResult(env, r));
    }
    const body = h('div.ex-try',
      h('p.muted.small', 'This presses OK in the exchange window again and again, the way the server does it (CExchange::ResultExchange: check the ingredients, roll the rewards, check the bag, take, give). ',
        'It uses the exchange as it is in the editor now, saved or not.'),
      h('div.row.ex-tools',
        h('label', 'Press OK ', numInput({ key: `try|tries`, value: trial.tries, min: 1, max: 1000000, onCommit: v => set('tries', v) }), ' times'),
        h('select', { on: { change: e => { trial.mode = e.target.value; showStock(); go(); } } },
          h('option', { value: 'same', selected: trial.mode === 'same' }, 'Same fresh bag every time (how often each reward comes out)'),
          h('option', { value: 'keep', selected: trial.mode === 'keep' }, 'One bag that keeps the rewards (runs out, fills up)')),
        stockRow,
        h('label', 'Empty bag slots ', numInput({ key: `try|free`, value: trial.free, min: 0, max: S.MAX_INVENTORY_FREE, onCommit: v => set('free', v) })),
        h('label', { title: 'The same seed gives the same rolls (so a result can be repeated)' }, 'Seed ', seedIn),
        h('button.primary', { title: 'Run again with the next seed: new rolls', on: { click: () => {

      out);
    showStock();
    modal({ title: `Try: ${rewardNames(ctx, s)} (${whoOpens(ctx, m)}, exchange ${i + 1})`, wide: true, body });
    go();
  }

  function trialResult(env, r) {
    const R = r.results, nameOf = id => { const p = env.prop(id); return p ? p.name : String(id); };
    const parts = [
      R.SUCCESS ? h('span.tag.ok', `${fmt(R.SUCCESS)} exchanged`) : null,
      R.CONDITION_FAILED ? h('span.tag.warn', `${fmt(R.CONDITION_FAILED)} refused: missing ingredients`) : null,
      R.INVENTORY_FAILED ? h('span.tag.warn', `${fmt(R.INVENTORY_FAILED)} refused: bag full`) : null,
      R.FAILED ? h('span.tag.bad', `${fmt(R.FAILED)} failed`) : null,
      R.CRASH ? h('span.tag.bad', 'the server CRASHED') : null,

    ];
    const tbl = h('table.items.ex', h('tr', h('th', 'Reward'), h('th.num', 'Times'), h('th.num', 'Items'), h('th.num', { title: 'How often this reward came out in THIS run (Times ÷ presses). Luck moves it a little around the chance you set; more presses = closer.' }, 'Got in this run'), h('th.num', { title: 'The chance you set (what the server uses for every press)' }, 'Chance set'), h('th.num', 'Lost')));
    for (const g of r.given) tbl.appendChild(h('tr', h('td', { 'data-item-id': env.prop(g.line.id) ? g.line.id : null }, `${nameOf(g.line.id)} ×${fmt(g.line.num)}`),
      h('td.num', fmt(g.times)), h('td.num', fmt(g.qty)), h('td.num', R.SUCCESS ? `${g.seenPct.toFixed(2)}%` : '-'), h('td.num', `${g.serverPct.toFixed(2)}%`),
      h('td.num', g.lost ? h('span.warn-text', fmt(g.lost)) : '')));
    const taken = [...r.taken.values()].map(t => t.penya ? `${fmt(t.num)} Penya` : `${fmt(t.num)} × ${nameOf(t.id)}`);
    const seen = Object.entries(r.samples).map(([k, x]) => h('div.ex-try-msg',
      h('span.ex-label', k === 'LOST' ? 'when a reward is lost' : k.replace('_', ' ').toLowerCase()), ' ',
      x.view.chat.map(c => h('div', h('span.muted', '[chat] '), c)),
      x.view.box ? h('div', h('span.muted', '[message box] '), x.view.box) : null,
      !x.view.chat.length && !x.view.box ? h('span.muted', '(nothing is shown)') : null));
    const notes = [];
    if (R.INVENTORY_FAILED) notes.push('The server wants at least one EMPTY bag slot for every exchange, even when the reward would stack on one the player already has (CExchange::IsFull counts each reward as quantity ÷ stack size slots, rounded down). A stack the exchange uses up counts as empty.');
    if (r.lost) notes.push('Lost: the bag check counted fewer slots than the rewards need, so the server took the ingredients but could not put every reward in the bag. It only writes an error to its log; the player gets nothing for it.');
    if (R.CONDITION_FAILED && r.mode !== 'same') notes.push('Missing ingredients: the bag ran out after the exchanges it had ingredients for.');
    return h('div',
      h('div.row.ex-tools', h('b', `${fmt(r.tries)} presses:`), parts),
      tbl,
      h('p', h('span.muted', 'Taken from the player: '), taken.join(', ') || 'nothing'),
      h('h3', 'What the player sees'), seen,
      notes.length ? h('ul.small', notes.map(n => h('li', n))) : null);
  }

  // copy / move: plain when the recipe text is ASCII; recipes with EUC-KR comments are
  // rebuilt from their values (the comments go), shown before it happens
  function confirmRebuilt(ctx, title, plan, label) {

      h('p', 'This exchange has Korean comments, and only plain ASCII can be written into this file. The exchange is rewritten from its values: the same items, quantities and chances, without the comments.'),

  }
  function move(ctx, m, s, dir) {

  }
  function remove(ctx, m, s) {

    try { splices = O().removeSet(f.text, s); } catch (e) { FRE.dom.toast(e.message, 'bad'); return; }
    modal({ title: `Remove ${rewardNames(ctx, s)} (${whoOpens(ctx, m)}, exchange ${s.index + 1})`, wide: true, body: h('div',
      h('p', 'The whole exchange goes: what it gives and what it costs. The exchanges below it move up one place in the window.'),
      h('h3', 'Lines that change'), FRE.ui.renderDiff(f, f.text, f.preview(splices))),
      buttons: [{ label: 'Cancel' }, { label: 'Remove', cls: 'primary danger', onClick: () => { st.pick = null; edit(ctx, () => splices, `remove exchange ${s.index + 1}`); } }] });

  FRE.ui.modules.push(mod);
  // The exchange cards of one menu, for other tasks (NPC Shops shows an NPC's exchange menus with them).

  FRE.ui.exchangeView = {
    st,
    cards: (ctx, m) => m.sets.map((s, i) => card(ctx, m, s, i)),
    picking: () => !!st.pick,
    clearPick: () => { st.pick = null; },
    addTarget: ctx => mod.addTarget(ctx),

// ---- ui/app.js ----
// App shell: toolbar (mode switch, load, save, backup, undo), the left list and
// centre editor of the active module, the shared item database, the problems
// panel and the save flow. Editors live in ui/<module>.js (FRE.ui.modules).
// Every data change goes through Workspace.apply() with splices; everything
// shown is re-derived from the file text after each edit.
(function (FRE) {
  'use strict';
  const { h, $, fmt, toast, modal } = FRE.dom;
  const { diagRow } = FRE.ui;
  const ROW_H = 40;

  const S = {
    ws: null, resDir: null, backupDir: null, client: null, createMissing: new Set(), mode: 'npc',
    layout: null, pendingRoot: null, task: null, busy: false,
    queries: {}, items: [], filtered: [], rarity: new Set(), ik1: '', ik3: '', itemQuery: '',
    diagOpen: false,
  };
  const modules = () => FRE.ui.modules;
  const active = () => modules().find(m => m.id === S.mode) || modules()[0];

  // Context handed to modules
  const ctx = {
    get ws() { return S.ws; },
    get hasClient() { return !!S.client; },     // a Client folder was found (client-only files can be saved)
    get query() { return S.queries[S.mode] || ''; },
    // list badges: the keys of the edits still in the undo history, so Undo removes a badge and Redo brings it back
    get edited() { return new Set(S.ws ? S.ws.history.flatMap(e => e.tags || []) : []); },
    renderAll: (withItems) => renderAll(withItems),
    // [{ stamp, bytes }] of every backup copy of a file, or null when no backups folder is known
    backupsOf: name => (S.backupDir ? FRE.fsa.backupCopies(S.backupDir, name) : Promise.resolve(null)),
    get backupKey() { return S.backupDir ? S.backupDir.name : null; },
    renderList: () => renderList(),
    // set the list search of the current task (e.g. so a just-created NPC is listed)
    setQuery(q) { S.queries[S.mode] = q; $('list-search').value = q; },
    // switch to another task with the same folder, then run then(ctx) (e.g. select a menu);
    // unsaved edits: Cancel / Discard / Save and switch
    openTask: (id, then) => leaveTask(async () => { await loadTask(id); if (then && S.task === id) { then(ctx); renderAll(false); } }),
    // bytes of a file in the Client folder by relative path ('Char/char_NpcHende.tga', names matched without case), or null
    async clientFile(rel) {
      if (!S.client) return null;
      const parts = rel.split('/'), name = parts.pop();
      const dir = await FRE.fsa.dirAt(S.client.dir, parts.join('/'));
      if (!dir) return null;
      const fh = (await FRE.fsa.findFiles(dir, [name])).get(name.toLowerCase());
      return fh ? (await FRE.fsa.readHandle(fh)).bytes : null;
    },
    // Apply an edit op: make(text) -> splices. `key` marks what was edited (list badges).
    // Repeated edits of the same field within 2 s (typing) are folded into one undo step.
    edit(lowerFile, make, label, key) {
      const f = S.ws.files.get(lowerFile);
      const said = FRE.dom.toasts();
      try {
        const splices = make(f.text);
        if (!splices.length) return;
        const before = S.ws.history[S.ws.history.length - 1];
        S.ws.apply(lowerFile, splices, label);
        tagLast(key ? [key] : [], label);
        const now = Date.now(), last = S.ws.history[S.ws.history.length - 1];
        if (before && before !== last && before.label === label && String(before.tags) === String(last.tags) && now - (before.at || 0) < 2000 && S.ws.mergeLast()) before.at = now;
        else { last.at = now; done(label, said); }
      } catch (e) { toast(e.message, 'bad'); }
      renderAll(false);
    },
    // Several files as one undo step: make() -> [{ file: lowerName, splices }] (current texts).
    // mergeKey: the same field typed again within 2 s is folded into the step before (one undo step).
    editGroup(make, label, keys = [], mergeKey = null) {
      const said = FRE.dom.toasts();
      try {
        const before = S.ws.history[S.ws.history.length - 1];
        S.ws.applyGroup(make(), label);
        const last = S.ws.history[S.ws.history.length - 1], now = Date.now();
        if (mergeKey && before && before !== last && before.mergeKey === mergeKey && now - (before.at || 0) < 2000 && S.ws.mergeLast()) { before.at = now; return; }
        tagLast(keys, label);
        if (last && last !== before) { last.at = now; last.mergeKey = mergeKey; }
        done(label, said);
      } catch (e) { toast(e.message, 'bad'); } finally { renderAll(false); }
    },
  };

  // ------------------------------------------------------------------ folder + task
  // The user picks ONE folder (FLYFF-V19-SOURCE, or test-data); FRE.layout finds Server/Resource,
  // Client and backups in it. Then one task at a time: only that editor's files are shown and saved.
  async function chooseRoot() {
    try { await useRoot(await FRE.fsa.pickFolder('flyff-root')); }
    catch (e) { if (e.name !== 'AbortError') toast(e.message, 'bad'); }
  }

  async function useRoot(dir) {
    if (!(await FRE.fsa.ensurePermission(dir))) { toast('Permission to the folder was not granted.', 'bad'); return; }
    let layout;
    try { layout = await FRE.layout.detectLayout(dir); } catch (e) { toast(e.message, 'bad'); return; }
    S.layout = layout; S.pendingRoot = null;
    if (layout.backups) S.backupDir = layout.backups;
    else if (S.backupDir && S.backupKind === 'test') S.backupDir = null;     // never back up real files into a test folder
    S.backupKind = layout.kind;
    FRE.fsa.remember('root', dir);
    renderAll(false);
  }

  async function loadTask(id) {
    const L = S.layout;
    if (!L || S.busy) return;
    S.busy = true;
    try {
      const found = await FRE.fsa.findFiles(L.res, FRE.Workspace.ALL_FILES);
      for (const must of ['masquerade.prj', 'spec_item.txt']) {
        if (!found.has(must)) { toast(`${FRE.layout.describe(L).res} has no ${must}. Nothing was loaded.`, 'bad'); return; }
      }
      const files = new Map();
      for (const [lower, handle] of found) {
        const { bytes, stamp } = await FRE.fsa.readHandle(handle);
        files.set(lower, new FRE.SourceFile(handle.name, bytes, { handle, stamp }));
      }
      const t0 = performance.now();
      S.ws = new FRE.Workspace(files, { only: id }).load();
      S.resDir = L.res;
      S.client = null;
      if (L.client) await loadClient(L.client);
      if (S.ws.needsMaps()) await loadMaps(L.res);
      S.mode = id; S.task = id;
      $('list-search').value = S.queries[id] || '';
      buildItems();
      const m = modules().find(x => x.id === id);
      if (S.ws.available[id].ok && m && m.onLoad) m.onLoad(ctx);
      renderAll();
      toast(`${m ? m.label : id}: loaded from ${FRE.layout.describe(L).res} in ${Math.round(performance.now() - t0)} ms`, 'ok');
    } catch (e) { toast(e.message, 'bad'); }
    finally { S.busy = false; }
  }

  // For every map in World.inc (read-only): World/<map>/<map>.dyo (which NPCs stand in the game),
  // <map>.rgn + <map>.txt.txt (area names) and WdMadrigal.wld.cnt (continents): loaders/area.js
  async function loadMaps(res) {
    const world = await FRE.layout.child(res, 'World');
    if (!world) return;
    const dyo = new Map(), worldFiles = new Map(), seen = new Set();
    const cworld = S.client ? await FRE.layout.child(S.client.dir, 'World') : null;
    for (const w of S.ws.worldList()) {
      if (seen.has(w.name)) continue;
      seen.add(w.name);
      const dir = await FRE.layout.child(world, w.name);
      if (!dir) continue;
      const names = ['.dyo', '.rgn', '.txt.txt', '.wld.cnt'].map(e => w.name + e);
      const found = await FRE.fsa.findFiles(dir, names);
      for (const n of names) {
        const fh = found.get(n.toLowerCase());
        if (!fh) continue;
        const { bytes, stamp } = await FRE.fsa.readHandle(fh);
        // the .dyo with its handle: the NPC task can add an NPC record to it (Server + Client copies)
        if (n.endsWith('.dyo')) dyo.set(w.name, new FRE.SourceFile(fh.name, bytes, { handle: fh, stamp, binary: true, dir: `World/${dir.name}` }));
        else worldFiles.set(`world/${w.name}/${n}`.toLowerCase(), new FRE.SourceFile(fh.name, bytes));
      }
      // the client's copy (Client/World/<map>/<map>.dyo), for the client sync
      const cdir = cworld && dyo.has(w.name) ? await FRE.layout.child(cworld, w.name) : null;
      const ch = cdir && (await FRE.fsa.findFiles(cdir, [w.name + '.dyo'])).get((w.name + '.dyo').toLowerCase());
      if (ch) {
        const { bytes, stamp } = await FRE.fsa.readHandle(ch);
        S.client.files.set(ch.name.toLowerCase(), new FRE.SourceFile(ch.name, bytes, { handle: ch, stamp, binary: true, dir: `World/${cdir.name}` }));
      }
    }
    S.ws.setMapFiles(dyo, worldFiles);
  }

  // back to the start screen; unsaved edits are only dropped after asking
  function changeTask() {
    leaveTask(() => { S.task = null; S.ws = null; S.client = null; S.diagOpen = false; $('diag-panel').hidden = true; renderAll(false); });
  }
  // run go() once the open task has no unsaved edit: ask first, and offer to save them
  function leaveTask(go) {
    const dirty = S.ws ? S.ws.dirtyFiles() : [];
    if (!dirty.length) { go(); return; }
    modal({ title: 'Unsaved changes', body: h('div',
      h('p', `${dirty.map(f => f.name).join(', ')} ${dirty.length > 1 ? 'have' : 'has'} changes that are not saved.`),
      h('p.muted', 'Save and continue: the usual review, backup and write, then go on. Discard: the edits are lost.')),
      buttons: [{ label: 'Cancel' }, { label: 'Discard changes', cls: 'danger', onClick: go },
        { label: 'Save and continue', cls: 'primary', onClick: () => { onSave(go); } }] });
  }

  async function pickBackup() {
    try {
      const dir = await FRE.fsa.pickFolder('flyff-backups');
      if ((S.resDir && (await dir.isSameEntry(S.resDir))) || (S.layout && (await dir.isSameEntry(S.layout.root)))) { toast('Pick a folder outside the source folder for backups, e.g. FLYFF-RESOURCE-EDITOR/backups.', 'bad'); return false; }
      if (!(await FRE.fsa.ensurePermission(dir))) return false;
      S.backupDir = dir;
      FRE.fsa.remember('backup', dir);
      renderToolbar();
      return true;
    } catch (e) { if (e.name !== 'AbortError') toast(e.message, 'bad'); return false; }
  }

  // ------------------------------------------------------------------ Client/ copies
  // The game client reads its own loose copies in Client/ (commit b7645c52). With a
  // Client folder chosen, every save applies the same change there (FRE.clientSync).
  const clientNames = () => S.ws ? S.ws.clientFileNames()
    : [...new Set([...FRE.Workspace.CORE_CLIENT, ...FRE.Workspace.MODULES.flatMap(m => m.client)])];

  async function loadClient(dir) {
    const found = await FRE.fsa.findFiles(dir, clientNames());
    const files = new Map();
    for (const [lower, handle] of found) {
      const { bytes, stamp } = await FRE.fsa.readHandle(handle);
      files.set(lower, new FRE.SourceFile(handle.name, bytes, { handle, stamp }));
    }
    // the Donation Shop's category tree is client-only: Client/Client/DonationShopTree.inc
    let tree = null;
    try {
      const sub = await dir.getDirectoryHandle('Client');
      const th = (await FRE.fsa.findFiles(sub, ['DonationShopTree.inc'])).get('donationshoptree.inc');
      if (th) tree = FRE.donationTree.loadTree(new FRE.SourceFile(th.name, (await FRE.fsa.readHandle(th)).bytes));
    } catch (e) { if (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') toast('DonationShopTree.inc: ' + e.message, 'bad'); }
    // rules windows (docs/patches/npc-board.diff): Client/Client/NpcBoard_<menu id>.inc, edited in NPC Shops
    const boards = [];
    try {
      const sub = await dir.getDirectoryHandle('Client');
      for await (const [name, handle] of sub.entries()) {
        if (handle.kind !== 'file' || !/^npcboard_\d+\.inc$/i.test(name)) continue;
        const { bytes, stamp } = await FRE.fsa.readHandle(handle);
        boards.push(new FRE.SourceFile(name, bytes, { handle, stamp, dir: 'Client' }));
      }
    } catch (e) { if (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') toast('Client/Client/NpcBoard files: ' + e.message, 'bad'); }
    // Battle Pass rarity / icon textures live in Client/Theme (WndBattlePass.cpp MakePath(DIR_THEME, ...))
    let theme = null;
    try {
      const th = await dir.getDirectoryHandle('Theme');
      theme = [];
      for await (const [name, handle] of th.entries()) if (handle.kind === 'file') theme.push(name);
    } catch (e) { if (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError') toast('Client/Theme: ' + e.message, 'bad'); }
    // Client/Model file names (Add New NPC checks a model's .o3d and .ani files); names only, nothing is read
    // Client/Model/Texture names; a model's .o3d is read when it is picked (S.readModel) to check its textures
    let models = null, textures = null, texIndex = null, modelDir = null;
    if (S.ws && S.ws.available.npc && S.ws.available.npc.ok) {
      try {
        modelDir = await FRE.layout.child(dir, 'Model');
        if (modelDir) {
          models = []; for await (const [name, handle] of modelDir.entries()) if (handle.kind === 'file') models.push(name);
          const td = await FRE.layout.child(modelDir, 'Texture');
          if (td) { textures = []; for await (const [name, handle] of td.entries()) if (handle.kind === 'file') textures.push(name); }
        } else {
          // a test copy has no Model folder (the 3D files are large): tools/refresh-fixtures.sh writes Client/Model.list (names),
          // Client/ModelTexture.list (Model/Texture names) and Client/Model.textures (each Mvr_*.o3d's textures, tab-separated)
          const found = await FRE.fsa.findFiles(dir, ['Model.list', 'ModelTexture.list', 'Model.textures']);
          const lines = async n => found.get(n) ? new TextDecoder('latin1').decode((await FRE.fsa.readHandle(found.get(n))).bytes).split(/\r?\n/).map(l => l.trim()).filter(Boolean) : null;
          models = await lines('model.list');
          textures = await lines('modeltexture.list');
          const idx = await lines('model.textures');
          if (idx) texIndex = new Map(idx.map(l => { const [o, ...t] = l.split('\t'); return [o, t.filter(Boolean)]; }));
        }
      } catch (e) { toast('Client/Model: ' + e.message, 'bad'); }
    }
    S.client = { dir, files, tree, theme, models, modelDir, boards };
    if (S.ws) { S.ws.setBoardFiles(boards); S.ws.setDonationTree(tree); S.ws.setClientTheme(theme); S.ws.setClientModels(models); S.ws.setClientTextures(textures, texIndex); }
    S.createMissing = new Set(clientNames().map(n => n.toLowerCase()).filter(n => !files.has(n)));   // offered, can be unticked
  }

  // [{name, lower, mode, text}] for the client files of the loaded workspace
  function clientStatus() {
    if (!S.ws || !S.client) return [];
    return S.ws.clientFileNames().filter(n => S.ws.files.has(n.toLowerCase())).map(n => {
      const lower = n.toLowerCase(), c = S.client.files.get(lower) || null;
      const mode = FRE.clientSync.modeOf(S.ws.files.get(lower), c);
      return { name: c ? c.name : n, lower, mode, text: FRE.clientSync.MODE_TEXT[mode] };
    });
  }

  // The standard note after every change (add / change / remove), unless the editor already showed one.
  function done(label, said) {
    if (FRE.dom.toasts() !== said) return;
    const n = S.ws.dirtyFiles().length;
    toast(`✓ ${label || 'Changed'} — not saved yet (${n} file${n === 1 ? '' : 's'} to save; Ctrl+Z undoes it)`, 'ok');
  }
  function undo() {
    if (!S.ws) return;
    const e = S.ws.history[S.ws.history.length - 1];
    if (S.ws.undo() !== null) { toast(`↶ Undone: ${(e && e.label) || 'edit'}`); renderAll(false); }
  }
  function redo() {
    if (!S.ws) return;
    const e = S.ws.redoStack[S.ws.redoStack.length - 1];
    if (S.ws.redo() !== null) { toast(`↷ Redone: ${(e && e.label) || 'edit'}`); renderAll(false); }
  }

  function setMode(id) { if (id !== S.task) loadTask(id); }

  // ------------------------------------------------------------------ rendering
  // the edit just applied (last undo entry): its label and the list keys it marks as edited
  function tagLast(keys, label) {
    const e = S.ws.history[S.ws.history.length - 1];
    if (!e) return;
    if (keys.length) e.tags = (e.tags || []).concat(keys);
    if (label) e.label = label;
  }
  // "recipe 1 qty (MMI_COLLECT01)" for the Undo / Redo tooltips
  const stepText = e => e ? `${e.label || 'edit'}${e.tags && e.tags.length ? ` (${[...new Set(e.tags.map(t => t.slice(t.indexOf('|') + 1)))].join(', ')})` : ''}` : '';

  function renderAll(withItems = true) {
    document.body.classList.toggle('start', !S.task);
    renderToolbar(); renderBanners(); renderModes();
    if (!S.task) { renderStart(); return; }
    renderList(); renderEditor();
    if (withItems) renderItemFilters();
    renderItems();
    if (S.diagOpen) renderDiagPanel();
  }

  // toolbar while a task is open: its name, [Change task], which files (REAL / TEST)
  function renderModes() {
    const el = $('mode-tabs'); el.textContent = '';
    if (!S.task || !S.layout) return;
    const m = modules().find(x => x.id === S.task), d = FRE.layout.describe(S.layout);
    el.appendChild(h('span.tb-label', 'Task:'));
    el.appendChild(h('span.task-name', m ? m.label : S.task));
    el.appendChild(h('button', { id: 'btn-change-task', title: 'Back to the start screen to pick another task', on: { click: changeTask } }, 'Change task'));
    el.appendChild(h('span.kind-tag.' + S.layout.kind, { title: `${d.res}${d.client ? ' + ' + d.client : ''}` }, `${d.label} · ${S.layout.root.name}`));
  }

  // start screen: 1. the folder, 2. the task
  function renderStart() {
    const el = $('editor'); el.className = ''; el.textContent = '';
    FRE.ui.tooltip.hide();
    const wrap = h('div.start-wrap', h('h2', 'What do you want to edit?'),

        L.kind === 'real' ? h('p.small', { style: 'color:var(--bad)' }, 'These are the real server files. Test on FLYFF-RESOURCE-EDITOR/test-data first.') : null,

    } else if (S.pendingRoot) {
      wrap.appendChild(h('div.folder-card', h('p', `Last time: `, h('b', S.pendingRoot.name)),
        h('div.row', { style: 'justify-content:flex-start;gap:8px' },
          h('button.primary', { id: 'btn-allow', on: { click: () => useRoot(S.pendingRoot) } }, `Allow access to ${S.pendingRoot.name}`),
          h('button', { id: 'btn-root', on: { click: chooseRoot } }, 'Choose another folder'))));

      wrap.appendChild(h('div.folder-card', h('p', 'Pick ', h('code', 'FLYFF-V19-SOURCE'), ' (real files), or ', h('code', 'FLYFF-RESOURCE-EDITOR/test-data'), ' (test copy). The editor finds Server/Resource and Client inside it.'),

        h('b', wm.label), h('span', um && um.help ? um.help.replace(/^[^:]+:\s*/, '').replace(/^./, c => c.toUpperCase()) : wm.required.join(', ')));
