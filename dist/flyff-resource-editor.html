<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLYFF Resource Editor</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0f1218;
  --panel: #161b24;
  --panel-2: #1c2330;
  --line: #2a3342;
  --text: #dde3ee;
  --muted: #8a96aa;
  --accent: #4f8cff;
  --accent-2: #2f6be0;
  --ok: #3ccf8e;
  --warn: #f2b84b;
  --bad: #ff5d5d;
  --add: #16391f;
  --del: #43191b;
  --normal: #c9d1de;
  --unique: #f2b84b;
  --ultimate: #c77dff;
  --baruna: #4fd1e8;
  --radius: 6px;
  font-size: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent-2); border-color: var(--accent); }
button.danger { background: #5a1d22; border-color: var(--bad); }
button.icon { padding: 2px 8px; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 8px; min-width: 0; }
input:focus, select:focus { outline: 1px solid var(--accent); }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 6px 10px; }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { flex: 1; }
.check { display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--muted); font-size: 12px; }

#toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .3px; }
.tb-group { display: flex; gap: 6px; }
.tb-files { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.file-chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.file-chip.ok::before { content: "✓ "; color: var(--ok); }
.file-chip.missing::before { content: "✗ "; color: var(--bad); }
.file-chip.ro::before { content: "🔒 "; }
.file-chip.dirty { border-color: var(--warn); }
.diag-badge { border-radius: 12px; min-width: 40px; }
.diag-badge.has-warn { border-color: var(--warn); color: var(--warn); }
.diag-badge.has-block { border-color: var(--bad); color: var(--bad); background: #3a1518; }

#banners .banner { padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.banner.info { background: #14243f; }
.banner.warn { background: #3a2e12; }
.banner.bad { background: #3a1518; }

#layout { flex: 1; display: grid; grid-template-columns: 270px 1fr 430px; min-height: 0; }
aside, section { min-height: 0; display: flex; flex-direction: column; }
#left { border-right: 1px solid var(--line); background: var(--panel); }
#right { border-left: 1px solid var(--line); background: var(--panel); }
#center { overflow: hidden; }
.panel-head { padding: 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.panel-head.col { flex-direction: column; align-items: stretch; }
.panel-head input[type=search] { flex: 1; }
.list { overflow-y: auto; flex: 1; }

.npc { padding: 7px 12px; border-bottom: 1px solid #1f2633; cursor: pointer; }
.npc:hover { background: var(--panel-2); }
.npc.sel { background: #1d2c47; border-left: 3px solid var(--accent); padding-left: 9px; }
.npc .n { display: flex; justify-content: space-between; gap: 6px; }
.npc .k { font-size: 11px; color: var(--muted); }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.chip { color: var(--bad); border-color: #6b2b2b; }
.tag.edit { color: var(--warn); border-color: #6b5520; }
.tag.warn { color: var(--warn); }
.tag.bad { color: var(--bad); }

#editor { flex: 1; overflow-y: auto; padding: 16px 20px; }
.empty-state { text-align: center; padding-top: 12vh !important; color: var(--text); }
.npc-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.npc-title h2 { margin: 0; font-size: 20px; }
.tabs { display: flex; gap: 4px; margin: 14px 0 10px; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; background: transparent; }
.tabs button.sel { background: var(--panel-2); border-color: var(--accent); }
.tabs .count { color: var(--muted); font-size: 11px; margin-left: 4px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 6px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 5px 8px; border-bottom: 1px solid #1f2633; text-align: left; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input[type=number], td input.num-input { width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
td select { width: 70px; }
tr.changed td:first-child { box-shadow: inset 3px 0 var(--warn); }
.def { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
.line { font-size: 11px; color: var(--muted); }
.r-normal { color: var(--normal); } .r-unique { color: var(--unique); } .r-ultimate { color: var(--ultimate); } .r-baruna { color: var(--baruna); }

#diag-panel { max-height: 38%; overflow-y: auto; border-top: 1px solid var(--line); background: var(--panel); }
.diag { padding: 6px 14px; border-bottom: 1px solid #1f2633; font-size: 13px; cursor: pointer; display: flex; gap: 8px; }
.diag:hover { background: var(--panel-2); }
.diag .sev { font-weight: 600; min-width: 46px; }
.diag .sev.BLOCK { color: var(--bad); } .diag .sev.WARN { color: var(--warn); } .diag .sev.INFO { color: var(--muted); }
.diag .new { color: var(--bad); font-size: 11px; }

.chips { flex-wrap: wrap; }
.chip { flex: 0 0 auto !important; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
.chip[data-r=normal].on { border-color: var(--normal); color: var(--normal); }
.chip[data-r=unique].on { border-color: var(--unique); color: var(--unique); }
.chip[data-r=ultimate].on { border-color: var(--ultimate); color: var(--ultimate); }
.chip[data-r=baruna].on { border-color: var(--baruna); color: var(--baruna); }
.chip.on { background: #222b3a; }
.item-head, .item { display: grid; grid-template-columns: 1fr 92px 34px 74px 34px; gap: 6px; align-items: center; padding: 0 10px; }
.item-head { font-size: 11px; color: var(--muted); padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.virtual { position: relative; }
.item { position: absolute; left: 0; right: 0; height: 40px; border-bottom: 1px solid #1f2633; font-size: 13px; }
.item:hover { background: var(--panel-2); }
.item .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.15; }
.item .nm .def { display: block; overflow: hidden; text-overflow: ellipsis; }
.item .ty { font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item .num { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.item button { padding: 0 8px; font-weight: 700; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(980px, 92vw); max-height: 88vh; display: flex; flex-direction: column; }
.modal header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal .body { padding: 12px 16px; overflow-y: auto; flex: 1; }
.modal footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.diff { font-family: Consolas, monospace; font-size: 12px; white-space: pre; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); margin: 6px 0 14px; }
.diff div { padding: 1px 8px; }
.diff .add { background: var(--add); } .diff .del { background: var(--del); } .diff .ctx { color: var(--muted); }
.diff .gap { color: var(--muted); background: var(--panel-2); }
.log { font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }

#toasts { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 20; }
.toast { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.toast.bad { border-color: var(--bad); } .toast.ok { border-color: var(--ok); }

.help { color: var(--muted); font-size: 12px; margin-top: 3px; }
.menus { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.tag.exch { color: var(--baruna); border-color: #2b6672; }
button.primary:disabled { background: var(--panel-2); border-color: var(--line); }

.modes .mode { border-radius: 14px; padding: 4px 12px; }
.modes .mode.sel { background: #1d2c47; border-color: var(--accent); }
.def.block { display: block; font-size: 11px; }
.rules { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 6px; }
.tag.rule { font-size: 11px; color: var(--text); }
.tag.info { color: var(--muted); }
tr.dropped td { opacity: .55; }
select.shop-type { padding: 2px 6px; font-size: 12px; border-radius: 10px; }

</style>
</head>
<body>
<header id="toolbar">
  <div class="brand">FLYFF Resource Editor <span class="muted" id="version"></span></div>
  <div class="tb-group">
    <button id="btn-load" class="primary">Load Folder</button>
    <button id="btn-reopen" hidden>Reopen last folder</button>
    <button id="btn-backup-dir" title="Folder where backups are written before every save">Backup folder: <b id="backup-name">not set</b></button>
  </div>
  <div class="tb-group">
    <button id="btn-undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button id="btn-redo" title="Redo (Ctrl+Y)" disabled>Redo</button>
    <button id="btn-save" class="primary" title="Save (Ctrl+S)" disabled>Save</button>
    <button id="btn-backup" title="Snapshot all loaded files into the backup folder" disabled>Backup</button>
  </div>
  <div id="mode-tabs" class="tb-group modes"></div>
  <div id="file-status" class="tb-files"></div>
  <button id="btn-diag" class="diag-badge" title="Problems">0</button>
</header>
<div id="banners"></div>
<main id="layout">
  <aside id="left">
    <div class="panel-head">
      <input id="list-search" type="search" placeholder="Search" autocomplete="off">
      <span id="list-extra"></span>
    </div>
    <div id="list" class="list"></div>
  </aside>
  <section id="center">
    <div id="editor" class="empty-state">
      <h2>FLYFF Resource Editor</h2>
      <p>Click <b>Load Folder</b> and pick <code>FLYFF-V19-SOURCE/Server/Resource</code><br>(or a test copy such as <code>test-data/Resource</code>).</p>
      <p class="muted">Works in Chrome and Edge. Nothing is written until you press Save and confirm the changes.</p>
    </div>
    <div id="diag-panel" hidden></div>
  </section>
  <aside id="right">
    <div class="panel-head col">
      <input id="item-search" type="search" placeholder="Search items (name or II_)" autocomplete="off">
      <div class="row">
        <select id="item-ik1"><option value="">All categories</option></select>
        <select id="item-ik3"><option value="">All types</option></select>
      </div>
      <div class="row chips" id="rarity-chips">
        <button class="chip" data-r="normal">Normal</button>
        <button class="chip" data-r="unique">Unique</button>
        <button class="chip" data-r="ultimate">Ultimate</button>
        <button class="chip" data-r="baruna">Baruna</button>
      </div>
      <label class="row small" id="new-price-row">Price for new items
        <input id="new-price" type="text" inputmode="numeric" placeholder="item's own price">
      </label>
    </div>
    <div class="item-head"><span>Name</span><span>Type</span><span>Lv</span><span>ATK</span><span></span></div>
    <div id="item-list" class="list virtual"><div id="item-spacer"></div></div>
    <div id="item-count" class="muted small pad"></div>
  </aside>
</main>
<div id="modal-root"></div>
<div id="toasts"></div>

  function renderToolbar() {
    const ws = S.ws;
    $('backup-name').textContent = S.backupDir ? S.backupDir.name : 'not set';
    $('btn-undo').disabled = !ws || !ws.history.length;
    $('btn-redo').disabled = !ws || !ws.redoStack.length;
    const dirty = ws ? ws.dirtyFiles() : [];
    $('btn-save').disabled = !dirty.length;
    $('btn-save').textContent = dirty.length ? `Save (${dirty.length})` : 'Save';
    $('btn-backup').disabled = !ws;
    const fs = $('file-status'); fs.textContent = '';
    if (ws) {
      const shown = new Set(['spec_item.txt', 'propitem.txt.txt']);
      for (const m of FRE.Workspace.MODULES) m.editable.forEach(n => shown.add(n.toLowerCase()));
      for (const lower of shown) {
        const f = ws.files.get(lower);
        if (!f) continue;
        const cls = f.readOnly ? 'ro' : f.dirty ? 'ok.dirty' : 'ok';
        fs.appendChild(h('span.file-chip.' + cls, { title: f.readOnly ? f.readOnlyReasons.join('\n') : `${f.kind}, ${fmt(f.bytes.length)} bytes` }, f.name + (f.dirty ? ' •' : '')));
      }
      const nd = FRE.DEFINE_FILES.filter(n => ws.files.has(n.toLowerCase())).length;
      fs.appendChild(h('span.file-chip.' + (nd === FRE.DEFINE_FILES.length ? 'ok' : 'missing'), { title: ws.defines.missing.join(', ') || 'all define headers found' }, `defines ${nd}/${FRE.DEFINE_FILES.length}`));
      const nb = ws.newBlocking().length;
      const nw = ws.diags.filter(d => d.severity === 'WARN').length;
      const b = $('btn-diag');
      b.textContent = nb ? `⛔ ${nb}  ⚠ ${nw}` : `⚠ ${nw}`;
      b.className = 'diag-badge' + (nb ? ' has-block' : nw ? ' has-warn' : '');
    }
  }

  function renderBanners() {
    const el = $('banners'); el.textContent = '';
    const add = (cls, ...c) => el.appendChild(h('div.banner.' + cls, ...c));
    if (!FRE.fsa.supported()) add('bad', 'This browser cannot open folders (File System Access API). Use Chrome or Edge (in Brave: enable brave://flags/#file-system-access-api).');
    if (!S.ws) return;
    const ws = S.ws;
    if (ws.missing.length) add('bad', `Missing files: ${ws.missing.join(', ')}`);
    for (const f of ws.files.values()) if (f.readOnly) add('bad', `🔒 ${f.name} is READ-ONLY: ${f.readOnlyReasons.join('; ')}`);
    if (ws.items.stopped) add('bad', `Spec_Item.txt: the server stops loading items at offset ${ws.items.stopped.start}; later items are missing.`);
    if (S.resDir && S.resDir.name.toLowerCase() !== 'resource') add('info', `Editing folder "${S.resDir.name}" (a test copy?).`);
    const mod = FRE.Workspace.MODULES.find(m => m.id === S.mode);
    add('info', `Only Server/Resource is edited. The game client reads its own copy of ${mod ? mod.client.join(', ') : 'these files'}: after saving, copy the changed files to Client/ too. Restart the WorldServer to apply.`);
  }

  function renderList() {
    const el = $('list'); el.textContent = '';
    const extra = $('list-extra'); extra.textContent = '';
    if (!S.ws || !S.ws.available[S.mode].ok) return;
    const m = active();
    $('list-search').placeholder = m.searchPlaceholder || 'Search';
    if (m.listExtra) { const x = m.listExtra(ctx); if (x) extra.appendChild(x); }
    m.renderList(el, ctx);
  }

  function renderEditor() {
    const el = $('editor');
    if (!S.ws) return;
    el.className = ''; el.textContent = '';
    if (!S.ws.available[S.mode].ok) { el.appendChild(h('p.empty-state', `Not available: missing ${S.ws.available[S.mode].missing.join(', ')}`)); return; }
    active().renderEditor(el, ctx);
  }

  // ------------------------------------------------------------------ item database
  function buildItems() {
    S.items = [...S.ws.items.items.values()].map(it => S.ws.itemInfo(it)).sort((a, b) => a.name.localeCompare(b.name));
  }

  function renderItemFilters() {
    if (!S.ws) return;
    const D = S.ws.defines;
    const ik1 = $('item-ik1'), ik3 = $('item-ik3');
    const k1 = [...new Set(S.items.map(i => i.ik1))].sort((a, b) => a - b);
    ik1.textContent = '';
    ik1.appendChild(h('option', { value: '' }, 'All categories'));
    k1.forEach(v => ik1.appendChild(h('option', { value: v, selected: String(v) === S.ik1 }, (D.byValue('IK1_', v) || String(v)).replace(/^IK1_/, ''))));
    const k3 = [...new Set(S.items.filter(i => S.ik1 === '' || String(i.ik1) === S.ik1).map(i => i.ik3))].sort((a, b) => a - b);
    ik3.textContent = '';
    ik3.appendChild(h('option', { value: '' }, 'All types'));
    k3.forEach(v => ik3.appendChild(h('option', { value: v, selected: String(v) === S.ik3 }, (D.byValue('IK3_', v) || String(v)).replace(/^IK3_/, ''))));
  }

  function applyItemFilter() {
    const q = S.itemQuery.toLowerCase();
    S.filtered = S.items.filter(i =>
      (!q || i.name.toLowerCase().includes(q) || i.define.toLowerCase().includes(q)) &&
      (S.ik1 === '' || String(i.ik1) === S.ik1) &&
      (S.ik3 === '' || String(i.ik3) === S.ik3) &&
      (!S.rarity.size || S.rarity.has(i.rarity)));
  }

  function renderItems() {
    if (!S.ws) return;
    applyItemFilter();
    $('item-spacer').style.height = S.filtered.length * ROW_H + 'px';
    $('item-count').textContent = `${fmt(S.filtered.length)} of ${fmt(S.items.length)} items`;
    const target = S.ws.available[S.mode].ok ? active().addTarget(ctx) : { ok: false, title: '' };
    $('new-price-row').hidden = !(target.ok && target.usesPrice);
    paintItems();
  }

  function addFromDb(info) {
    const target = active().addTarget(ctx);
    if (!target.ok) { toast(target.title, 'bad'); return; }
    let cost = null;
    if (target.usesPrice) {
      const parsed = FRE.num.parseAmount($('new-price').value);
      if (!parsed.ok) { toast('Price for new items: ' + parsed.error, 'bad'); return; }
      cost = parsed.value;
    }
    target.add(info, cost);
  }

  function paintItems() {
    const list = $('item-list');
    [...list.querySelectorAll('.item')].forEach(n => n.remove());
    const target = S.ws.available[S.mode].ok ? active().addTarget(ctx) : { ok: false, title: '' };
    const from = Math.max(0, Math.floor(list.scrollTop / ROW_H) - 5);
    const to = Math.min(S.filtered.length, from + Math.ceil(list.clientHeight / ROW_H) + 10);
    const frag = document.createDocumentFragment();
    for (let i = from; i < to; i++) {
      const it = S.filtered[i];
      const atk = it.atkMax > 0 ? `${it.atkMin}–${it.atkMax}` : '';
      frag.appendChild(h('div.item', { style: `top:${i * ROW_H}px` },
        h('div.nm', { title: `${it.name}\n${it.define} (${it.id})\nprice ${fmt(it.cost)} Penya · chip price ${it.chipCost > 0 ? fmt(it.chipCost) : 'none'}` }, h('span.r-' + it.rarity, it.name), h('span.def', it.define)),
        h('div.ty', { title: it.ik3Name || '' }, (it.ik3Name || '').replace(/^IK3_/, '')),
        h('div.num', it.level > 0 ? it.level : ''),
        h('div.num', atk),
        h('button', { disabled: !target.ok, title: target.title, on: { click: () => addFromDb(it) } }, '+')));
    }
    list.appendChild(frag);
  }

  // ------------------------------------------------------------------ problems panel
  function renderDiagPanel() {
    const el = $('diag-panel');
    el.hidden = !S.diagOpen;
    if (!S.diagOpen || !S.ws) return;
    el.textContent = '';
    const fresh = new Set(S.ws.newBlocking());
    const rank = d => fresh.has(d) ? 0 : d.severity === 'BLOCK' ? 1 : d.severity === 'WARN' ? 2 : 3;
    const list = [...S.ws.diags].sort((a, b) => rank(a) - rank(b));
    el.appendChild(h('div.pad.muted.small', `${list.length} problem(s). Blocking problems introduced by your edits (⛔ new) prevent saving; problems that were already in the files are shown for information.`));
    for (const d of list) {
      const f = S.ws.files.get((d.file || '').toLowerCase());
      el.appendChild(diagRow(d, { isNew: fresh.has(d), where: f && d.start !== undefined ? `${d.file}:${f.lineOf(d.start) + 1}` : d.file || '',
        on: { click: () => locate(d) } }));
    }
  }

  function locate(d) {
    const dm = S.ws.moduleOfFile(d.file || '');
    const m = dm && modules().find(x => x.id === dm.id);
    if (!m || !m.locate || !m.locate(d, ctx)) return;
    S.mode = m.id;
    renderAll(false);
  }

  // ------------------------------------------------------------------ save
  function renderDiff(f) {
    const a = FRE.diff.splitKeepEol(f.originalText), b = FRE.diff.splitKeepEol(f.text);
    const hs = FRE.diff.hunks(FRE.diff.diffLines(a, b), 2);
    const box = h('div.diff');
    const strip = s => f.display(s).replace(/\r\n$|\r$|\n$/, '');
    hs.forEach((hk, i) => {
      if (i > 0) box.appendChild(h('div.gap', '⋯'));
      for (const op of hk.ops) {
        if (op.type === 'eq') box.appendChild(h('div.ctx', `${String(op.b + 1).padStart(6)}   ${strip(b[op.b])}`));
        else if (op.type === 'del') box.appendChild(h('div.del', `${String(op.a + 1).padStart(6)} - ${strip(a[op.a])}`));
        else box.appendChild(h('div.add', `${String(op.b + 1).padStart(6)} + ${strip(b[op.b])}`));
      }
    });
    return box;
  }
  FRE.ui.renderDiff = renderDiff;

  async function onSave() {
    const ws = S.ws;
    if (!ws || !ws.dirtyFiles().length) return;
    const nb = ws.newBlocking();
    if (nb.length) {
      modal({ title: '⛔ Cannot save: your edits introduced blocking problems', body: h('div', nb.map(d => diagRow(d))) });
      return;
    }
    if (!S.backupDir) {
      const ok = await new Promise(res => modal({ title: 'Choose a backup folder first',
        body: h('p', 'Every save first copies the current files into a timestamped folder. Pick a folder outside Server/Resource, e.g. FLYFF-RESOURCE-EDITOR/backups.'),
        buttons: [{ label: 'Cancel', onClick: () => res(false) }, { label: 'Choose folder…', cls: 'primary', onClick: async () => res(await pickBackup()) }] }));
      if (!ok) return;
    }
    if (!(await FRE.fsa.ensurePermission(S.resDir)) || !(await FRE.fsa.ensurePermission(S.backupDir))) { toast('Write permission was not granted.', 'bad'); return; }

    const dirty = ws.dirtyFiles();
    const warns = ws.diags.filter(d => d.severity === 'WARN');
    const client = ws.clientCopiesNeeded();
    const body = h('div',
      h('p', `These lines will change. Everything else in the file${dirty.length > 1 ? 's' : ''} stays byte-for-byte identical.`),
      dirty.map(f => [h('h3', `${f.name}`), renderDiff(f)]),
      warns.length ? h('p.muted', `${warns.length} warning(s) (not blocking) — see the problems panel.`) : null,
      h('p.muted.small', `Backup folder: ${S.backupDir.name}/<timestamp>/` + (client.length ? ` · After saving, also copy to Client/: ${client.join(', ')}` : '')));
    modal({ title: `Review changes (${dirty.length} file${dirty.length > 1 ? 's' : ''})`, body, wide: true, buttons: [
      { label: 'Cancel' },
      { label: `Back up and write ${dirty.length} file${dirty.length > 1 ? 's' : ''}`, cls: 'primary', onClick: runSave },
    ] });
  }

  async function runSave() {
    const log = h('div.log');
    const client = S.ws.clientCopiesNeeded();
    const m = modal({ title: 'Saving…', body: log, buttons: [{ label: 'Close' }] });
    const report = await FRE.save.save(S.ws, S.backupDir, msg => log.appendChild(document.createTextNode(msg + '\n')))
      .catch(e => ({ ok: false, steps: [String(e && e.message || e)] }));
    if (!report.ok) log.appendChild(h('div', { style: 'color:var(--bad)' }, '\nNot saved: ' + (report.steps[report.steps.length - 1] || '')));
    else {
      S.edited.clear();
      if (client.length) log.appendChild(h('div', { style: 'color:var(--warn)' }, `\nNow copy to Client/: ${client.join(', ')}`));
      toast('Saved. Copy changed files to Client/ and restart the WorldServer.', 'ok');
    }
    m.el.querySelector('header').textContent = report.ok ? 'Saved' : 'Save failed';
    renderAll(false);
  }

  async function onBackup() {
    if (!S.ws) return;
    if (!S.backupDir && !(await pickBackup())) return;
    if (!(await FRE.fsa.ensurePermission(S.backupDir))) return;
    try { const name = await FRE.save.snapshot(S.ws, S.backupDir); toast(`Snapshot written: ${S.backupDir.name}/${name}`, 'ok'); }
    catch (e) { toast('Backup failed: ' + e.message, 'bad'); }
  }

  // ------------------------------------------------------------------ init
  async function init() {
    $('version').textContent = FRE.BUILD_INFO || 'dev';
    $('btn-load').onclick = pickResource;
    $('btn-backup-dir').onclick = pickBackup;
    $('btn-save').onclick = onSave;
    $('btn-backup').onclick = onBackup;
    $('btn-undo').onclick = undo;
    $('btn-redo').onclick = redo;
    $('btn-diag').onclick = () => { S.diagOpen = !S.diagOpen; renderDiagPanel(); };
    $('list-search').oninput = e => { S.queries[S.mode] = e.target.value; renderList(); };
    $('item-search').oninput = e => { S.itemQuery = e.target.value; $('item-list').scrollTop = 0; renderItems(); };
    $('item-ik1').onchange = e => { S.ik1 = e.target.value; S.ik3 = ''; renderItemFilters(); renderItems(); };
    $('item-ik3').onchange = e => { S.ik3 = e.target.value; renderItems(); };
    $('item-list').addEventListener('scroll', () => requestAnimationFrame(paintItems));
    window.addEventListener('resize', () => S.ws && paintItems());
    for (const b of document.querySelectorAll('#rarity-chips .chip')) {
      b.onclick = () => { const r = b.dataset.r; S.rarity.has(r) ? S.rarity.delete(r) : S.rarity.add(r); b.classList.toggle('on'); renderItems(); };
    }
    document.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || e.target.tagName === 'INPUT') return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
      else if (k === 's') { e.preventDefault(); onSave(); }
    });
    window.addEventListener('beforeunload', e => { if (S.ws && S.ws.dirtyFiles().length) { e.preventDefault(); e.returnValue = ''; } });
    renderModes();
    renderBanners();
    if (!FRE.fsa.supported()) { $('btn-load').disabled = true; return; }
    const last = await FRE.fsa.recall('resource');
    if (last) {
      const btn = $('btn-reopen');
      btn.hidden = false; btn.textContent = `Reopen "${last.name}"`;
      btn.onclick = async () => { try { await loadFrom(last); btn.hidden = true; } catch (e) { toast(e.message, 'bad'); } };
    }
    const bk = await FRE.fsa.recall('backup');
    if (bk && (await FRE.fsa.ensurePermission(bk, false))) { S.backupDir = bk; renderToolbar(); }
    else if (bk) { $('backup-name').textContent = `${bk.name} (click to re-allow)`; $('btn-backup-dir').onclick = async () => { if (await FRE.fsa.ensurePermission(bk)) { S.backupDir = bk; $('btn-backup-dir').onclick = pickBackup; renderToolbar(); } else pickBackup(); }; }
  }

  FRE.app = { init, state: S, ctx, setMode };
  if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', init);
})(globalThis.FRE = globalThis.FRE || {});

</script>
</body>
</html>
