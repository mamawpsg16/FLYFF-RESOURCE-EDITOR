<style>
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --bg: #0f1218;
  --panel: #161b24;
  --panel-2: #1c2330;
  --line: #2a3342;
  --text: #dde3ee;
  --muted: #8a96aa;
  --accent: #4f8cff;
  --accent-2: #2f6be0;
  --ok: #3ccf8e;
  --warn: #f2b84b;
  --bad: #ff5d5d;
  --add: #16391f;
  --del: #43191b;
  --normal: #c9d1de;
  --unique: #f2b84b;
  --ultimate: #c77dff;
  --baruna: #4fd1e8;
  --radius: 6px;
  font-size: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; overflow: clip; }   /* clip: focus/scrollIntoView can't shift the page either */
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 11px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent-2); border-color: var(--accent); }
button.danger { background: #5a1d22; border-color: var(--bad); }
button.icon { padding: 2px 8px; }
input, select { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 8px; min-width: 0; }
input:focus, select:focus { outline: 1px solid var(--accent); }
code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 6px 10px; }
.row { display: flex; gap: 6px; align-items: center; }
.row > * { flex: 1; }
.check { display: flex; gap: 4px; align-items: center; white-space: nowrap; color: var(--muted); font-size: 12px; }

#toolbar { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.version { margin-left: auto; font-size: 12px; white-space: nowrap; }
.tb-group { display: flex; gap: 6px; }
.tb-files { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.file-chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.file-chip.ok::before { content: "✓ "; color: var(--ok); }
.file-chip.missing::before { content: "✗ "; color: var(--bad); }
.file-chip.ro::before { content: "🔒 "; }
.file-chip.dirty { border-color: var(--warn); }
.diag-badge { border-radius: 12px; min-width: 40px; }
.diag-badge.has-warn { border-color: var(--warn); color: var(--warn); }
.diag-badge.has-block { border-color: var(--bad); color: var(--bad); background: #3a1518; }

#banners .banner { padding: 7px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.banner.info { background: #14243f; }
.banner.warn { background: #3a2e12; }
.banner.bad { background: #3a1518; }

#layout { flex: 1; display: grid; grid-template-columns: 270px 1fr 430px; grid-template-rows: minmax(0, 1fr); min-height: 0; overflow: hidden; overflow: clip; }   /* the row must not grow past the window */
aside, section { min-height: 0; display: flex; flex-direction: column; }
#left { border-right: 1px solid var(--line); background: var(--panel); }
#right { border-left: 1px solid var(--line); background: var(--panel); }
#center { overflow: hidden; overflow: clip; }
.panel-head { padding: 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
.panel-head.col { flex-direction: column; align-items: stretch; }
.panel-head input[type=search] { flex: 1; }
.list { overflow-y: auto; flex: 1; min-height: 0; }

.npc { padding: 7px 12px; border-bottom: 1px solid #1f2633; cursor: pointer; }
.npc:hover { background: var(--panel-2); }
.npc.sel { background: #1d2c47; border-left: 3px solid var(--accent); padding-left: 9px; }
.npc .n { display: flex; justify-content: space-between; gap: 6px; }
.npc .k { font-size: 11px; color: var(--muted); }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.chip { color: var(--bad); border-color: #6b2b2b; }
.tag.edit { color: var(--warn); border-color: #6b5520; }
.tag.warn { color: var(--warn); }
.tag.bad { color: var(--bad); }

#editor { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 64px; }   /* min-height 0: scroll instead of growing past the window */
.empty-state { text-align: center; padding-top: 12vh !important; color: var(--text); }
.npc-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.npc-title h2 { margin: 0; font-size: 20px; }
.tabs { display: flex; gap: 4px; margin: 14px 0 10px; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; background: transparent; }
.tabs button.sel { background: var(--panel-2); border-color: var(--accent); }
.tabs .count { color: var(--muted); font-size: 11px; margin-left: 4px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 18px 0 6px; }
table { width: 100%; border-collapse: collapse; }
td, th { padding: 5px 8px; border-bottom: 1px solid #1f2633; text-align: left; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input[type=number], td input.num-input { width: 130px; text-align: right; font-variant-numeric: tabular-nums; }
td select { width: 70px; }
tr.changed td:first-child { box-shadow: inset 3px 0 var(--warn); }
.def { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
.line { font-size: 11px; color: var(--muted); }
.r-normal { color: var(--normal); } .r-unique { color: var(--unique); } .r-ultimate { color: var(--ultimate); } .r-baruna { color: var(--baruna); }

#diag-panel { max-height: 38%; overflow-y: auto; border-top: 1px solid var(--line); background: var(--panel); }
.diag { padding: 6px 14px; border-bottom: 1px solid #1f2633; font-size: 13px; cursor: pointer; display: flex; gap: 8px; }
.diag:hover { background: var(--panel-2); }
.diag .sev { font-weight: 600; min-width: 46px; }
.diag .sev.BLOCK { color: var(--bad); } .diag .sev.WARN { color: var(--warn); } .diag .sev.INFO { color: var(--muted); }
.diag .new { color: var(--bad); font-size: 11px; }

.chips { flex-wrap: wrap; }
.chip { flex: 0 0 auto !important; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
.chip[data-r=normal].on { border-color: var(--normal); color: var(--normal); }
.chip[data-r=unique].on { border-color: var(--unique); color: var(--unique); }
.chip[data-r=ultimate].on { border-color: var(--ultimate); color: var(--ultimate); }
.chip[data-r=baruna].on { border-color: var(--baruna); color: var(--baruna); }
.chip.on { background: #222b3a; }
.item-head, .item { display: grid; grid-template-columns: 1fr 92px 34px 74px 34px; gap: 6px; align-items: center; padding: 0 10px; }
.item-head { font-size: 11px; color: var(--muted); padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.virtual { position: relative; }
.item { position: absolute; left: 0; right: 0; height: 40px; border-bottom: 1px solid #1f2633; font-size: 13px; }
.item:hover { background: var(--panel-2); }
.item .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.15; }
.item .nm .def { display: block; overflow: hidden; text-overflow: ellipsis; }
.item .ty { font-size: 11px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.item .num { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.item button { padding: 0 8px; font-weight: 700; }

.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(980px, 92vw); max-height: 88vh; display: flex; flex-direction: column; }
.modal header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
.modal .body { padding: 12px 16px; overflow-y: auto; flex: 1; }
.modal footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

  const J = { RING: 'Rings', EARRING: 'Earrings', NECKLACE: 'Necklaces' };
  const R = { BOARD: 'Boards', STICK: 'Brooms', MOUNT: 'Mounts', WING: 'Wings', CAR: 'Cars', ACCEL: 'Fuel' };
  const GROUPS = ['Weapons', 'Armor', 'Fashion', 'Jewelry', 'Pets', 'Rides', 'Food & potions', 'Buffs', 'Scrolls', 'Upgrade materials',
    'Boxes & tickets', 'Teleport', 'Housing', 'Quest & event', 'System', 'Other'];

    if (k2 === 'JEWELRY') return c('Jewelry', J[k3] || pretty(k3));

    if (k3 === 'PET') return c('Pets', info.referStat1 === vis ? 'Buff pets' : 'Pickup pets');
    if (k3 === 'VIS') return c('Pets', 'Buff pet beads (Vis)');
    if (k3 === 'FEED') return c('Pets', 'Pet food');
    if (/PET_RANDOMOPTION|^SYSTEMPET_|^EATPET_/.test(k3)) return c('Pets', 'Pet scrolls');
    if (k3 === 'SUMMON_NPC') return c('Pets', 'Upgrade spirits');

  function stockedPlayer(env, set, { times = 1, free = 10, unlocked = MAX_INVENTORY_FREE, gold = 0 } = {}) {
    const items = [];
    let g = gold;
    for (const c of set.cond) {
      const need = Math.max(0, c.num) * times;
      if (c.id === env.gold) { g += need; continue; }
      const pr = env.prop(c.id);

  //   taken: Map define -> { id, num, penya }

// The text of a rules window (Client/Client/NpcBoard_<menu id>.inc, the npc-board client change in
// docs/patches/npc-board.diff), read the way the game shows it: CWndGuildCombatBoard::SetString ->
// CEditString::AddParsingString (_Common/EditString.cpp:632) -> ParsingString (EditString.cpp:441),
// with its defaults (EditString.h:155): white (0xffffffff), no style, PS_USE_MACRO on; __ITEMLINK is on
// in Neuz (Neuz/VersionCommon.h:36).
//   #cAARRGGBB  colour; each of the 8 characters is read as hex with c >= 'a' ? c - 'a' + 10 : c - '0',
//               so ONLY lowercase hex works (an uppercase 'F' gives 22, garbling the colour)
//   #b #u #s    bold / underline / strike on;  #nb #nu #ns off;  #nc back to white;  #l<4> / #nl code page
//   #i<7><4>    item link ids (skipped, nothing shown)
//   #<other>    '#' and the character are shown as they are;  a '#' at the very end is dropped
//   \n          (backslash n, two characters) a new line; a real line break is kept as it is
// Returns pieces [{ text, color, bold, underline, strike }] (adjacent characters with one style merged).

  'use strict';
  const BOLD = 2, UNDER = 1, STRIKE = 4;
  const WHITE = 0xffffffff;

  // for( j = 7; j >= 0; j-- ) { cVal = szColor[j]; cVal = cVal >= 'a' ? cVal - 'a' + 10 : cVal - '0';
  //   dwlNumber |= (DWORDLONG)cVal << dwMulCnt; dwMulCnt += 4; }  -- CHAR is signed (MSVC), so a wrong
  // character can spill into other nibbles; the low 32 bits are the colour.
  const s8 = v => ((v & 0xff) ^ 0x80) - 0x80;
  function hexColor(s) {
    let v = 0n, shift = 0n;
    for (let j = 7; j >= 0; j--) {
      const c = s8(s.charCodeAt(j) || 0);
      const val = s8(c >= 97 ? c - 97 + 10 : c - 48);
      v |= BigInt.asUintN(64, BigInt(val)) << shift;
      shift += 4n;
    }
    return Number(v & 0xffffffffn);
  }

  function parse(src) {
    const chars = [];                                      // [ch, color, style]
    let color = WHITE, style = 0;
    const n = src.length;
    for (let i = 0; i < n; i++) {
      const ch = src[i];
      if (ch === '#') {
        if (++i >= n) break;
        switch (src[i]) {
          case 'c':
            if (++i >= n) break;
            color = colorAt(src, i);
            i += 7;
            break;
          case 'u': style |= UNDER; break;
          case 'b': style |= BOLD; break;
          case 's': style |= STRIKE; break;
          case 'l': if (++i >= n) break; i += 3; break;     // code page: not drawn differently here
          case 'i': if (++i >= n) break; i += 7; i += 3; break;
          case 'n':
            if (++i >= n) break;
            switch (src[i]) {
              case 'c': color = WHITE; break;
              case 'b': style &= ~BOLD; break;
              case 'u': style &= ~UNDER; break;
              case 's': style &= ~STRIKE; break;
              default: break;
            }
            break;
          default:
            chars.push(['#', color, style], [src[i], color, style]);
        }
      } else if (ch === '\\' && src[i + 1] === 'n') {
        chars.push(['\n', color, style]);
        i += 1;
      } else chars.push([ch, color, style]);
    }
    const out = [];
    for (const [ch, c, s] of chars) {
      const last = out[out.length - 1];
      if (last && last.color === c && last.style === s) last.text += ch;
      else out.push({ text: ch, color: c, style: s });
    }
    return out.map(p => ({ text: p.text, color: p.color, bold: !!(p.style & BOLD), underline: !!(p.style & UNDER), strike: !!(p.style & STRIKE) }));

// ---- validate/character.js ----
// Validation rules for character*.inc (docs/DESIGN.md §3.2).
// Every diagnostic gets a stable `key` (no offsets) so the save step can tell
// pre-existing problems from ones introduced by an edit.
(function (FRE) {
  'use strict';
  const { shopEntry } = FRE.character;
  const MAX_TAB = 4;                 // MAX_VENDOR_INVENTORY_TAB
  const MAX_TAB_ITEMS = 100;         // MAX_VENDOR_INVENTORY

  const ARG_CMDS = new Set(['AddShopItem', 'AddVendorItem', 'AddVenderItem', 'AddVendorItem2', 'AddVenderItem2',
    'AddVendorItemLang', 'AddVendorSlot', 'AddVenderSlot', 'AddVendorSlotLang', 'SetVenderType', 'AddMenu', 'AddMenuLang', 'SetBuffSkill']);

  function validateCharacters(chars, ctx) {
    const out = [];
    const add = (d) => out.push(d);
    const items = ctx.items;          // Map id -> item (Spec_Item)
    const defs = ctx.defines;

    // lexer-level diagnostics (undefined names, unterminated strings, ...)
    for (const d of chars.diags) {
      add(Object.assign({}, d, { key: `${d.code}|${d.file}|${d.name || d.message}` }));
    }

    // duplicate NPC keys (case-insensitive, shared by the 3 files)
    for (const [lk, list] of chars.byKey) {
      if (list.length > 1) {
        for (const npc of list.slice(1)) {
          add({ code: 'C_DUP_NPC', severity: 'BLOCK', file: npc.file, start: npc.start, end: npc.keyEnd, npcKey: npc.key,
            key: `C_DUP_NPC|${lk}`, message: `NPC "${npc.key}" is defined ${list.length} times (${list.map(n => n.file).join(', ')}): the last one replaces the others` });
        }
      }
    }

    const tradeMenu = defs.get('MMI_TRADE');
    const priceByItem = new Map();    // item id -> [{npc, cost}]

    for (const npc of chars.npcs) {
      const at = { file: npc.file, npcKey: npc.key };
      if (!npc.closed) {
        add(Object.assign({ code: 'C_BRACES', severity: 'BLOCK', start: npc.start, end: npc.end, key: `C_BRACES|${npc.file}|${npc.key}`,
          message: `${npc.key}: its block never closes (the server reads to the end of the file)` }, at));
      }
      if (npc.missingBrace) {
        add(Object.assign({ code: 'C_NO_OPEN_BRACE', severity: 'WARN', start: npc.braceTok.start, end: npc.braceTok.end, key: `C_NO_OPEN_BRACE|${npc.file}|${npc.key}`,
          message: `${npc.key}: no "{" after the name; the server silently uses "${npc.braceTok.text}" as the brace (works by accident)` }, at));
      }
      let shopCount = 0;
      for (const rec of npc.statements) {
        if (rec.hang) {
          add(Object.assign({ code: 'C_HANG', severity: 'BLOCK', start: rec.start, end: rec.end, key: `C_HANG|${npc.file}|${npc.key}|${rec.cmd}`,
            message: `${npc.key}: ${rec.cmd} is never closed, the server would hang at startup` }, at));
        }
        if (ARG_CMDS.has(rec.cmd)) {
          for (const s of rec.seps) {
            // the trailing ';' read by GetLangScript / SetLang is optional in practice
            if (s.expect !== ';' && !s.expect.split(' or ').includes(s.got)) {
              add(Object.assign({ code: 'C_ARGS', severity: 'BLOCK', start: rec.start, end: rec.end,
                key: `C_ARGS|${npc.file}|${npc.key}|${rec.cmd}|${s.expect}|${s.got}`,
                message: `${npc.key}: ${rec.cmd} expected "${s.expect}" but found "${s.got}"; the server skips it blindly and the arguments shift` }, at));
              break;
            }
          }
        }
        const slotArg = rec.args.slot;
        if (slotArg && (slotArg.value < 0 || slotArg.value >= MAX_TAB)) {
          add(Object.assign({ code: 'C_SLOT', severity: 'BLOCK', start: rec.start, end: rec.end,
            key: `C_SLOT|${npc.file}|${npc.key}|${rec.cmd}|${slotArg.value}`,
            message: `${npc.key}: ${rec.cmd} uses tab ${slotArg.value}; only 0-3 exist and the server does not check (memory corruption)` }, at));
        }
        const e = shopEntry(rec);
        if (!e) continue;
        shopCount++;
        const chipShop = npc.venderType === 1 || npc.venderType === 2;
        if (e.kind === 'generated' && chipShop) {
          const ik3 = e.ik3.define || e.ik3.value;
          add(Object.assign({ code: 'C_RULE_IGNORED', severity: 'INFO', start: rec.start, end: rec.end,
            key: `C_RULE_IGNORED|${npc.file}|${npc.key}|${e.slot}|${ik3}|${e.rareMin.value}-${e.rareMax.value}`,
            message: `${npc.key}: ${rec.cmd}(${e.slot}, ${ik3}, ...) is ignored because this is a chip shop (SetVenderType(${npc.venderType}))` }, at));
        }
        if (e.kind === 'fixed' || e.kind === 'chip') {
          const id = e.item.value >>> 0;
          const itemName = e.item.define || e.item.tokens.map(t => t.raw || t.text).join('');
          const prop = items.get(id);
          if (!prop) {
            add(Object.assign({ code: 'C_ITEM', severity: 'BLOCK', start: rec.start, end: rec.end,
              key: `C_ITEM|${npc.file}|${npc.key}|${itemName}`,
              message: `${npc.key}: ${itemName} is not a loaded item in Spec_Item.txt; the shop silently skips it` }, at));
          }
          if (e.kind === 'fixed' && e.cost) {
            const c = e.cost.value;
            if (c <= 0) add(Object.assign({ code: 'C_PRICE_ZERO', severity: 'WARN', start: rec.start, end: rec.end,
              key: `C_PRICE_ZERO|${npc.file}|${npc.key}|${itemName}`, message: `${npc.key}: ${itemName} costs ${c}` }, at));
            if (!priceByItem.has(id)) priceByItem.set(id, []);
            priceByItem.get(id).push({ npc, cost: c, rec, itemName });
          }
          // Mover.cpp:1723 appends AddShopItem entries in every shop type; DPSrvr.cpp:3516 then
          // charges chips (dwReferValue1) without the "chip cost < 1" check AddVenderItem2 gets.
          if (e.kind === 'fixed' && chipShop) {
            add(Object.assign({ code: 'C_FIXED_IN_CHIP', severity: 'WARN', start: rec.start, end: rec.end,
              key: `C_FIXED_IN_CHIP|${npc.file}|${npc.key}|${itemName}`,
              message: `${npc.key}: AddShopItem in a chip shop: ${itemName} is sold for chips without the server's chip-price check` }, at));
          }
          if (e.kind === 'chip' && !chipShop) {
            add(Object.assign({ code: 'C_CHIP_TYPE', severity: 'WARN', start: rec.start, end: rec.end,
              key: `C_CHIP_TYPE|${npc.file}|${npc.key}|${itemName}`,
              message: `${npc.key}: ${rec.cmd} only works in chip shops (SetVenderType(1) or (2)); the server ignores it here` }, at));
          }
          if (e.kind === 'chip' && prop) {
            const chip = FRE.specItem.get(prop, 'dwReferValue1');
            if (chip === -1 || chip < 1) add(Object.assign({ code: 'C_CHIP_COST', severity: 'WARN', start: rec.start, end: rec.end,
              key: `C_CHIP_COST|${npc.file}|${npc.key}|${itemName}`,
              message: `${npc.key}: ${itemName} has no chip price (dwReferValue1); the server skips it in this chip shop` }, at));
          }
        }
      }
      // What the server really puts in each tab (generated rules + fixed items, 100 max)
      const sim = ctx.simulate ? ctx.simulate(npc) : null;
      if (sim) {
        sim.tabs.forEach((tab, t) => {
          const full = tab.dropped.filter(d => d.reason === 'tab full');
          const overflow = tab.rules.reduce((n, r) => n + Math.max(0, (r.matched || 0) - (r.added || 0)), 0);
          if (full.length || overflow) {
            const names = full.map(d => (d.prop && d.prop.item.define) || d.rec.cmd).slice(0, 5).join(', ');
            add(Object.assign({ code: 'C_TAB_FULL', severity: 'WARN', start: npc.start, end: npc.keyEnd, key: `C_TAB_FULL|${npc.file}|${npc.key}|${t}`,
              message: `${npc.key}: tab ${t + 1} would hold more than ${MAX_TAB_ITEMS} items; ${overflow + full.length} are left out${names ? ' (' + names + (full.length > 5 ? ', …' : '') + ')' : ''}` }, at));
          }
          for (const r of tab.rules) {
            if (!r.empty) continue;
            const ik3 = r.rec.args.ik3.define || r.rec.args.ik3.value;
            add(Object.assign({ code: 'C_RULE_EMPTY', severity: 'INFO', start: r.rec.start, end: r.rec.end,
              key: `C_RULE_EMPTY|${npc.file}|${npc.key}|${t}|${ik3}|${r.rec.args.rareMin.value}-${r.rec.args.rareMax.value}`,
              message: `${npc.key}: ${r.rec.cmd}(${t}, ${ik3}, rarity ${r.rec.args.rareMin.value}-${r.rec.args.rareMax.value}) matches no item; the server logs a VENDORITEM error and adds nothing` }, at));
          }
        });
      }
      // The shop window's tab bar (loaders/shop-window.js: CWndShop::OnInitialUpdate + CWndTabCtrl): only
      // named slots become tabs, at their slot's position. Only NPCs with Trade open the window.
      if (sim && tradeMenu !== undefined && npc.menus.includes(tradeMenu)) {
        const title = s => npc.slotTitles[s];
        const named = [0, 1, 2, 3].filter(s => title(s) !== undefined && title(s) !== '');
        const win = FRE.shopWindow.ofNpc(npc, sim);
        if (named.length && !named.includes(0)) {
          add(Object.assign({ code: 'C_TAB_FIRST_UNNAMED', severity: 'BLOCK', start: npc.start, end: npc.keyEnd, key: `C_TAB_FIRST_UNNAMED|${npc.file}|${npc.key}`,
            message: `${npc.key}: the first tab has no name (no AddVendorSlot( 0, ... )) but tab ${named[0] + 1} has one; clicking a tab in this shop crashes the game client` }, at));
        }
        [0, 1, 2, 3].forEach(s => {
          const n = sim.tabs[s].entries.length;
          if (!n || named.includes(s)) return;
          add(Object.assign({ code: 'C_TAB_UNNAMED_ITEMS', severity: 'WARN', start: npc.start, end: npc.keyEnd, key: `C_TAB_UNNAMED_ITEMS|${npc.file}|${npc.key}|${s}`,
            message: `${npc.key}: tab ${s + 1} sells ${n} item(s) but has no name (no AddVendorSlot( ${s}, ... )): the game shows no such tab, so players never see them` }, at));
        });
        if (named.length && named[named.length - 1] + 1 !== named.length && named.includes(0)) {
          add(Object.assign({ code: 'C_TAB_GAP', severity: 'INFO', start: npc.start, end: npc.keyEnd, key: `C_TAB_GAP|${npc.file}|${npc.key}`,
            message: `${npc.key}: tabs ${win.tabs.map((t, i) => t ? null : i + 1).filter(Boolean).join(', ')} have no name, so the tab bar has an empty space there` }, at));
        }
      }
      if (shopCount && tradeMenu !== undefined && !npc.menus.includes(tradeMenu)) {
        const text = ctx.textOf ? ctx.textOf(npc.file) : '';
        const disabled = /\/\/[ \t]*AddMenu[ \t]*\([ \t]*MMI_TRADE/.test(text.slice(npc.start, npc.end));
        add(Object.assign({ code: 'C_NO_TRADE', severity: 'INFO', start: npc.start, end: npc.keyEnd, key: `C_NO_TRADE|${npc.file}|${npc.key}`,
          message: `${npc.key}: players can't buy here: shop items but no Trade menu (the buy code requires MMI_TRADE)` +
            (disabled ? '. The Trade menu is commented out in this NPC, so it was disabled on purpose.' : '') }, at));
      }
    }

    // What players pay in each Penya shop (vendorSim.buyPrice, a port of OnBuyItem): one dwCost per
    // item, which a later AddShopItem price replaces for every shop (Project.cpp:3581, 6b026003).
    const costs = ctx.costs ? ctx.costs() : null;
    if (costs && ctx.simulate) {
      for (const npc of chars.npcs) {
        if (npc.venderType === 1 || npc.venderType === 2) continue;
        const at = { file: npc.file, npcKey: npc.key };
        ctx.simulate(npc).tabs.forEach((tab, t) => {
          for (const en of tab.entries) {
            const p = en.prop, def = p.item.define || String(p.id);
            const dwCost = FRE.vendorSim.costOf(costs, p);
            if (FRE.vendorSim.buyPrice(p, dwCost, null, defs).min1) {
              add(Object.assign({ code: 'C_PRICE_MIN1', severity: 'WARN', start: en.source.start, end: en.source.end,
                key: `C_PRICE_MIN1|${npc.file}|${npc.key}|${t}|${def}`, itemId: p.id,
                message: (dwCost | 0) >= 1
                  ? `${npc.key}: ${def} costs ${dwCost}, too much for the server's float math (OnBuyItem), so players pay 1 Penya for it in tab ${t + 1}`
                  : `${npc.key}: ${def} has no price (${(dwCost | 0) === -1 ? '"="' : dwCost}), so players pay 1 Penya for it in tab ${t + 1}` }, at));
            }
            const o = costs.get(p.id);
            const setter = o && o.by.length ? o.by[o.by.length - 1] : null;
            if (setter && setter.npc !== npc && !(en.kind === 'fixed' && en.source.args.cost)) {
              add(Object.assign({ code: 'C_PRICE_FROM_OTHER', severity: 'INFO', start: en.source.start, end: en.source.end,
                key: `C_PRICE_FROM_OTHER|${npc.file}|${npc.key}|${t}|${def}|${setter.npc.key}`, itemId: p.id,
                message: `${npc.key}: ${def} costs ${setter.cost} here because ${setter.npc.key}'s AddShopItem sets that price for every shop (Spec_Item.txt says ${o.base})` }, at));
            }
          }
        });
      }
    }

    // One price per item: AddShopItem's cost overwrites the item's price globally.
    for (const [id, list] of priceByItem) {
      const costs = new Set(list.map(x => x.cost));
      if (costs.size > 1) {
        const winner = list[list.length - 1];     // load order: file order, then position
        const desc = list.map(x => `${x.npc.key}=${x.cost}`).join(', ');
        add({ code: 'C_PRICE_CONFLICT', severity: 'WARN', file: winner.npc.file, npcKey: winner.npc.key, start: winner.rec.start, end: winner.rec.end,
          key: `C_PRICE_CONFLICT|${winner.itemName}|${[...costs].sort().join('/')}`, itemId: id,
          message: `${winner.itemName} has different AddShopItem prices (${desc}). The price is global: the last one loaded (${winner.npc.key}, ${winner.cost}) applies everywhere` });
      }
    }
    return out;
  }

  FRE.validateCharacters = validateCharacters;
})(globalThis.FRE = globalThis.FRE || {});

// ---- core/diff.js ----
// Line diff (Myers O(ND)) for the save review dialog.
// Lines are compared including their EOL, so a line-ending change shows up.

// Keeping the game client's own copies in step with Server/Resource.
// The client reads a loose file in Client/ when there is one, otherwise an old
// copy packed in data.res (commit b7645c52, "Client/randomoption.inc loose copy").
// The proven data commits change both copies the same way ("Client copy synced",
// e.g. 93a02124). Client/Spec_Item.txt is LF while the server copy is CRLF, with
// the same content, so a plain byte copy would rewrite every line of it.
//
// The mode of each Client file is decided against the server file AS LOADED, so
// the only difference ever written to Client/ is the editor's own edit:
//   identical  Client bytes == server bytes            -> write the server's new bytes
//   eol        Client text == server text with CRLF->LF -> write the new text as LF
//   missing    no loose copy (client reads data.res)   -> create a byte copy (asked first)

    if (!clientFile) return 'missing';
    if (FRE.bytes.bytesEqual(clientFile.bytes, serverFile.bytes)) return 'identical';
    if (serverFile.kind === FRE.SourceFile.KIND_BINARY) return 'different';   // a .dyo: only identical copies are synced
    if (clientFile.kind === serverFile.kind && serverFile.originalText.includes('\r\n')

    return 'different';

    if (mode === 'eol') return clientFile.encode(toLf(serverFile.text));
    return null;

    identical: 'same as the server copy: gets the same change',
    eol: 'same content with LF line endings: gets the same change, LF kept',
    missing: 'no loose copy: the client reads an old copy in data.res',
    different: 'differs from the server copy: not touched, update it by hand',
  };

  // -> one entry per changed server file the client also reads

    return ws.dirtyFiles().filter(f => names.has(f.name.toLowerCase())).map(f => {
      const c = client.files.get(f.name.toLowerCase()) || null;
      const mode = modeOf(f, c);
      return { name: c ? c.name : f.name, lower: f.name.toLowerCase(), mode, server: f, client: c, bytes: clientBytes(mode, f, c), text: MODE_TEXT[mode] };
    });

  // One exchange menu of this NPC, edited in place with the Exchanges task's cards (ui/exchange.js):
  // works before saving too, since the cards read the live Exchange_Script.txt model.
  function exchangeTab(el, ctx, npc, menu, label) {
    const ws = ctx.ws, xv = FRE.ui.exchangeView;
    const editable = ws.isEditable('exchange_script.txt');
    el.appendChild(h('div.row.ex-tools', { style: 'margin:8px 0' },
      h('span', h('b', label), h('span.def', ' ' + menu.name), h('span.muted', ` · ${Math.min(menu.sets.length, 30)} exchange${menu.sets.length === 1 ? '' : 's'} in the window`)),
      editable && menu.closed && FRE.ui.menuForm ? h('button.small', { title: 'Add exchanges to this menu', on: { click: () => FRE.ui.menuForm.openNewExchanges(ctx, menu) } }, '+ New exchange') : null,
      editable ? null : h('span.tag.bad', 'read-only')));
    // the same menu id on other NPCs: they open the same window, so an edit here changes theirs too
    const others = ((ws.npcInfoByMenu() || new Map()).get(menu.mmi.value) || []).filter(x => x.npc !== npc && x.inGame !== false);
    const otherNames = [...new Set(others.map(x => x.name))];
    if (otherNames.length) el.appendChild(h('p.small.warn.ex-shared', `Also opened by ${otherNames.join(', ')}: they show the same window, so a change here changes theirs too.`));
    el.appendChild(h('p.muted.small', `What players see after right-click ${npc.name || npc.key} → ${label}. Chances are in percent; changing one moves the others so they always add up to 100%. Try it presses OK in the game's exchange window.`));
    if (!menu.sets.length) el.appendChild(h('p.muted', 'No exchange yet: the window opens empty. Press + New exchange.'));
    xv.cards(ctx, menu).forEach(c => el.appendChild(c));
  }

  // "Change position / model" (map-pin icon) next to the name: where it stands and its body (task S part 3)
  const PIN = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="#ea4335" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></svg>';
  function placeButton(ctx, npc) {
    const ws = ctx.ws;
    if (!ws.placed) return null;
    const spots = FRE.npcEditOps.placementsOf(ws, npc);
    if (!spots.length || !spots.every(p => ws.isEditable(p.file))) return null;
    const b = h('button.place-edit', { title: `Move ${npc.name || npc.key} or change its model (its map record, Server + Client)${spots.length > 1 ? `; it stands in ${spots.length} places` : ''}`,
      on: { click: () => FRE.ui.npcEdit.editPlace(ctx, npc) } });
    b.innerHTML = PIN;
    b.appendChild(h('span', 'Change position / model'));
    return b;
  }

  function shopTypeSelect(ctx, npc, canEdit) {
    const cur = FRE.shopOps.shopType(npc.venderType);
    const sel = h('select.shop-type', { disabled: !canEdit, title: 'Which currency this NPC sells for. Changing it converts the item lines (preview first).' },
      // Donate Chips are sold in the Donation Shop window since commit 7d7df4f9 (Adrian's
      // SetVenderType(2) shop was removed), so type 2 is only offered to an NPC that already has it.
      TYPES.filter(t => t.v !== 2 || cur === 2).map(t => h('option', { value: t.v, selected: t.v === cur }, t.label)));
    sel.addEventListener('change', () => {
      const to = Number(sel.value);
      sel.value = String(cur);                    // only changes after confirming
      previewShopType(ctx, npc, to);
    });
    return sel;
  }

  const { chipOf } = FRE.ui.chipPrice;
  const chipPriceParts = (ws, prices) => FRE.ui.chipPrice.parts(ws, prices);
  const hereNpc = npc => u => u.kind === 'npc' && npcId(u.npc) === npcId(npc);
  const confirmShared = (ctx, npc, ids, then) => FRE.ui.chipPrice.confirmShared(ctx, ids, hereNpc(npc), then);

  // Preview of a currency change: each converted item with its new price, then the exact lines.
  function previewShopType(ctx, npc, to) {
    const ws = ctx.ws, f = ws.fileOfNpc(npc);
    const from = FRE.shopOps.shopType(npc.venderType);
    if (to === from) return;
    const itemOf = id => { const it = ws.itemById(id); return it ? ws.itemInfo(it) : null; };
    const plan = FRE.shopOps.shopTypePlan(npc, to, itemOf);
    const label = TYPES[to].label, chips = to === 2 ? 'Donate chips' : 'Red chips';
    const toChips = to !== 0;
    const specOk = ws.isEditable('spec_item.txt');
    const prices = new Map();     // to chips: itemId -> chip price; to Penya: rec.start -> Penya price
    const fresh = () => ws.chars.npcs.find(n => npcId(n) === npcId(npc)) || npc;

    function parts() {
      const now = fresh();
      const out = [{ file: f.name.toLowerCase(), splices: FRE.shopOps.setShopType(f.text, now, to, toChips ? null : prices) }];
      if (toChips) {
        const changed = new Map([...prices].filter(([id, v]) => v !== chipOf(itemOf(id))));
        out.push(...chipPriceParts(ws, changed));
      }
      return out;
    }

    const dropped = new Map(plan.droppedPrices.map(r => [r.rec.start, r.cost]));
    const diffBox = h('div');
    function refreshDiff() {
      diffBox.textContent = '';
      try {
        for (const p of parts()) {
          const sf = ws.files.get(p.file);
          diffBox.appendChild(h('h4', sf.name));
          diffBox.appendChild(FRE.ui.renderDiff(sf, sf.text, sf.preview(p.splices)));
        }
      } catch (e) { diffBox.appendChild(h('p.bad', e.message)); }
    }

    const rows = plan.converted.map(r => {
      const id = r.info ? r.info.id : null;
      const key = toChips ? id : r.rec.start;
      const status = h('span');
      const update = () => {
        const v = prices.has(key) ? prices.get(key) : (toChips ? chipOf(r.info) : null);
        status.textContent = ''; status.className = '';
        if (toChips) {
          if (v === null) { status.className = 'tag warn'; status.textContent = 'no chip price: left out of the shop'; }
        } else if (v === null) {
          if (r.info && r.info.cost > 0) { status.className = 'muted'; status.textContent = `item's own price: ${fmt(r.info.cost)}`; }
          else { status.className = 'tag warn'; status.textContent = 'no price: sells for 1 Penya (DPSrvr.cpp:3404)'; }
        }
      };
      const input = numInput({
        value: toChips ? chipOf(r.info) : null, min: toChips ? 1 : 0,
        placeholder: toChips ? 'no chip price' : (r.info ? `${fmt(r.info.cost)} (item)` : ''),
        disabled: toChips && (!specOk || !r.info),
        title: toChips ? 'Chip price (dwReferValue1 in Spec_Item.txt). One price per item: it also applies in other chip shops and the Donation Shop.'
          : 'Penya price written as AddShopItem( tab, item, price ). Empty = the item\'s own price (dwCost). AddShopItem prices apply server-wide.',
        onCommit: v => { prices.set(key, v); update(); refreshDiff(); },
      });
      update();
      const was = toChips
        ? (dropped.has(r.rec.start) ? `${fmt(dropped.get(r.rec.start))} Penya (removed)` : r.info ? `${fmt(r.info.cost)} Penya (item)` : '')
        : (chipOf(r.info) ? `${fmt(chipOf(r.info))} chips` : 'no chip price');
      return h('tr', itemCell(r.info, r.define), h('td.muted', was), h('td', input), h('td', status));
    });

    const body = h('div',
      h('p', `${npc.name || npc.key} changes from ${TYPES[from].label} to ${label}. You can undo it in one step.`),
      plan.converted.length ? [
        h('p', toChips
          ? `${plan.converted.length} item line(s) become AddVenderItem2, sold for ${chips}. Set each item's chip price below (Spec_Item.txt, shared by every chip shop and the Donation Shop).`
          : `${plan.converted.length} item line(s) become AddShopItem, sold for Penya. Type a price, or leave it empty to use the item's own price.`),
        toChips && !specOk ? h('p.bad', 'Spec_Item.txt is not editable, so chip prices cannot be changed here.') : null,
        toChips && plan.droppedPrices.length ? h('p.muted', 'Removed AddShopItem prices also stop overriding the item\'s Penya price server-wide.') : null,
        h('table.items', h('tr', h('th', 'Item'), h('th', 'Before'), h('th.num', toChips ? `Price (${chips})` : 'Price (Penya)'), h('th', '')), rows),
      ] : null,
      plan.rulesIgnored ? h('p.muted', `${plan.rulesIgnored} AddVendorItem rule(s) stay in the file but are ignored in chip shops.`) : null,
      plan.rulesUsedAgain ? h('p.muted', `${plan.rulesUsedAgain} AddVendorItem rule(s) fill the tabs again.`) : null,
      h('h3', 'Lines that change'), diffBox);
    refreshDiff();
    FRE.dom.modal({ title: `Make ${npc.name || npc.key} a ${label}?`, body, wide: true, buttons: [
      { label: 'Cancel' },
      { label: `Make it a ${label}`, cls: 'primary', onClick: () => {
        const changedIds = toChips ? [...prices].filter(([id, v]) => v !== chipOf(itemOf(id))).map(([id]) => id) : [];
        confirmShared(ctx, npc, changedIds, () => ctx.editGroup(parts, `shop type: ${label}`, ['npc|' + npcId(npc)]));
      } },
    ] });
  }
  FRE.ui.previewShopType = previewShopType;

  const mod = {
    id: 'npc', label: 'NPC Shops', searchPlaceholder: 'Search NPCs',
    help: 'NPC Shops: what each NPC sells (character.inc, character-etc.inc, character-school.inc), its currency and prices',
    st, npcId,

    onLoad(ctx) {
      listWs = ctx.ws;
      const first = ctx.ws.chars.npcs.find(showTest()) || ctx.ws.chars.npcs.find(isShopNpc);
      st.sel = first ? npcId(first) : null; st.tab = first ? firstTab(ctx.ws, first) : 0;
    },

    isListed: npc => showTest()(npc),

    listAction(ctx) {
      const canAdd = ctx.ws && ctx.ws.isEditable('character.inc') && ctx.ws.isEditable('character.txt.txt') && ctx.ws.mapFiles.size;
      return h('button.primary', { disabled: !canAdd,
        title: canAdd ? 'Create a new NPC: place it on a map, pick its menus and shop' : 'Needs character.inc, character.txt.txt and the World/ map files (editable)',
        on: { click: () => FRE.ui.newNpc.open(ctx) } }, '+ NPC');
    },

    listExtra(ctx) {
      listWs = ctx.ws;
      const npcs = ctx.ws ? ctx.ws.chars.npcs : [];
      return h('select.npc-filter', { title: 'Which NPCs to list. Hand-picked items: a shop where at least one item was added one by one (with a price you can set), not only every item of a type (auto)', on: { change: e => { st.show = e.target.value; ctx.renderList(); } } },
        SHOW.map(o => ({ o, n: npcs.filter(o.test).length }))
          .filter(x => x.n > 0 || x.o.v === st.show)            // e.g. no Donate Chip NPC since 7d7df4f9: option hidden
          .map(({ o, n }) => h('option', { value: o.v, selected: o.v === st.show }, `${o.label} (${n})`)));
    },

    renderList(el, ctx) {
      listWs = ctx.ws;
      const q = ctx.query.toLowerCase();
      const diagBy = new Map();
      for (const d of ctx.ws.diags) if (d.npcKey && d.severity !== 'INFO') {
        const k = `${d.file}|${d.npcKey}`; const o = diagBy.get(k) || { w: 0, b: 0 };
        if (d.severity === 'BLOCK') o.b++; else o.w++;
        diagBy.set(k, o);
      }
      let shown = 0;
      const test = showTest();
      for (const npc of ctx.ws.chars.npcs) {
        if (!test(npc)) continue;
        const label = npc.name || npc.key;
        if (q && !label.toLowerCase().includes(q) && !npc.key.toLowerCase().includes(q)) continue;
        const id = npcId(npc), dg = diagBy.get(id);
        shown++;
        el.appendChild(h('div.npc' + (id === st.sel ? '.sel' : ''), { on: { click: () => { st.sel = id; st.tab = firstTab(ctx.ws, npc); if (FRE.ui.exchangeView) FRE.ui.exchangeView.clearPick(); ctx.renderAll(false); } } },
          h('div.n', h('span', label),
            h('span', npc.venderType === 1 ? h('span.tag.chip', 'Red Chip') : npc.venderType === 2 ? h('span.tag.chip', 'Donate') : null,
              ctx.edited.has('npc|' + id) || exMenusOf(ctx.ws, npc).some(m => ctx.edited.has('ex|' + m)) ? h('span.tag.edit', 'edited') : null,
              dg && dg.b ? h('span.tag.bad', '⛔' + dg.b) : dg && dg.w ? h('span.tag.warn', '⚠' + dg.w) : null)),
          h('div.k', `${npc.key} · ${npc.file}`),
          ctx.ws.area ? h('div.k.where-short', FRE.ui.whereText(ctx.ws.whereOf(npc.key))) : null));
      }
      if (!shown) el.appendChild(h('div.pad.muted', 'No NPCs match.'));
    },

    renderEditor(el, ctx) {
      const ws = ctx.ws, npc = selNpc(ctx);
      if (!npc) { el.appendChild(h('p.empty-state', 'Select an NPC on the left.')); return; }
      const f = ws.fileOfNpc(npc);
      const canEdit = ws.isEditable(f.name.toLowerCase());
      const chip = npc.venderType === 1 || npc.venderType === 2;
      const chipName = npc.venderType === 2 ? 'Donate' : 'Red';
      const D = ws.defines;
      const entries = npc.statements.map(r => ({ r, e: FRE.character.shopEntry(r) })).filter(x => x.e);
      const line = pos => 'L' + (f.lineOf(pos) + 1);
      const npcName = npc.name || npc.key;

      const E = FRE.npcEditOps, canTexts = E.canEditTexts(ws, npc);
      el.appendChild(h('div.npc-title', h('h2', npc.name || npc.key),
        canTexts ? h('button.icon.edit-btn', { title: 'Edit the name (the name players see; the key stays)', on: { click: () => FRE.ui.npcEdit.renameNpc(ctx, npc) } }, FRE.ui.pencil()) : null,
        placeButton(ctx, npc),
        h('span.def', npc.key),
        h('span.line', `${npc.file}:${f.lineOf(npc.start) + 1}`),
        shopTypeSelect(ctx, npc, canEdit),
        canEdit ? null : h('span.tag.bad', 'read-only')));
      if (ws.placed) {
        const status = FRE.world.npcStatus(npc, ws.placed);
        el.appendChild(h('div.where-row', FRE.ui.whereLine(ws.whereOf(npc.key)),
          status.inGame === false && status.maps.length ? h('span.tag.warn', { title: 'CWorld::IsUsableDYO2: the WorldServer does not load this NPC' }, status.why) : null));
      }
      // a NPC made with "+ New NPC": what the game will load (loaders/newnpc-sim.js)
      if (FRE.ui.newNpc && FRE.ui.newNpc.created.has(npc.key.toLowerCase())) {
        const g = FRE.newNpcSim.inGame(ws, npc.key);
        const name = id => { const it = ws.itemById(id); return it ? (it.name || it.define) : String(id); };
        el.appendChild(h('div.nn-ingame', h('b', 'In game after Save + restart: '), FRE.newNpcSim.describe(g, name).map(l => h('div', l))));
      }
      const menus = npc.menus.map(v => D.byValue('MMI_', v) || String(v));
      // exchange menus: the label players read + how many exchanges; each has its own tab next to the shop tabs
      const exMenu = m => exMenuOf(ws, m);
      const labelOf = m => { const id = D.defines.get(m); const t = id === undefined || !ws.texts ? null : ws.texts.byId.get(FRE.newNpcSim.TID_MMI_DIALOG + id); return t ? t.text : pretty(m); };
      const exNames = FRE.ui.exchangeView ? exMenusOf(ws, npc) : [];
      const showTab = t => { if (FRE.ui.exchangeView) FRE.ui.exchangeView.clearPick(); st.tab = t; ctx.renderAll(false); };
      if (typeof st.tab === 'string' && !exNames.includes(st.tab.slice(3))) st.tab = 0;
      const ownMenu = new Set(npc.statements.filter(r => r.cmd === 'AddMenu').map(r => r.args.menu.value));
      const rmMenu = (i, m) => canEdit && ownMenu.has(npc.menus[i])
        ? h('button.icon.menu-x', { title: `Remove ${m} from the right-click menu`, on: { click: e => { e.stopPropagation(); FRE.ui.npcEdit.removeMenu(ctx, npc, npc.menus[i], exNames.includes(m) ? labelOf(m) : pretty(m)); } } }, '✕') : null;
      // shown as players see it: the in-game label, in the game's order (newNpcSim.rightClick), with what a click does
      const rc = new Map(FRE.newNpcSim.rightClick(ws, npc.menus).map(x => [x.id, x]));
      const order = npc.menus.map((v, i) => i).sort((a, b) => npc.menus[a] - npc.menus[b]);
      el.appendChild(h('div.menus', h('span.menus-label', { title: 'What players see when they right-click this NPC.' }, 'Right-click menu:'), order.map(i => {
        const m = menus[i], x = rc.get(npc.menus[i]);
        const label = (x && x.label) || pretty(m);
        if (x && x.opens && x.opens.board) return h('span.tag.exch-wrap', h('button.tag.board', { title: menuHelp(m, x), on: { click: () => FRE.ui.menuChooser.boardForm(ctx, npc, { id: npc.menus[i], name: m }) } }, label, ' ', FRE.ui.pencil(12)), rmMenu(i, m));
        if (!exNames.includes(m)) return h('span.tag', { title: menuHelp(m, x) }, label, rmMenu(i, m));
        const n = Math.min(exMenu(m).sets.length, 30);
        return h('span.tag.exch-wrap', h('button.tag.exch', { title: `Swap items for other items (${n}). Click to edit.`,
          on: { click: () => showTab('ex:' + m) } }, `${label} ⇄ ${n} exchange${n === 1 ? '' : 's'}`), rmMenu(i, m));
      }), canEdit ? h('button.small.add-menu', { title: 'Add a right-click menu: a shop, a swap list or a rules text', on: { click: () => FRE.ui.menuChooser.open(ctx, npc) } }, '+ Menu') : null));

      const sim = ws.simulate(npc);
      const named = s => npc.slotTitles[s] !== undefined && npc.slotTitles[s] !== '';
      // only tabs the game shows (a name) or that hold items; an unnamed tab is never offered as a place for items
      const shownTabs = [0, 1, 2, 3].filter(t => named(t) || sim.tabs[t].entries.length || sim.tabs[t].dropped.length);
      if (typeof st.tab === 'number' && !shownTabs.includes(st.tab)) st.tab = shownTabs.length ? shownTabs[0] : 0;
      const dupTitles = shownTabs.map(t => npc.slotTitles[t]).filter((x, i, a) => x !== undefined && a.indexOf(x) !== i).length > 0;
      const tabLabel = t => !named(t) ? `Tab ${t + 1} · no name` : dupTitles ? `${t + 1} · ${npc.slotTitles[t]}` : npc.slotTitles[t];
      const tabs = h('div.tabs');
      for (const t of shownTabs) {
        const n = sim.tabs[t].entries.length;
        const sel = t === st.tab;
        tabs.appendChild(h('button' + (sel ? '.sel' : '') + (named(t) ? (FRE.ui.npcEdit.isPlaceholder(npc.slotTitles[t]) ? '.placeholder' : '') : '.unnamed'),
          { title: named(t) ? `Tab ${t + 1} (slot ${t} in the file)` : 'No AddVendorSlot: the game shows no such tab, so these items are invisible', on: { click: () => showTab(t) } },
          named(t) ? '' : '⚠ ', tabLabel(t), h('span.count', n ? `(${n})` : ''),
          sel && named(t) && canTexts ? h('span.tab-edit', { title: 'Edit this tab\'s name', on: { click: e => { e.stopPropagation(); FRE.ui.npcEdit.renameTab(ctx, npc, t); } } }, ' ', FRE.ui.pencil(12)) : null));
      }
      if (canTexts && E.nextSlot(npc) !== null) {
        tabs.appendChild(h('button.add-tab', { title: `Add tab ${E.nextSlot(npc) + 1}: a name players see in the shop window (AddVendorSlot, the d11123ac way)`,
          on: { click: () => FRE.ui.npcEdit.addTab(ctx, npc, slot => { st.tab = slot; }) } }, '+ Tab'));
      }
      for (const m of exNames) {
        const n = Math.min(exMenu(m).sets.length, 30);
        tabs.appendChild(h('button.ex-tab' + ('ex:' + m === st.tab ? '.sel' : ''), { title: `${m}: the exchange window this menu opens`, on: { click: () => showTab('ex:' + m) } },
          `⇄ ${labelOf(m)}`, h('span.count', `(${n})`)));
      }
      el.appendChild(tabs);
      if (typeof st.tab === 'string') { exchangeTab(el, ctx, npc, exMenu(st.tab.slice(3)), labelOf(st.tab.slice(3))); return; }
      const tab = sim.tabs[st.tab];
      const trade = D.defines.get('MMI_TRADE');
      if (npc.menus.includes(trade)) {
        const win = FRE.shopWindow.ofNpc(npc, sim);
        const crash = win.clicks.includes('crash');
        el.appendChild(h('div.shop-window.small' + (crash ? '.bad' : '.muted'), { title: 'Port of the client\'s shop window (loaders/shop-window.js)' },
          'In game (right-click → Trade): ', FRE.shopWindow.describe(win).join(' ')));
      }
      if (!shownTabs.length) {
        el.appendChild(h('p.muted', canTexts ? 'This NPC has no shop tab. + Tab adds one; players also need the Trade menu (+ Menu).' : 'This NPC has no shop tab.'));
        return;
      }
      if (!named(st.tab)) el.appendChild(h('p.bad.small', `Tab ${st.tab + 1} has no name, so the game shows no such tab and players never see the items below. ${canTexts ? 'Name it with + Tab, or move the items to a named tab.' : ''}`));
      else if (FRE.ui.npcEdit.isPlaceholder(npc.slotTitles[st.tab]) && !tab.entries.length)
        el.appendChild(h('p.muted.small', `Players see this tab as "${npc.slotTitles[st.tab]}" (a placeholder name).${canTexts ? ' Rename it with ✎ on the tab, then add items with the + button next to an item in the list on the right.' : ''}`));

      // items the server lists by itself (AddVendorItem: every item of one type) are edited like the others (ui/shop-rules.js)
      const SR = FRE.ui.shopRules;
      // one table: every item players see, in server order, plus fixed items left out
      el.appendChild(h('h3', `Items in this tab (${tab.entries.length}/100)`));
      const rows = tab.entries.map(en => ({ rec: en.source, kind: en.kind, prop: en.prop }))
        .concat(tab.dropped.map(d => ({ rec: d.rec, kind: d.rec.cmd === 'AddShopItem' ? 'fixed' : 'chip', prop: d.prop || null, dropped: d.reason })));
      if (!rows.length) el.appendChild(h('p.muted', `Empty. Add items with the + button next to an item in the list on the right: they go to "${tabLabel(st.tab)}".`));
      else {
        const tb = h('table.items', h('tr', h('th.num', '#'), h('th', 'Item'), h('th', 'Job'),
          h('th.num', chip ? `Price (${chipName} chips)` : 'Price (Penya)'), h('th', 'Tab'), h('th', ''), h('th', 'From')));
        const priced = chip ? [] : ws.pricedTab(npc, st.tab);
        const ruleRow = row => row.kind === 'generated' && !chip && canEdit && named(st.tab);
        const convert = (row, edits, what) => SR.editAuto(ctx, npc, st.tab, edits, what);
        rows.forEach((row, i) => {
          const info = row.prop ? ws.itemInfo(row.prop.item) : null;
          const r = row.rec;
          const editable = row.kind !== 'generated' || ruleRow(row);
          const pay = row.dropped || chip ? null : SR.payLine(priced[i], npc);
          const def = row.prop ? row.prop.item.define : (r.args.item && (r.args.item.define || f.text.slice(r.args.item.start, r.args.item.end)));

  function renameNpc(ctx, npc) {

  // + Menu: a searchable list of every MMI_ id the client can show (< MAX_MOVER_MENU) that this NPC lacks.
  // opts: { title, back } from + Menu (ui/menu-chooser.js)
  function addMenu(ctx, npc, opts = {}) {
    const ws = ctx.ws;
    const have = new Set(npc.menus);
    const seen = new Set();
    const options = [];
    for (const [name, id] of ws.defines.withPrefix('MMI_')) {
      if (id < 0 || id >= 350 || have.has(id) || seen.has(id)) continue;
      seen.add(id);
      const [m] = FRE.newNpcSim.rightClick(ws, [id]);
      if (!m) continue;
      const label = m.label || FRE.ui.pretty(name);
      const group = m.opens ? (m.opens.board ? 'Rules text' : m.opens.sets ? 'Swap items for other items' : 'Swap items (none set up yet)') : 'Opens its own window';
      options.push({ v: name, label, group, find: name });
    }
    options.sort((a, b) => a.group.localeCompare(b.group) || a.label.localeCompare(b.label));
    let pick = null;
    const info = h('div.small.muted', 'Pick a menu. The right-click list shows menus in id order, whatever the order of the lines.');
    const body = h('div', h('label.nn-row', FRE.ui.fieldLabel('Menu', true), FRE.ui.combo({ options, value: null, placeholder: 'Type a menu name (Trade, Bank, …)',
      onPick: v => { pick = v; const ids = [...npc.menus, ws.defines.defines.get(v)];
        info.textContent = 'Right-click will show: ' + FRE.newNpcSim.rightClick(ws, ids).map(x => x.label || x.define).join(', '); } })), info);
    FRE.dom.modal({ title: opts.title || `+ Menu for ${npc.name || npc.key}`, body, buttons: [
      ...(opts.back ? [{ label: '← Back', onClick: opts.back }] : []), { label: 'Cancel' },
      { label: 'Add menu', cls: 'primary', onClick: () => {
        if (!pick) { FRE.dom.toast('Pick a menu first', 'bad'); return false; }
        ctx.edit(npc.file.toLowerCase(), () => O().addMenu(ws, npc, pick), `add menu ${pick}`, 'npc|' + npcId(npc));
      } },
    ] });
  }

  function removeMenu(ctx, npc, id, label) {
    const ws = ctx.ws;
    const trade = ws.defines.defines.get('MMI_TRADE');
    const sells = npc.statements.some(r => FRE.character.shopEntry(r));
    const [m] = FRE.newNpcSim.rightClick(ws, [id]);
    const notes = [];
    if (id === trade && sells) notes.push('Without Trade, players cannot open this shop: its items stay in the file but nobody can buy them.');
    if (m && m.opens && m.opens.board) notes.push('Its text file (Client/Client/NpcBoard_' + id + '.inc) stays; only the right-click entry goes away.');
    else if (m && m.opens) notes.push('The exchanges of this menu stay in Exchange_Script.txt; only the right-click entry goes away.');
    const go = () => ctx.edit(npc.file.toLowerCase(), () => O().removeMenu(ws, npc, id), `remove menu ${label}`, 'npc|' + npcId(npc));
    if (!notes.length) { go(); return; }
    FRE.dom.modal({ title: `Remove "${label}" from ${npc.name || npc.key}?`, body: h('div', notes.map(n => h('p', n))), buttons: [
      { label: 'Cancel' }, { label: 'Remove', cls: 'danger', onClick: go },
    ] });
  }

  // ✎ next to "Where:": move the NPC on its map and / or change its model (task S part 3). Same-length rewrite of
  // its .dyo record (npcEditOps.placePlan), Server + Client. One spot at a time; the model can go on all spots.
  function editPlace(ctx, npc, spotIndex = 0) {
    const ws = ctx.ws;
    const spots = O().placementsOf(ws, npc);
    if (!spots.length) { FRE.dom.toast(`${npc.name || npc.key} stands on no map the server loads.`, 'bad'); return; }
    const name = npc.name || npc.key;
    const modelName = id => { const d = ws.defines.byValue('MI_', id); const mv = ws.movers && ws.movers.movers.get(id); return (mv && mv.name) || d || String(id); };
    const spotText = (p, i) => {
      const w = FRE.newNpcSim.whereAt(ws, p.map, p.x, p.z);
      return `${i + 1} · ${w ? w.label : p.map} · /position ${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}`;
    };
    const place = { modelView: 'used', cache: {} };
    let k = Math.min(spotIndex, spots.length - 1), form, allSpots = false, where = null, btn = null;
    function start() {
      const p = spots[k], r = FRE.ui.npcPlace.regionAt(ws, p.map, p.x, p.z, place.cache);
      // the record's own floats, so an untouched field writes nothing
      form = { region: r ? r.value : `${p.map}|${p.map}`, map: p.map, x: p.x, y: p.y, z: p.z, angle: p.angle, nextTo: null, model: ws.defines.byValue('MI_', p.model) || '' };
    }
    start();
    const body = h('div.newnpc'), checks = h('div.nn-problems'), preview = h('div.nn-preview');
    const to = () => ({ x: form.x, y: form.y, z: form.z, angle: form.angle, model: form.model || null });
    const modelSpots = () => allSpots ? spots.map((_, i) => i) : [k];

    function render() {
      body.textContent = '';
      if (spots.length > 1) {
        body.appendChild(h('div.nn-row', FRE.ui.fieldLabel('Spot', true), h('select', { on: { change: e => { k = Number(e.target.value); start(); render(); } } },
          spots.map((p, i) => h('option', { value: i, selected: i === k }, spotText(p, i)))),
          h('span.muted.small', `${name} stands in ${spots.length} places (one record each). Pick the one to change.`)));
      }
      body.appendChild(h('h3', 'Where'));
      where = FRE.ui.npcPlace.whereFields(ctx, form, { cache: place.cache, onlyMap: spots[k].map, skipAt: spots[k].at, rerender: render, changed: refresh });
      where.rows.forEach(r => body.appendChild(r));
      body.appendChild(h('h3', 'Model'));
      body.appendChild(FRE.ui.npcPlace.modelField(ctx, form, place, { cache: place.cache, rerender: render, changed: refresh,
        keepModel: ws.defines.byValue('MI_', spots[k].model), note: `What the NPC looks like. Now: ${modelName(spots[k].model)}.` }));
      if (spots.length > 1) body.appendChild(h('label.nn-row.small', h('input', { type: 'checkbox', checked: allSpots, on: { change: e => { allSpots = e.target.checked; refresh(); } } }),
        ` Change the model on all ${spots.length} spots (the position changes only on spot ${k + 1})`));
      body.append(...FRE.ui.formFooter({ checks, action: 'Apply changes', previewTitle: 'What players will see / what will be written', preview }));
      refresh();
    }

    function refresh() {
      if (where) where.refreshWhere();
      checks.textContent = ''; preview.textContent = '';
      const diags = [];
      const add = (code, severity, field, message) => diags.push({ code, severity, field, message, key: `${code}|${field}`, module: 'npc' });
      FRE.validateNpcSpot(ws, ws.files.get(spots[k].file), form, add, spots[k].at);
      if (form.model !== ws.defines.byValue('MI_', spots[k].model)) FRE.validateNpcModel(ws, form.model, add);
      const blocked = diags.some(d => d.severity === 'BLOCK');
      let plan = null;
      if (!blocked) { try { plan = O().placePlan(ws, npc, k, to(), modelSpots()); } catch (e) { add('NN_POS', 'BLOCK', 'position', e.message); } }
      if (plan && !plan.changes.length) checks.appendChild(h('div.muted', 'No change.'));   // the spot as it is today: no old warnings
      else {
        diags.forEach(d => checks.appendChild(FRE.ui.diagRow(d)));
        if (plan && !diags.length) checks.appendChild(h('div.ok', '✓ No problem found.'));
      }
      if (btn) btn.disabled = !plan || !plan.changes.length;
      if (!plan) { preview.appendChild(h('p.muted', 'Fix the ⛔ problems to see what changes.')); return; }
      if (!plan.changes.length) return;
      const fmtv = (c, v) => c.field === 'model' ? modelName(v) : c.field === 'angle' ? `${Math.round(v * 10) / 10}°` : String(Math.round(v * 10) / 10);
      const label = { x: 'x', y: 'height (y)', z: 'z', angle: 'facing', model: 'model' };
      preview.appendChild(h('ul.plan.small', plan.changes.map(c => h('li', `${spots.length > 1 ? `Spot ${c.spot + 1}: ` : ''}${label[c.field]} ${fmtv(c, c.from)} → ${fmtv(c, c.to)}`))));
      const w = FRE.newNpcSim.whereAt(ws, form.map, form.x, form.z);
      if (w && plan.changes.some(c => c.field !== 'model')) preview.appendChild(h('p.small', `Players will find ${name} at ${w.label}${w.te ? ` (GM: ${w.te})` : ''}.`));
      for (const part of plan.parts) {
        const sf = ws.files.get(part.file);
        preview.appendChild(h('div.muted.small', `${sf.dir ? sf.dir + '/' : ''}${sf.name} (Server + Client): ${part.splices.length * 4} bytes rewritten in place, same file size — ` +
          part.splices.map(s => `offset ${s.start}`).join(', ')));
      }
    }

    const m = FRE.dom.modal({ title: `Change position / model: ${name}`, body, wide: true, buttons: [
      { label: 'Cancel' },
      { label: 'Apply changes', cls: 'primary', onClick: () => {
        if (btn && btn.disabled) return false;
        let plan;
        try { plan = O().placePlan(ws, npc, k, to(), modelSpots()); } catch (e) { FRE.dom.toast(e.message, 'bad'); return false; }
        const moved = plan.changes.some(c => c.field !== 'model'), remodel = plan.changes.some(c => c.field === 'model');
        ctx.editGroup(() => O().placePlan(ws, npc, k, to(), modelSpots()).parts,
          `${name}: ${[moved ? 'moved' : null, remodel ? `model ${modelName(ws.defines.defines.get(form.model))}` : null].filter(Boolean).join(', ')}`, ['npc|' + npcId(npc)]);
      } },
    ] });
    btn = m.el.querySelector('footer button.primary');
    render();
    return m;
  }

// "+ Menu" in NPC Shops: three kinds of new right-click menu, in plain words (the user, 2026-10-07:
// "a trade that sells something, an exchange list like Collins, or the Rules like in GS"):
//   Shop        Trade + a first tab (npcEditOps.addMenu / addTab)
//   Exchange    the exchange-menu form (ui/menu-form.js, edit/menu-ops.js newMenusPlan)
//   Rules text  a menu that opens a text window (menuOps.boardPlan): needs the npc-board client change,
//               docs/patches/npc-board.diff (Client\NpcBoard_<id>.inc in CWndWorld::OnCommand's default branch)
// plus "Other game window…" (the plain menu list, ui/npc-edit.js addMenu).
(function (FRE) {
  'use strict';
  const { h } = FRE.dom;
  const npcId = npc => `${npc.file}|${npc.key}`;
  const E = () => FRE.npcEditOps;

  function open(ctx, npc) {

    const trade = D.get('MMI_TRADE');
    const hasTrade = npc.menus.includes(trade);
    const inc = npc.file.toLowerCase() === 'character.inc';
    let m = null;
    // each choice opens its form titled "+ Menu for X › <choice>", with ← Back to these choices
    const base = `+ Menu for ${npc.name || npc.key}`;
    const sub = title => ({ title: `${base} › ${title}`, back: () => open(ctx, npc) });
    const card = (title, text, enabled, why, go) => h('button.menu-card', { disabled: !enabled, title: enabled ? '' : why,
      on: { click: () => { m.close(); go(sub(title)); } } }, h('b', title), h('span', text), enabled ? null : h('span.why', why));
    const body = h('div.menu-cards',
      card('Shop', 'Sells items. Players buy with Penya.', !hasTrade || !npc.slotTitles[0], 'This NPC already has a shop: add items with + in the item list.', o => shop(ctx, npc, o)),
      card('Exchange', 'Players give items and get rewards (like Collins).', inc && ws.isEditable('exchange_script.txt') && FRE.ui.menuForm, 'Only for NPCs in character.inc.', o => FRE.ui.menuForm.openNewMenus(ctx, npc, o)),
      card('Rules text', 'A window with your text (like the Guild Siege rules).', inc && ctx.hasClient, inc ? 'Needs the Client folder (the text file goes in Client/Client).' : 'Only for NPCs in character.inc.', o => boardForm(ctx, npc, null, o)));
    m = FRE.dom.modal({ title: base, body, buttons: [
      { label: 'Other game window…', onClick: () => { FRE.ui.npcEdit.addMenu(ctx, npc, sub('Other game window')); } },
      { label: 'Cancel' },

  }

  // Trade (when missing) + the first tab (when none): one undo step
  function shop(ctx, npc, opts = {}) {
    const ws = ctx.ws, trade = ws.defines.defines.get('MMI_TRADE');
    const needTab = !npc.slotTitles[0] && E().nextSlot(npc) === 0;
    const make = name => {
      const parts = [];
      if (!npc.menus.includes(trade)) parts.push({ file: npc.file.toLowerCase(), splices: E().addMenu(ws, npc, 'MMI_TRADE') });
      return needTab ? FRE.shopOps.mergeParts(parts, E().addTab(ws, npc, name).parts) : parts;
    };
    if (!needTab) { ctx.editGroup(() => make(null), `${npc.name || npc.key}: shop added (Trade menu)`, ['npc|' + npcId(npc)]); return; }
    let name = '';
    const input = h('input', { type: 'text', style: 'width:100%', maxlength: 63, placeholder: 'e.g. Scrolls' });
    const checks = h('div');
    const problem = () => (name.trim() ? FRE.newNpcText(name) : 'is empty');
    const refresh = () => { checks.textContent = ''; const p = problem(); checks.appendChild(p ? h('div.bad', `⛔ The tab name ${p}.`) : h('div.ok', '✓ No problem found.')); if (btn) btn.disabled = !!p; };

      h('label.nn-row', FRE.ui.fieldLabel('First tab name', true), input),

    const mm = FRE.dom.modal({ title: opts.title || `Shop for ${npc.name || npc.key}`, body, buttons: [
      ...(opts.back ? [{ label: '← Back', onClick: opts.back }] : []), { label: 'Cancel' },

    ] });

  // How the game draws the text (loaders/board-text.js, a port of CEditString::ParsingString)
  function preview(title, text) {
    const box = h('div.board-preview', h('div.board-title', title || ' '));
    const body = h('div.board-body');
    for (const p of FRE.boardText.parse(text)) {
      const span = h('span', p.text);
      span.style.color = FRE.boardText.css(p.color);
      if (p.bold) span.style.fontWeight = 'bold';
      const deco = [p.underline ? 'underline' : '', p.strike ? 'line-through' : ''].filter(Boolean).join(' ');
      if (deco) span.style.textDecoration = deco;

    }
    box.appendChild(body);
    return box;

  // New rules menu (menu = null) or an existing one { id, name } (label + text changed in place)
  function boardForm(ctx, npc, menu, opts = {}) {
    const ws = ctx.ws, O = FRE.menuOps;
    const oldLabel = menu ? (ws.texts.byId.get(O.TID_MMI_DIALOG + menu.id) || {}).text || '' : '';
    const oldText = menu ? (ws.boardTextOf(menu.id) || '').replace(/\r\n/g, '\n') : '';
    let label = oldLabel, text = oldText;

    const area = h('textarea.board-text', { rows: 12, style: 'width:100%' });
    area.value = text;

    const checks = h('div'), prev = h('div');

    const wrap = (a, b) => {
      const s0 = area.selectionStart, s1 = area.selectionEnd;
      area.value = area.value.slice(0, s0) + a + area.value.slice(s0, s1) + b + area.value.slice(s1);
      area.selectionStart = s0 + a.length; area.selectionEnd = s1 + a.length;

      h('button.small', { title: 'Bold: wraps the selected text in #b … #nb', on: { click: () => wrap('#b', '#nb') } }, h('b', 'B'), ' Bold'),
      h('button.small', { title: 'Colour: wraps the selected text in #cffRRGGBB … #nc', on: { click: () => wrap(FRE.boardText.code(color.value), '#nc') } }, 'Colour'), color,
      h('span.small.muted', ' Select text, then press a button.'));
    const plan = () => {
      if (!menu) return O.boardPlan(ws, { npcKey: npc.key, name: FRE.menuNameFromLabel(ws, label), label, text });
      const parts = [...O.setBoardText(ws, menu.id, text)];

    };
    function refresh() {
      checks.textContent = ''; prev.textContent = ''; nameLine.textContent = '';
      const bad = m => { checks.appendChild(h('div.bad', '⛔ ' + m)); if (btn) btn.disabled = true; };
      const lp = label.trim() ? FRE.newNpcText(label) : 'is empty';
      prev.appendChild(preview(label, text));

      if (!menu) {
        const name = FRE.menuNameFromLabel(ws, label), free = O.freeMenuIds(ws);
        if (!free.length) return bad('No free menu id is left (282-349 are all used).');

      }
      if (menu && label === oldLabel && text.replace(/\r\n/g, '\n') === oldText) { checks.appendChild(h('div.muted', 'No change.')); if (btn) btn.disabled = true; return; }
      let r;
      try { r = plan(); } catch (e) { return bad(e.message.replace(/^the /, 'The ') + '.'); }
      if (btn) btn.disabled = false;
      checks.appendChild(h('div.ok', '✓ No problem found.'));
      checks.appendChild(h('div.warn', '⚠ The game client needs the npc-board change (docs/patches/npc-board.diff, built into Neuz). Without it this menu opens an empty swap window.'));
      for (const p of r.parts) {

      } },
    ] });

    refresh();
    setTimeout(() => labelIn.focus(), 0);
    return m;
  }
